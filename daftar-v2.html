<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendaftaran (Preview) · TurnamenPadel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/tp-theme.css"/>
<style>
  :root{
    --accent:var(--orange); --accent2:var(--orange); --press:var(--orange-hover);
    --danger:#DC2626; --warn:#B45309; --ok:#065F46;
    --r:var(--r-2xl); --r-sm:var(--r-lg);
    --body:var(--sans);
    --grad:linear-gradient(120deg,#FF5722,#FF7A45);
    --inset:#F1F5F9;
  }
  body{font-size:14px;line-height:1.5}
  .wrap{max-width:490px;margin:0 auto;padding:16px;padding-block:16px 52px;}
  h1,h2,h3,h4{font-family:var(--display);font-weight:900;letter-spacing:-.01em;margin:0;}
  a{color:var(--orange);font-weight:600} .faint{color:var(--slate-400)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate-500);}
  .card{background:#fff;border:var(--bd);border-radius:var(--r-2xl);padding:18px;box-shadow:var(--sh-sm);}
  .card+.card{margin-top:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap} .divider{height:2px;background:var(--slate-200);margin:14px 0}
  .note{font-size:12px;color:var(--slate-500);margin-top:6px}
  .hero{position:relative;overflow:hidden;border-radius:var(--r-2xl);border:var(--bd);background:rgba(254,243,199,.5);padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
  .hero .eyebrow{color:var(--orange)} .hero h1{font-size:28px;margin:6px 0 10px;line-height:1.05}
  .prog{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .stepper{display:flex;align-items:center;flex:1}
  .snode{display:flex;align-items:center;flex:1}.snode:last-child{flex:0}
  .dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;border:var(--bd);background:#fff;color:var(--slate-400)}
  .snode.done .dot{background:var(--orange);border-color:var(--dark);color:#fff}
  .snode.cur .dot{border-color:var(--orange);color:var(--orange);box-shadow:0 0 0 4px rgba(255,87,34,.18)}
  .seg-line{flex:1;height:2px;background:var(--slate-300);margin:0 4px}.snode.done .seg-line{background:var(--orange)}
  .steplbl{font-family:var(--mono);font-size:11px;color:var(--slate-500);white-space:nowrap}
  label.f{display:block;margin-bottom:12px}label.f>span{display:block;font-family:var(--mono);font-size:12px;font-weight:700;text-transform:uppercase;color:var(--slate-600);margin-bottom:6px}
  .req{color:var(--orange)}
  input,select,textarea{width:100%;background:#fff;border:var(--bd);color:var(--dark);border-radius:var(--r-lg);padding:11px 12px;font-family:var(--sans);font-size:14px;box-shadow:var(--sh-sm)}
  input:focus,select:focus,textarea:focus{outline:none;box-shadow:var(--sh-sm),0 0 0 3px rgba(255,87,34,.35)}
  textarea{min-height:70px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:430px){.grid2{grid-template-columns:1fr}}
  .btn{appearance:none;border:var(--bd);background:#fff;color:var(--dark);font-family:var(--display);font-weight:800;font-size:14px;padding:12px 16px;border-radius:var(--r-lg);cursor:pointer;box-shadow:var(--sh-sm);transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:translate(2px,2px);box-shadow:none}.btn.primary{background:var(--orange);color:#fff}
  .btn.ghost{background:var(--slate-100)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--sh-sm)}
  .nav{display:flex;gap:10px;margin-top:18px}.nav .btn{flex:1}.nav .btn.ghost{flex:0 0 auto}
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--r-full);border:var(--bd);background:#fff}
  .chip.ok{color:#065F46;border-color:var(--mint);background:var(--mint-20)}
  .chip.warn{color:var(--warn);border-color:var(--amber-bd);background:var(--amber-bg)}
  .elo{font-family:var(--mono);color:var(--orange);font-weight:800}
  .summary{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--orange-10);border:2px solid var(--orange);border-radius:var(--r-lg);padding:9px 13px;margin-bottom:14px}
  .summary .s-fee{font-family:var(--mono);font-weight:800;color:var(--orange)}
  .opt{display:flex;gap:12px;align-items:center;border:var(--bd);border-radius:var(--r-lg);padding:14px;cursor:pointer;background:#fff;box-shadow:var(--sh-sm)}
  .opt.sel{border-color:var(--orange);background:var(--orange-10);box-shadow:var(--sh-sm),0 0 0 3px rgba(255,87,34,.15)}
  .opt.full{border-style:dashed} .opt input{width:auto;margin:0;box-shadow:none} .opt .grow{flex:1}
  .opt .meta{font-family:var(--mono);font-size:11.5px;color:var(--slate-500);margin-top:4px}
  .opt .prize{font-family:var(--display);font-weight:900;font-size:20px;color:var(--orange);line-height:1;text-align:right}
  .opt .prize small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--slate-400);text-transform:uppercase;margin-bottom:2px}
  .quota{display:flex;align-items:center;gap:8px;margin-top:8px}
  .qbar{flex:1;height:8px;border-radius:99px;background:var(--slate-200);border:1px solid var(--dark);overflow:hidden}
  .qbar i{display:block;height:100%;background:var(--orange)}
  .qnum{font-family:var(--mono);font-size:11px;color:var(--slate-500);white-space:nowrap}.qnum.full{color:var(--danger)}
  .wltag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid var(--amber-bd);background:var(--amber-bg);border-radius:6px;padding:2px 7px;margin-top:6px}
  .kv{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--slate-200);font-size:13.5px}.kv:last-child{border:0}
  .kv .ic{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--slate-100);border:var(--bd)}
  .pcard{border:var(--bd);border-radius:var(--r-lg);padding:15px;background:#fff;box-shadow:var(--sh-sm)}.pcard+.pcard{margin-top:13px}
  .avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:16px;color:#fff;background:var(--orange);border:var(--bd)}
  .phead{display:flex;align-items:center;gap:11px;margin-bottom:12px}.phead .who{font-family:var(--display);font-weight:800;font-size:16px}.phead .sub{font-size:11.5px;color:var(--slate-500)}
  .timeline{list-style:none;margin:8px 0 0;padding:0}
  .timeline li{position:relative;padding:0 0 12px 20px;font-size:13px;color:var(--slate-600)}
  .timeline li::before{content:"";position:absolute;left:3px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--orange)}
  .timeline li b{color:var(--dark)}
  .logo{display:inline-flex;align-items:center;gap:10px}
  .logo .glyph{width:32px;height:32px;border-radius:var(--r-lg);background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:14px;border:var(--bd)}
  .logo .name{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:-.01em}.logo .name b{color:var(--orange)}
  /* Sticky header — consistent with the event page (/&lt;slug&gt;) */
  .ev-head{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:var(--bd)}
  .ev-head .inner{max-width:490px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .ev-title{font-family:var(--display);font-weight:900;letter-spacing:-.01em;line-height:1.1;font-size:clamp(17px,3.6vw,22px);color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72%}
  #homeBtn{flex:none}
  .done-hero{text-align:center;padding:8px 0}.done-hero .big{font-size:46px}
  .empty{color:var(--slate-400);text-align:center;padding:40px 0}
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:18px;z-index:50}
  .modal{background:#fff;border:var(--bd);border-radius:var(--r-2xl);padding:20px;max-width:420px;width:100%;box-shadow:var(--sh-lg)}
  .modal h3{font-size:19px;margin-bottom:4px}
  .cropwrap{position:relative;width:280px;max-width:100%;aspect-ratio:1/1;margin:10px auto;border-radius:var(--r-lg);overflow:hidden;background:#0b1220;touch-action:none}
  .cropwrap canvas{display:block;width:100%;height:100%;cursor:grab}
  .cropwrap canvas:active{cursor:grabbing}
  .cropwrap .guide{position:absolute;inset:0;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.28) inset;border:2px dashed rgba(255,255,255,.7);border-radius:8px}
  .croprow{display:flex;align-items:center;gap:10px;margin-top:4px}
  .croprow input[type=range]{flex:1}

  /* ── Nightmode (inherited from the event's per-event theme, set in /engine).
     Carries the dark canvas through the whole registration wizard until done.
     Retunes tp-theme tokens + darkens this page's hardcoded-white surfaces;
     the orange brand + layout are untouched. */
  body[data-theme="nightmode"]{
    --canvas:#0B1120; --card:#131C2E; --dark:#E5E9F0;
    --slate-700:#CBD5E1; --slate-600:#AEBACD; --slate-500:#94A3B8;
    --slate-400:#64748B; --slate-300:#475569; --slate-200:#334155;
    --slate-100:#1E293B; --slate-50:#0F172A; --inset:#1E293B;
    background:#0B1120; color:#E5E9F0;
  }
  body[data-theme="nightmode"] .card,
  body[data-theme="nightmode"] .dot,
  body[data-theme="nightmode"] input,
  body[data-theme="nightmode"] select,
  body[data-theme="nightmode"] textarea,
  body[data-theme="nightmode"] .btn,
  body[data-theme="nightmode"] .chip,
  body[data-theme="nightmode"] .opt,
  body[data-theme="nightmode"] .pcard,
  body[data-theme="nightmode"] .modal{background:#131C2E}
  body[data-theme="nightmode"] .hero{background:rgba(255,87,34,.10)}
  body[data-theme="nightmode"] .ev-head{background:rgba(11,17,32,.95)}
  /* keep the brand-orange & tinted states that must stay coloured */
  body[data-theme="nightmode"] .btn.primary{background:var(--orange);color:#fff}
  body[data-theme="nightmode"] .snode.done .dot{background:var(--orange);color:#fff}
  body[data-theme="nightmode"] .opt.sel{background:var(--orange-10)}
  body[data-theme="nightmode"] .chip.ok{background:var(--mint-20)}
  body[data-theme="nightmode"] .chip.warn{background:var(--amber-bg)}
  /* Home pill stays a white chip with dark text (the local .btn override
     would otherwise darken it into a dark-on-dark, invisible button). */
  body[data-theme="nightmode"] #homeBtn{background:#fff;color:#0F172A}
  body[data-theme="nightmode"] #homeBtn:hover{background:#E2E8F0}
  body[data-theme="nightmode"] #homeBtn .material-symbols-outlined{color:#0F172A}
  /* ── v2 preview polish: match the new event page look (Space Grotesk labels,
     bigger card radius). Design tokens already identical via tp-theme. ── */
  label.f>span, .eyebrow, .steplbl{font-family:'Space Grotesk',var(--mono)}
  .card{border-radius:var(--r-3xl)}
  .pvbadge{position:fixed;left:12px;bottom:12px;z-index:60;font-family:'Space Grotesk';font-size:11px;font-weight:700;
    letter-spacing:.05em;background:var(--dark);color:var(--canvas);padding:5px 10px;border-radius:999px;opacity:.85}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header class="ev-head"><div class="inner">
  <span class="ev-title" id="evTitle"></span>
  <a class="btn btn--white btn--sm" id="homeBtn" href="#"><span class="material-symbols-outlined" style="font-size:16px">home</span>Home</a>
</div></header>
<div class="wrap">
  <div id="head"></div>
  <div id="host"><p class="empty">Memuat…</p></div>
</div>
<div id="modalHost"></div>
<div class="pvbadge">PREVIEW · new form</div>
<script>
const API = "/api";
// Daftar kota/kabupaten Indonesia (subset representatif; bisa diperluas).
const REG_CITIES = ["Kota Jakarta Pusat","Kota Jakarta Utara","Kota Jakarta Barat","Kota Jakarta Selatan","Kota Jakarta Timur","Kota Tangerang","Kota Tangerang Selatan","Kabupaten Tangerang","Kota Bekasi","Kabupaten Bekasi","Kota Depok","Kota Bogor","Kabupaten Bogor","Kota Bandung","Kabupaten Bandung","Kota Cimahi","Kota Serang","Kabupaten Serang","Kota Cilegon","Kota Sukabumi","Kota Cirebon","Kota Bandung Barat","Kota Semarang","Kota Surakarta","Kota Yogyakarta","Kabupaten Sleman","Kabupaten Bantul","Kota Surabaya","Kota Malang","Kota Sidoarjo","Kabupaten Gresik","Kota Denpasar","Kabupaten Badung","Kota Medan","Kota Binjai","Kota Pekanbaru","Kota Batam","Kota Padang","Kota Palembang","Kota Bandar Lampung","Kota Makassar","Kota Manado","Kota Balikpapan","Kota Samarinda","Kota Pontianak","Kota Banjarmasin","Kota Ambon","Kota Jayapura","Kota Mataram","Kota Kupang","Kota Palu","Kota Kendari","Kota Gorontalo","Kota Jambi","Kota Bengkulu","Kota Pangkalpinang","Kota Tanjungpinang","Kota Banda Aceh","Kota Ternate","Kota Sorong"];
const rupiah = n => { const v=parseInt(String(n).replace(/\D/g,"")); return isNaN(v)?String(n||""):"Rp"+v.toLocaleString("id-ID"); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// Accept a raw event ref from: /daftar/<ref>, a friendly root slug /<slug>
// (via the vercel.json catch-all), or ?e=<ref>. The ref may be an eventId
// (EV_/TM_…) or a friendly slug derived from the event name.
function qs(){
  const m=location.pathname.match(/\/daftar(?:-preview)?\/([^\/?#]+)/);
  if(m) return decodeURIComponent(m[1]);
  const seg=location.pathname.replace(/^\/+|\/+$/g,"").split("/").filter(Boolean);
  if(seg.length===1 && seg[0].toLowerCase()!=="daftar" && seg[0].toLowerCase()!=="daftar-preview" && seg[0].indexOf(".")<0) return decodeURIComponent(seg[0]);
  return new URLSearchParams(location.search).get("e")||"";
}
function slugify(s){ return String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80); }
// Full category names / levels (avoid codes like MD/WD/MIXED and raw levels).
function catLabel(c){ const k=String(c||"").trim().toUpperCase(); return {MD:"Men's Doubles",WD:"Women's Doubles",MIXED:"Mixed Doubles",XD:"Mixed Doubles"}[k] || c; }
function levelLabel(l){ const k=String(l||"").toLowerCase().trim().replace(/\s+/g,"_"); return {beginner:"Beginner",upper_beginner:"Upper Beginner",lower_bronze:"Lower Bronze",bronze:"Bronze",upper_bronze:"Upper Bronze",silver:"Silver",gold:"Gold",platinum:"Platinum"}[k] || l; }
function catText(c){ const cl=catLabel(c.label); const lv=levelLabel(c.level); return lv ? (cl+" · "+lv) : cl; }

const F = { eventId:qs(), data:null, step:0, catId:null, teamName:"", qExperience:"", qAchievements:"",
  players:[blankP(),blankP()], waiverA:false, waiverB:false, payFile:"" };
function blankP(){ return {name:"",phone:"",email:"",ig:"",nick:"",dob:"",gender:"",region:"",jersey:"",photo:"",photoUrl:"",decision:null,chk:null,checking:false,cand:null,emailQ:"",emailErr:"",emailBusy:false,otpStage:null,otpMask:"",otpCode:"",otpErr:"",otpBusy:false,otpMsg:""}; }

async function api(path, opts){
  const res = await fetch(API+"/"+path, { method:(opts&&opts.method)||"GET",
    headers:{"Content-Type":"application/json"}, body:opts&&opts.body?JSON.stringify(opts.body):undefined });
  let d={}; try{ d=await res.json(); }catch(e){}
  if(!res.ok){ const err=new Error(d.error||("HTTP "+res.status)); err.status=res.status; throw err; }
  return d;
}
function fileToDataUrl(input){ return new Promise(r=>{ const f=input.files&&input.files[0]; if(!f) return r(""); const rd=new FileReader(); rd.onload=()=>r(rd.result); rd.onerror=()=>r(""); rd.readAsDataURL(f); }); }
// Perkiraan ukuran byte dari data URL base64.
function dataUrlBytes(d){ const i=String(d||"").indexOf(","); const b=i>=0?d.slice(i+1):""; return Math.floor(b.length*3/4); }
// Kompres & perkecil gambar di sisi klien sebelum diunggah, agar tidak melebihi
// batas ukuran request (penyebab HTTP 413). Non-gambar / gagal → baca apa adanya.
function compressImageFile(f, maxDim, quality){
  return new Promise(resolve=>{
    if(!f) return resolve("");
    if(!/^image\//.test(f.type||"")){ const rd=new FileReader(); rd.onload=()=>resolve(rd.result); rd.onerror=()=>resolve(""); rd.readAsDataURL(f); return; }
    const url=URL.createObjectURL(f); const img=new Image();
    img.onload=()=>{ try{
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        const s=Math.min(1,(maxDim||1600)/Math.max(w,h||1)); w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL("image/jpeg",quality||0.82));
      }catch(e){ URL.revokeObjectURL(url); const rd=new FileReader(); rd.onload=()=>resolve(rd.result); rd.onerror=()=>resolve(""); rd.readAsDataURL(f); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); const rd=new FileReader(); rd.onload=()=>resolve(rd.result); rd.onerror=()=>resolve(""); rd.readAsDataURL(f); };
    img.src=url;
  });
}
const IMG_MAX_BYTES=3.5*1024*1024; // ambang aman di bawah batas request serverless

function cat(){ return (F.data.categories||[]).find(c=>c.tournamentId===F.catId); }
function catFull(c){ return c && c.quota>0 && c.filled>=c.quota; }
function isWL(){ return catFull(cat()); }
const STEP_NAME=["Kategori","Eligibility","Pemain 1","Pemain 2","Rangkuman","Persetujuan","Pembayaran"];
function stepKeys(){ return isWL()? ["cat","elig","p1","p2","summary","waiver","done"] : ["cat","elig","p1","p2","summary","waiver","pay","done"]; }
function stepNum(){ const k=stepKeys(); const cur=k[F.step]; const numbered=k.filter(x=>x!=="done"); return {cur, idx:numbered.indexOf(cur)+1, total:numbered.length}; }

async function boot(){
  if(!F.eventId){ document.getElementById("host").innerHTML='<p class="empty">Link tidak valid.</p>'; return; }
  // Resolve a friendly slug (e.g. /nama-event) to the real eventId. Raw
  // eventIds (EV_/TM_…) pass through untouched.
  if(!/^(EV_|TM_)/.test(F.eventId)){
    try{
      const d = await api("tournament/events");
      const want = slugify(F.eventId);
      const hits = (d.events||[]).filter(e => ((e.slug && String(e.slug).toLowerCase()) || slugify(e.name)) === want);
      if(hits.length) F.eventId = hits[hits.length-1].eventId;
    }catch(e){}
  }
  try{ F.data = await api("reg/public/"+encodeURIComponent(F.eventId)); }
  catch(e){ document.getElementById("host").innerHTML='<div class="card"><p class="empty" style="padding:20px 0">'+(e.status===404?"Pendaftaran belum tersedia untuk event ini.":esc(e.message))+'</p></div>'; return; }
  // Per-event theme (set in /engine): carry nightmode through the whole wizard.
  if(F.data && F.data.config && F.data.config.theme==="nightmode") document.body.setAttribute("data-theme","nightmode");
  else document.body.removeAttribute("data-theme");
  // Come straight from the event landing's "Register now" → open the category
  // step directly (skip the intro). When registration is closed, fall back to
  // the info view so the closed state is shown.
  F.started = !!(F.data && F.data.status === "open");
  // Pulihkan draft pendaftaran yang tertunda (browser tertutup / refresh / home).
  if(F.started){ const d=loadDraft();
    if(d){
      const catOk=(F.data.categories||[]).some(c=>c.tournamentId===d.catId);
      F.catId = catOk ? d.catId : "";
      F.teamName = d.teamName||""; F.qExperience = d.qExperience||""; F.qAchievements = d.qAchievements||"";
      F.waiverA=!!d.waiverA; F.waiverB=!!d.waiverB; F.payFile=d.payFile||"";
      if(Array.isArray(d.players)) d.players.forEach((pd,i)=>{ if(F.players[i]) Object.assign(F.players[i], pd); });
      // Jangan pulihkan MELEWATI step yang belum lengkap — hindari mendarat di
      // pembayaran padahal email/data pemain belum terisi (menyebabkan submit gagal).
      const keys=stepKeys();
      let allowed=0; // cat
      if(catOk) allowed=keys.indexOf("elig");
      if(allowed>=keys.indexOf("elig") && eligOK()) allowed=keys.indexOf("p1");
      if(allowed>=keys.indexOf("p1") && allFilled(0) && (F.teamName||"").trim()) allowed=keys.indexOf("p2");
      if(allowed>=keys.indexOf("p2") && allFilled(1)) allowed=keys.indexOf("summary");
      if(allowed>=keys.indexOf("summary") && F.waiverA && F.waiverB){ const pi=keys.indexOf("pay"); allowed=pi>=0?pi:allowed; }
      let step = Number.isInteger(d.step)? d.step : 0;
      step=Math.max(0, Math.min(step, allowed, keys.length-2)); // jangan ke 'done' & jangan lompati step belum lengkap
      F.step=step; F._restored=true;
    }
  }
  // Dari halaman event (Register) → ?cat=<tournamentId>: pilih kategori otomatis
  // dan lompat ke step Eligibility (peserta tak perlu memilih kategori lagi).
  try{
    const catParam=new URLSearchParams(location.search).get("cat");
    if(catParam && F.started){
      const c=(F.data.categories||[]).find(x=>x.tournamentId===catParam);
      if(c && !catFull(c)){
        F.catId=catParam;
        const eligIdx=stepKeys().indexOf("elig");
        if(F.step < eligIdx){ F.step=eligIdx; F._restored=false; }
      }
    }
  }catch(e){}
  render();
}

function draftKey(){ return "tp_reg_draft_"+(F.eventId||""); }

  if(!d||d.eventId!==F.eventId) return null;
  if(d.v!==2){ clearDraft(); return null; } // buang draft skema lama (alur pendaftaran berubah)
  if(Date.now()-(d.ts||0) > 7*24*3600*1000){ clearDraft(); return null; } // kedaluwarsa 7 hari
  return d; }catch(e){ return null; } }
function saveDraft(){
  if(!F.eventId || !F.started) return;
  const k=stepKeys()[F.step]; if(k==="done"||k==="info") return; // jangan simpan draft selesai
  const hasContent = !!F.catId || !!(F.teamName||"").trim() || (F.players||[]).some(p=>String(p.name||"").trim()); // jangan simpan draft kosong
  if(!hasContent){ return; }
  const snap={ v:2, ts:Date.now(), eventId:F.eventId, catId:F.catId, teamName:F.teamName||"", qExperience:F.qExperience||"", qAchievements:F.qAchievements||"", step:F.step,
    waiverA:!!F.waiverA, waiverB:!!F.waiverB, payFile:F.payFile||"",
    players:(F.players||[]).map(p=>({name:p.name,phone:p.phone,email:p.email,ig:p.ig,nick:p.nick,dob:p.dob,gender:p.gender,region:p.region,jersey:p.jersey,photo:p.photo||"",photoUrl:p.photoUrl||"",decision:p.decision})) };
  try{ localStorage.setItem(draftKey(), JSON.stringify(snap)); }
  catch(e){ // kemungkinan quota (gambar base64 besar) → simpan tanpa gambar
    try{ const lite=JSON.parse(JSON.stringify(snap)); lite.payFile=""; lite.players.forEach(p=>{ p.photo=""; }); localStorage.setItem(draftKey(), JSON.stringify(lite)); }catch(e2){}

}

async function lookupEmail(i){ const p=F.players[i]; const email=String(p.emailQ||"").trim();
  if(!/.+@.+\..+/.test(email)){ p.emailErr="Masukkan email yang valid."; render(); return; }
  p.emailBusy=true; p.emailErr=""; render();

  catch(e){ p.emailBusy=false; p.emailErr="Gagal mencari. Coba lagi."; render(); return; }
  p.emailBusy=false;
  if(!r.found){ p.emailErr="Email belum terdaftar di Trekkr. Cari dengan nama di bawah, atau buat data baru."; render(); return; }
  const e=r.eligibility||{}; if(e.state==='block'){ p.emailErr="⛔ Level akun ini di atas plafon kategori — tidak bisa daftar di kategori ini."; render(); return; }
  p.cand={ name:r.name, verified:r.verified, verify:{ available:true, emailMask:r.emailMask||"" } };

// ===== Cropper foto pemain (kotak) — pan + zoom, tanpa library =====
let CROP=null;
function openCropper(i,file){
  if(!/^image\//.test(file.type||"")){ // bukan gambar → kompres langsung
    compressImageFile(file,1600,0.82).then(d=>{ const p=F.players[i]; if(d){p.photo=d;p.photoWarn="";}else{p.photoWarn="Gagal membaca file.";} updatePlayerNav(i);scheduleSave();render(); });
    return;
  }
  const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{
    const VIEW=280;
    const base=Math.max(VIEW/img.naturalWidth, VIEW/img.naturalHeight);
    CROP={ i, img, url, VIEW, base, zoom:1, ox:0, oy:0, drag:null };
    centerCrop();
    document.getElementById("modalHost").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeCrop()">
      <div class="modal"><h3>Atur foto pemain</h3><div class="note" style="margin-bottom:6px">Geser untuk memposisikan, gunakan slider untuk zoom. Foto disimpan berbentuk kotak.</div>
        <div class="cropwrap"><canvas id="cropCv" width="280" height="280"></canvas><div class="guide"></div></div>
        <div class="croprow"><span class="note">Zoom</span><input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1" oninput="cropSetZoom(this.value)"></div>
        <div class="nav" style="margin-top:12px"><button class="btn ghost" onclick="closeCrop()">Batal</button><button class="btn primary" onclick="applyCrop()">Simpan foto</button></div>
      </div></div>`;
    const cv=document.getElementById("cropCv");
    cv.addEventListener("pointerdown",cropDown); cv.addEventListener("pointermove",cropMove);
    cv.addEventListener("pointerup",cropUp); cv.addEventListener("pointercancel",cropUp); cv.addEventListener("pointerleave",cropUp);
    drawCrop();
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); compressImageFile(file,1600,0.82).then(d=>{ const p=F.players[i]; if(d){p.photo=d;p.photoWarn="";}else{p.photoWarn="Gagal membaca file.";} updatePlayerNav(i);scheduleSave();render(); }); };
  img.src=url;
}
function cropScale(){ return CROP.base*CROP.zoom; }
function clampCrop(){ const s=cropScale(), dw=CROP.img.naturalWidth*s, dh=CROP.img.naturalHeight*s, V=CROP.VIEW;
  CROP.ox=Math.min(0,Math.max(V-dw,CROP.ox)); CROP.oy=Math.min(0,Math.max(V-dh,CROP.oy)); }
function centerCrop(){ const s=cropScale(); CROP.ox=(CROP.VIEW-CROP.img.naturalWidth*s)/2; CROP.oy=(CROP.VIEW-CROP.img.naturalHeight*s)/2; clampCrop(); }
function drawCrop(){ const cv=document.getElementById("cropCv"); if(!cv||!CROP) return; const ctx=cv.getContext("2d"); const s=cropScale();
  ctx.clearRect(0,0,CROP.VIEW,CROP.VIEW); ctx.drawImage(CROP.img,CROP.ox,CROP.oy,CROP.img.naturalWidth*s,CROP.img.naturalHeight*s); }
function cropSetZoom(v){ if(!CROP) return; const V=CROP.VIEW, old=cropScale();
  // jaga titik tengah tetap
  const cx=(V/2-CROP.ox)/old, cy=(V/2-CROP.oy)/old;
  CROP.zoom=parseFloat(v)||1; const s=cropScale(); CROP.ox=V/2-cx*s; CROP.oy=V/2-cy*s; clampCrop(); drawCrop(); }
function cropDown(e){ if(!CROP) return; e.preventDefault(); CROP.drag={x:e.clientX,y:e.clientY,ox:CROP.ox,oy:CROP.oy}; try{e.target.setPointerCapture(e.pointerId);}catch(_){} }
function cropMove(e){ if(!CROP||!CROP.drag) return; e.preventDefault(); CROP.ox=CROP.drag.ox+(e.clientX-CROP.drag.x); CROP.oy=CROP.drag.oy+(e.clientY-CROP.drag.y); clampCrop(); drawCrop(); }
function cropUp(e){ if(CROP) CROP.drag=null; }
function closeCrop(){ if(CROP&&CROP.url){ try{URL.revokeObjectURL(CROP.url);}catch(_){} } CROP=null; document.getElementById("modalHost").innerHTML=""; }
function applyCrop(){ if(!CROP) return; const OUT=640, k=OUT/CROP.VIEW, s=cropScale();
  const cv=document.createElement("canvas"); cv.width=OUT; cv.height=OUT; const ctx=cv.getContext("2d");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,OUT,OUT);
  ctx.drawImage(CROP.img, CROP.ox*k, CROP.oy*k, CROP.img.naturalWidth*s*k, CROP.img.naturalHeight*s*k);
  let d=""; try{ d=cv.toDataURL("image/jpeg",0.85); }catch(_){}
  const i=CROP.i, p=F.players[i]; closeCrop();
  if(!d){ p.photoWarn="Gagal memproses foto. Coba lagi."; render(); return; }
  if(dataUrlBytes(d)>IMG_MAX_BYTES){ p.photoWarn="⚠️ Foto masih terlalu besar. Coba foto lain."; render(); return; }
  p.photo=d; p.photoWarn=""; updatePlayerNav(i); scheduleSave(); render();
}
// Kartu kandidat: daftar nama mirip yang bisa dipilih pendaftar.
function candList(i){ const p=F.players[i]; const cs=(p.chk&&p.chk.candidates)||[];
  if(!cs.length){
    return `<div class="card" style="margin-top:10px;background:var(--inset)">
      <div class="note">🔎 Tidak ada nama mirip di Trekkr untuk "<b>${esc(p.name)}</b>".</div>
      <div class="nav" style="margin-top:8px"><button class="btn primary" onclick="buatBaru(${i})">Buat data baru</button></div></div>`;
  }
  const rows=cs.map((c,idx)=>{ const e=c.eligibility||{}, blk=e.state==='block';
    return `<div class="opt" style="align-items:center;${blk?'opacity:.6':''}">
      <div class="grow"><b>${esc(c.name)}</b> <span class="elo">${esc(c.tier)} ${c.elo}</span>
        ${c.verified?'<span class="chip ok" style="margin-left:6px">✔ terverifikasi</span>':''}
        ${c.enrolledInCategory?'<span class="chip warn" style="margin-left:6px">sudah terdaftar di kategori ini</span>':''}
        ${blk?'<div class="note" style="margin-top:4px">⛔ Level di atas plafon kategori</div>':(e.msg?`<div class="note" style="margin-top:4px">${esc(e.msg)}</div>`:'')}</div>
      <button class="btn ${blk?'ghost':'primary'}" ${blk?'disabled':''} onclick="chooseCandidate(${i},${idx})">Ini saya</button></div>`;}).join("");
  return `<div class="card" style="margin-top:10px;background:var(--inset)">
    <div class="note" style="margin-bottom:8px">Pilih namamu bila terdaftar di Trekkr — kami akan verifikasi lewat email dulu:</div>
    <div style="display:flex;flex-direction:column;gap:9px">${rows}</div>
    <div class="divider" style="margin:12px 0"></div>
    <div class="note">Namamu tidak ada di daftar?</div>
    <div class="nav" style="margin-top:6px"><button class="btn ghost" onclick="buatBaru(${i})">Buat data baru</button></div></div>`;
}
function otpBlock(i){ const p=F.players[i]; const nm=candName(p);
  const head=`<div class="row" style="justify-content:space-between;align-items:center"><span>Verifikasi: <b>${esc(nm)}</b></span>
      <a href="#" onclick="event.preventDefault();backToChooser(${i})" class="note">↩ pilih nama lain</a></div>`;
  if(p.otpStage==="nomail"){
    return `<div class="card" style="margin-top:10px;background:var(--inset)">${head}
      <div class="note" style="margin-top:8px">✔ Profil <b>${esc(nm)}</b> ada di Trekkr, tapi <b>belum ada email terdaftar</b> — jadi tidak perlu verifikasi. Pakai profil ini (ELO &amp; rekam jejak tetap tertaut) lalu isi email &amp; no HP kamu sendiri.</div>
      <div class="nav" style="margin-top:8px"><button class="btn primary" ${p.otpBusy?'disabled':''} onclick="useNoEmail(${i})">${p.otpBusy?'Memuat…':'Pakai profil ini & lengkapi kontak'}</button>
        <button class="btn ghost" ${p.otpBusy?'disabled':''} onclick="buatBaru(${i})">Buat baru</button></div></div>`;
  }
  // Jalan keluar: email terdaftar ternyata bukan miliknya → buat akun baru saja.
  const notMine=`<div class="divider" style="margin:12px 0"></div>
    <div class="note">Email di atas <b>bukan punyamu</b>? Berarti ini bukan profilmu.</div>
    <div class="nav" style="margin-top:6px"><button class="btn ghost" ${p.otpBusy?'disabled':''} onclick="buatBaru(${i})">Buat data baru</button></div>`;
  if(p.otpStage==="sent"){
    return `<div class="card" style="margin-top:10px;background:var(--inset)">${head}
      <div class="note" style="margin:8px 0 6px">🔐 Kami kirim <b>kode 6 digit</b> ke <b>${esc(p.otpMask)}</b> (berlaku 24 jam). Masukkan kode untuk membuka datamu.</div>
      <label class="f"><span>Kode verifikasi <span class="req">*</span></span>
        <input id="otp_${i}" value="${esc(p.otpCode||"")}" oninput="F.players[${i}].otpCode=this.value" inputmode="numeric" maxlength="6" placeholder="______" autocomplete="one-time-code" style="letter-spacing:6px;font-weight:700;text-align:center"></label>
      ${p.otpErr?`<div class="note" style="color:#DC2626;margin-top:6px">${esc(p.otpErr)}</div>`:""}
      <div class="nav" style="margin-top:8px"><button class="btn primary" ${p.otpBusy?'disabled':''} onclick="confirmOtp(${i})">${p.otpBusy?'Memverifikasi…':'Verifikasi & pakai data'}</button>
        <button class="btn ghost" ${p.otpBusy?'disabled':''} onclick="startOtp(${i})">Kirim ulang</button></div>
      ${notMine}</div>`;
  }
  return `<div class="card" style="margin-top:10px;background:var(--inset)">${head}
    <div class="note" style="margin:8px 0 4px">Untuk melindungi data pribadi, kami kirim <b>kode ke email terdaftar${p.cand&&p.cand.verify&&p.cand.verify.emailMask?' ('+esc(p.cand.verify.emailMask)+')':''}</b> sebelum data dibuka.</div>
    ${p.otpErr?`<div class="note" style="color:#DC2626;margin-top:6px">${esc(p.otpErr)}</div>`:""}
    <div class="nav" style="margin-top:8px"><button class="btn primary" ${p.otpBusy?'disabled':''} onclick="startOtp(${i})">${p.otpBusy?'Mengirim kode…':'Kirim kode verifikasi'}</button></div>
    ${notMine}</div>`;
}
function profileForm(i,on){ const p=F.players[i];
  const rows=[];
  rows.push(`<label class="f"><span>Nama lengkap (sesuai KTP) <span class="req">*</span></span><input value="${esc(p.name)}" oninput="setF(${i},'name',this.value)" placeholder="Nama lengkap sesuai KTP"></label>`);
  if(on("nick")) rows.push(`<label class="f"><span>Nama alias <span class="req">*</span></span><input value="${esc(p.nick)}" oninput="setF(${i},'nick',this.value)" placeholder="nama panggilan"></label>`);
  rows.push(`<label class="f"><span>Instagram <span class="req">*</span></span><input value="${esc(p.ig)}" oninput="setF(${i},'ig',this.value)" placeholder="@username"></label>`);
  rows.push(`<div class="grid2"><label class="f"><span>No. HP <span class="req">*</span></span><input value="${esc(p.phone)}" oninput="setF(${i},'phone',this.value)" placeholder="0812..."></label><label class="f"><span>Email <span class="req">*</span></span><input type="email" value="${esc(p.email)}" oninput="setF(${i},'email',this.value)" placeholder="nama@mail.com"></label></div>`);
  const dg=[];
  if(on("gender")) dg.push(`<label class="f"><span>Gender <span class="req">*</span></span><select onchange="setF(${i},'gender',this.value)"><option value="">—</option><option ${p.gender==='L'?'selected':''}>L</option><option ${p.gender==='P'?'selected':''}>P</option></select></label>`);
  if(on("dob")) dg.push(`<label class="f"><span>Tanggal lahir <span class="req">*</span></span><input type="date" value="${esc(p.dob)}" oninput="setF(${i},'dob',this.value)"></label>`);
  if(dg.length) rows.push(`<div class="grid2">${dg.join("")}</div>`);
  if(on("region")) rows.push(`<label class="f"><span>Region / kota <span class="req">*</span></span><input list="cities" value="${esc(p.region)}" oninput="setF(${i},'region',this.value)" placeholder="ketik kota…"></label>`);
  if(on("jersey")) rows.push(`<label class="f"><span>Ukuran jersey <span class="req">*</span></span>${jerseyChart()}<select onchange="setF(${i},'jersey',this.value)">${jerseyOptions(p.jersey)}</select></label>`);
  if(on("photo")){ const cur=(p.photo||p.photoUrl)?`<img src="${esc(p.photo||p.photoUrl)}" alt="" style="width:64px;height:64px;object-fit:cover;border:var(--bd);border-radius:10px">`:'<span class="chip">belum ada</span>';
    rows.push(`<label class="f"><span>Foto <span class="req">*</span></span><div class="row" style="align-items:center;gap:12px"><div id="ph_${i}">${cur}</div><input type="file" accept="image/*" onchange="pickPhoto(${i},this)" style="flex:1"></div>${p.photoWarn?`<div class="chip warn" style="margin-top:6px;display:inline-block">${esc(p.photoWarn)}</div>`:''}</label>`); }
  return rows.join("");
}
function vPlayer(i){ const p=F.players[i], on=fieldsOn();
  const block=profileForm(i,on);
  const canNext = !!(allFilled(i) && (i!==0 || (F.teamName||"").trim()));
  const teamField = i===0
    ? `<label class="f"><span>Nama tim <span class="req">*</span></span>
         <input id="teamName" value="${esc(F.teamName||"")}" oninput="F.teamName=this.value;updatePlayerNav(0);scheduleSave()" placeholder="mis. Smash Bros" autocomplete="off"></label>
       <div class="note" style="margin:-4px 0 12px">Nama tim akan tampil di daftar peserta &amp; bracket.</div>`
    : "";
  return `<div class="card">
    <div class="phead" style="margin-bottom:12px"><div class="avatar">${esc((p.name||('#'+(i+1))).charAt(0).toUpperCase())}</div>
      <div><div class="who">Pemain ${i+1}</div><div class="sub">${i===0?'mulai dari pemain 1':'lanjut ke pemain 2'}</div></div></div>
    <datalist id="cities">${REG_CITIES.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    ${teamField}
    ${block}
    <div class="nav"><button class="btn ghost" onclick="go('${i===0?'elig':'p1'}')">←</button>
      <button class="btn primary" id="pNext_${i}" ${canNext?'':'disabled'} onclick="go('${i===0?'p2':'summary'}')">Lanjut →</button></div></div>`;
}

// Step 4: rangkuman kategori + pemain 1 & 2 → Confirm → disclaimer.
function editSummary(i,flag){ F.players[i]._editSum=flag; render(); }
function vSummary(){
  const c=cat(), wl=isWL(), on=fieldsOn();
  const showNick=on("nick"), showJersey=on("jersey");
  const pl=(i)=>{ const p=F.players[i], editing=!!p._editSum;
    let extra="";
    if(showNick||showJersey){
      if(editing){
        const parts=[];
        if(showNick) parts.push(`<label class="f" style="margin:0"><span>Nama alias</span><input value="${esc(p.nick)}" oninput="setF(${i},'nick',this.value)" placeholder="nama panggilan"></label>`);
        if(showJersey) parts.push(`<label class="f" style="margin:0"><span>Ukuran jersey</span><select onchange="setF(${i},'jersey',this.value)">${jerseyOptions(p.jersey)}</select></label>`);
        extra=`<div class="grid2" style="margin-top:8px">${parts.join("")}</div>
          <div style="margin-top:8px"><button class="btn ghost" onclick="editSummary(${i},false)">✔ Selesai</button></div>`;
      } else {
        const bits=[];
        if(showNick) bits.push(`Alias: <b>${esc(p.nick||'—')}</b>`);
        if(showJersey) bits.push(`Jersey: <b>${esc(p.jersey||'—')}</b>`);
        extra=`<div class="note" style="margin-top:4px">${bits.join(" · ")} · <a href="#" onclick="event.preventDefault();editSummary(${i},true)">✏ revisi</a></div>`;
      }
    }
    return `<div class="kv"><span class="ic">🎾</span><div><div class="note">Pemain ${i+1}</div><b>${esc(p.name||'—')}</b>${extra}</div></div>`;
  };
  return `<div class="card">
    <div class="eyebrow">Rangkuman pendaftaran</div>
    ${wl?`<div class="card" style="border-color:rgba(255,209,102,.4);margin:10px 0;background:var(--inset)"><b class="mono" style="color:var(--warn)">⏳ Kuota penuh — masuk waitlist</b><div class="note">Belum ada pembayaran. Kamu diundang membayar via email jika ada slot.</div></div>`:''}
    <div class="kv" style="margin-top:10px"><span class="ic">🏆</span><div><div class="note">Kategori</div><b>${esc(catText(c))}</b> · ${wl?'bayar nanti':rupiah(c.fee)}</div></div>
    ${pl(0)}
    ${pl(1)}
    <div class="nav" style="margin-top:14px"><button class="btn ghost" onclick="go('p2')">←</button>
      <button class="btn primary" onclick="go('waiver')">Confirm →</button></div></div>`;
}
function vWaiver(){
  const w=F.data.config.waiver||"Dengan mendaftar, peserta menyetujui ketentuan penyelenggara.";
  const wl=isWL();
  const nextBtn = wl
    ? `<button class="btn primary" id="subBtn" ${F.waiverA&&F.waiverB?'':'disabled'} onclick="submitReg()">✅ Kirim pendaftaran</button>`
    : `<button class="btn primary" ${F.waiverA&&F.waiverB?'':'disabled'} onclick="go('pay')">Lanjut →</button>`;
  return `<div class="card"><div class="eyebrow">Persetujuan &amp; disclaimer</div>
    <div class="card" style="max-height:180px;overflow:auto;background:var(--inset);margin-top:10px"><p class="muted" style="margin:0;font-size:13px;white-space:pre-line">${esc(w)}</p></div>
    <label style="display:flex;gap:11px;align-items:flex-start;margin-top:14px;cursor:pointer"><input type="checkbox" style="width:auto;margin-top:3px" ${F.waiverA?'checked':''} onchange="F.waiverA=this.checked;render()"><span>Kami setuju atas <b>waiver &amp; disclaimer</b>.</span></label>
    <label style="display:flex;gap:11px;align-items:flex-start;margin-top:10px;cursor:pointer"><input type="checkbox" style="width:auto;margin-top:3px" ${F.waiverB?'checked':''} onchange="F.waiverB=this.checked;render()"><span>Seluruh informasi yang kami berikan <b>benar</b>.</span></label>
    <div id="subErr"></div>
    <div class="nav"><button class="btn ghost" onclick="go('summary')">←</button>${nextBtn}</div></div>`;
}
function copyText(txt, el){ const done=()=>{ if(el){ const o=el.textContent; el.textContent="✔ tersalin"; setTimeout(()=>{el.textContent=o;},1400); } };
  try{ navigator.clipboard.writeText(txt).then(done, ()=>fallbackCopy(txt,done)); }catch(e){ fallbackCopy(txt,done); } }
function fallbackCopy(txt, done){ try{ const t=document.createElement("textarea"); t.value=txt; t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t); t.select(); document.execCommand("copy"); document.body.removeChild(t); done&&done(); }catch(e){} }
function vPay(){
  const c=cat(), pay=(F.data.config.payment||{}), acct=pay.account||"—";
  const acctDigits=String(acct).replace(/\D/g,"");
  return `<div class="card"><div class="eyebrow">Pembayaran</div>
    <div class="card" style="background:var(--inset);margin-top:10px">
      <div class="row" style="justify-content:space-between;align-items:center"><span class="muted">Total (${esc(catLabel(c.label))})</span><b class="elo" style="font-size:20px">${rupiah(c.fee)}</b></div>
      <div class="divider"></div><div class="muted" style="font-size:13px">Transfer ke${pay.bank?' ('+esc(pay.bank)+')':''}${pay.name?' a.n. '+esc(pay.name):''}:</div>
      <div class="row" style="align-items:center;gap:10px;margin-top:6px">
        <div class="mono" id="acctNo" style="font-size:18px;font-weight:700;letter-spacing:1px">${esc(acct)}</div>
        ${acctDigits?`<button class="btn ghost" style="padding:6px 12px" onclick="copyText('${esc(acctDigits)}',this)">📋 Salin</button>`:''}
      </div>
    </div>
    <label class="f" style="margin-top:14px"><span>Upload bukti transfer <span class="req">*</span></span><input type="file" accept="image/*" onchange="pickPay(this)"><div class="note" style="margin-top:4px">Foto otomatis diperkecil agar upload lancar.</div></label>
    ${F.payWarn?`<div class="chip warn" style="margin:2px 0 8px;display:inline-block">${esc(F.payWarn)}</div>`:''}
    ${F.payFile
      ? `<div style="margin-top:10px"><div class="note" style="margin-bottom:6px">✔ Pratinjau bukti transfer:</div>
          <img src="${esc(F.payFile)}" alt="bukti transfer" style="max-width:100%;max-height:280px;border:var(--bd);border-radius:12px;display:block">
          <div style="margin-top:6px"><a href="#" onclick="event.preventDefault();document.querySelector('input[type=file]').click()" class="note">↻ Ganti bukti</a></div></div>`
      : '<span class="chip" style="margin-top:8px;display:inline-block">belum ada bukti</span>'}
    <div id="subErr"></div>
    <div class="nav"><button class="btn ghost" onclick="go('waiver')">←</button>
      <button class="btn primary" id="subBtn" ${F.payFile?'':'disabled'} onclick="submitReg()">✅ Kirim pendaftaran</button></div></div>`;
}
async function pickPay(input){ const f=input.files&&input.files[0]; if(!f) return;
  const d=await compressImageFile(f,1600,0.82);
  if(!d){ F.payWarn="Gagal membaca file. Coba screenshot/foto lain."; F.payFile=""; render(); return; }
  if(dataUrlBytes(d)>IMG_MAX_BYTES){ F.payWarn="⚠️ Bukti transfer terlalu besar. Gunakan screenshot (bukan foto layar) atau perkecil ukurannya."; F.payFile=""; render(); return; }
  F.payFile=d; F.payWarn=""; render();
}
async function submitReg(){
  // Safety net: pastikan data kedua pemain lengkap sebelum kirim — bila belum,
  // arahkan kembali ke step pemain yang kurang (hindari error dari server).
  for(var pi=0; pi<2; pi++){
    if(!allFilled(pi) || (pi===0 && !(F.teamName||"").trim())){
      alert("Lengkapi dulu data "+(pi===0?"Pemain 1 (termasuk nama tim)":"Pemain 2")+" — nama, Instagram, No. HP, dan email wajib diisi.");
      go(pi===0?"p1":"p2"); return;
    }
  }
  const btn=document.getElementById("subBtn"); if(btn){ btn.disabled=true; btn.textContent="Mengirim…"; }
  const body={ category:F.catId, waiver:F.waiverA, infoTrue:F.waiverB, teamName:(F.teamName||"").trim(),
    answers:{ experience:(F.qExperience||"").trim(), achievements:(F.qAchievements||"").trim() },
    players:F.players.map(p=>({name:p.name,phone:p.phone,email:p.email,ig:p.ig,nick:p.nick,dob:p.dob,gender:p.gender,region:p.region,jersey:p.jersey})),
    photo1:F.players[0].photo||F.players[0].photoUrl||"", photo2:F.players[1].photo||F.players[1].photoUrl||"", paymentProof:isWL()?"":F.payFile };
  try{ const r=await api("reg/register/"+encodeURIComponent(F.eventId), {method:"POST", body});
    F.result=r; clearDraft(); F._restored=false; go("done");
  }catch(e){ const el=document.getElementById("subErr");
    const tooBig = e.status===413 || /413/.test(String(e.message||""));
    const msg = tooBig ? "File foto/bukti terlalu besar. Ganti dengan foto beresolusi lebih kecil atau screenshot, lalu kirim ulang." : ("Gagal: "+esc(e.message));
    if(el) el.innerHTML='<div class="chip warn" style="margin-top:10px">'+ (tooBig?"⚠️ ":"") + msg +'</div>';
    if(btn){ btn.disabled=false; btn.textContent="✅ Kirim pendaftaran"; } }
}
function passportUrl(nm){ return "https://trekkr.online/player/"+encodeURIComponent(nm||""); }
function vDone(){
  const wl=(F.result&&F.result.waitlist)||isWL();
  const tl=F.data.config.timeline||{};
  const c=cat();
  const p1=F.players[0]||{}, p2=F.players[1]||{};
  const passBtns=`<div class="eyebrow">Player Passport kamu di Trekkr</div>
    <div class="nav" style="margin-top:8px;flex-wrap:wrap">
      <a class="btn primary" href="${esc(passportUrl(p1.name))}" target="_blank" rel="noopener">🎾 ${esc(p1.name||'Pemain 1')} →</a>
      <a class="btn ghost" href="${esc(passportUrl(p2.name))}" target="_blank" rel="noopener">🎾 ${esc(p2.name||'Pemain 2')} →</a></div>`;
  return `<div class="card"><div class="done-hero"><div class="big">${wl?'⏳':'🎉'}</div>
      <h2 style="font-size:24px;margin-top:6px">${wl?'You\'re on the waitlist':'Registration successful!'}</h2>
      <span class="chip ${wl?'warn':'ok'}" style="margin-top:8px">Status: ${wl?'waitlist':'waiting for committee approval'}</span></div>
    <div class="card" style="margin-top:12px;background:var(--inset)">
      <div class="note" style="margin:0">You registered for <b>${esc(catText(c))}</b> with <b>${esc(p1.name||'—')}</b> &amp; <b>${esc(p2.name||'—')}</b>.</div>
      ${wl
        ? '<div class="note" style="margin-top:8px">The quota is full — you are on the waitlist and no payment is required yet. If a slot opens up, the committee will email you to continue to payment.</div>'
        : '<div class="note" style="margin-top:8px"><b>Please wait for the committee\'s approval.</b> The committee will review your payment proof and confirm your spot. Once approved, you\'ll receive a confirmation email and be invited to the participants\' WhatsApp group (WAG).</div>'}
    </div>
    <div class="divider"></div>${passBtns}
    ${(tl.curationStart||tl.tmDate||tl.oopDate)?`<div class="divider"></div><div class="eyebrow">What's next</div><ul class="timeline" style="margin-top:8px">${tl.curationStart?'<li><b>'+esc(tl.curationStart)+'</b> — curation</li>':''}${tl.tmDate?'<li><b>'+esc(tl.tmDate)+'</b> — Technical Meeting + group</li>':''}${tl.oopDate?'<li><b>'+esc(tl.oopDate)+'</b> — order of play</li>':''}</ul>`:''}
    <p class="note">Keep this page as your registration receipt.</p></div>`;
}
boot();
</script>
