<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Scorer Desk — TurnamenPadel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F8FAFC; --panel:#FFFFFF; --panel2:#F1F5F9; --line:#E2E8F0;
    --text:#0F172A; --muted:#64748B; --faint:#94A3B8;
    --accent:#FF5722; --accent2:#FF7A45; --danger:#DC2626; --warn:#B45309; --ok:#10B981;
    --r:14px; --r-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Plus Jakarta Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5;
    background-image:radial-gradient(900px 500px at 85% -10%, rgba(255,106,0,.08), transparent 60%); background-attachment:fixed;}
  .wrap{max-width:1440px; margin:0 auto; padding:22px 18px 90px; position:relative; z-index:1;}

  header{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:14px; flex-wrap:wrap;}
  .brand{display:flex; align-items:baseline; gap:11px;}
  .logo{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:24px; letter-spacing:-.02em;}
  .logo .dot{color:var(--accent);}
  .tag{font-family:'Space Grotesk',monospace; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); border:1px solid var(--line); padding:4px 8px; border-radius:6px;}
  .hactions{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted);}
  .hactions a{color:var(--muted); text-decoration:none; border:1px solid var(--line); padding:6px 10px; border-radius:8px;}
  .hactions a:hover{border-color:var(--accent); color:var(--text);}
  .hactions .who b{color:var(--text);}

  select,input[type=time],input[type=text],input[type=number]{background:#F1F5F9; border:1px solid var(--line); color:var(--text); padding:10px 12px; border-radius:var(--r-sm); font-family:inherit; font-size:14px; outline:none;}
  select:focus,input:focus{border-color:var(--accent);}
  .pickrow{display:flex; gap:12px; flex-wrap:wrap; align-items:end; margin-bottom:12px;}
  .pick label{display:block; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;}
  .pick select{min-width:230px;}

  .btn{font-family:inherit; font-weight:700; font-size:13.5px; border:none; border-radius:var(--r-sm); padding:10px 15px; cursor:pointer; transition:transform .08s, filter .15s; display:inline-flex; align-items:center; gap:8px;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent); color:var(--bg);} .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--line);} .btn-ghost:hover{border-color:var(--accent);}
  .btn-sm{padding:8px 11px; font-size:12.5px;}

  /* Event + category sub-title (the only place the category is written) */
  .subtitle{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:2px 2px 14px;}
  .subtitle .ev{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:26px; letter-spacing:-.01em;}
  .subtitle .catpill{font-family:'Space Grotesk',monospace; font-size:12.5px; font-weight:700; color:#fff; background:var(--accent2); padding:4px 10px; border-radius:999px;}
  .subtitle .meta{font-size:12.5px; color:var(--muted);}

  /* Live-links panel: scorer / LED / player */
  .links{background:linear-gradient(180deg,var(--panel),var(--panel2)); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:16px;}
  .links h4{margin:0 0 10px; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:16px; display:flex; align-items:center; gap:8px;}
  .linkblock{margin-bottom:11px;}
  .linkblock:last-child{margin-bottom:0;}
  .linklabel{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;}
  .linkgrid{display:flex; flex-wrap:wrap; gap:9px; align-items:center;}
  .linkchip{display:inline-flex; align-items:center; gap:8px; background:#F1F5F9; border:1px solid var(--line); border-radius:999px; padding:7px 12px; font-family:'Space Grotesk',monospace; font-size:12.5px; color:var(--text); cursor:pointer; text-decoration:none;}
  .linkchip:hover{border-color:var(--accent);}
  .linkchip .cn{color:var(--accent2); font-weight:700;}
  .linkchip.led .cn{color:var(--warn);}
  .linkchip.player .cn{color:var(--ok);}
  .liveflag{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--ok); background:rgba(56,211,159,.12); border-radius:999px; padding:5px 11px;}

  /* Tabs */
  .tabbar{display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:16px;}
  .tabbtn{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:16px; letter-spacing:.01em; background:transparent; border:none; color:var(--muted); padding:10px 16px; cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-1px;}
  .tabbtn:hover{color:var(--text);}
  .tabbtn.active{color:var(--text); border-bottom-color:var(--accent);}

  /* Per-round rows (grouped by time); 4 courts per row */
  .roundrow{margin-bottom:22px;}
  .roundhead{display:flex; align-items:baseline; gap:10px; margin:0 2px 12px; padding-bottom:7px; border-bottom:1px solid var(--line);}
  .roundhead .rn{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:22px; letter-spacing:-.01em;}
  .roundhead .cnt{font-family:'Space Grotesk',monospace; font-size:11px; color:var(--faint);}
  .roundgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:start;}
  @media (max-width:1200px){ .roundgrid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:900px){ .roundgrid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .roundgrid{grid-template-columns:1fr;} }

  .mcard{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 12px;}
  .mcard.st-done{border-color:rgba(56,211,159,.30);}
  .mtop{display:flex; align-items:center; gap:7px; margin-bottom:9px; flex-wrap:wrap;}
  /* COURT & GROUP must be clearly visible */
  .cbig{font-family:'Plus Jakarta Sans',sans-serif; color:#fff; background:var(--accent); font-weight:800; padding:3px 10px; border-radius:6px; font-size:14px; letter-spacing:.02em;}
  .gbig{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:14px; color:var(--text); border:1.5px solid var(--line); padding:2px 9px; border-radius:6px; letter-spacing:.01em;}
  .mtop .badge{margin-left:auto; font-weight:700; font-size:10px; padding:2px 7px; border-radius:999px; font-family:'Space Grotesk',monospace;}
  .badge.st-empty{color:var(--faint); border:1px solid var(--line);}
  .badge.st-done{color:var(--ok); background:rgba(56,211,159,.13);}
  .badge.st-saving{color:var(--warn); background:rgba(255,209,102,.13);}
  .badge.st-error{color:var(--danger); background:rgba(255,111,96,.13);}

  .tnm{font-size:11px; color:var(--accent2); font-weight:700; margin:0 0 2px;}
  .team{display:flex; align-items:center; gap:9px; padding:4px 0;}
  .team .nm{flex:1; font-size:13.5px; font-weight:600; word-break:break-word;}
  .team.win .nm{color:var(--accent);}
  .team .sin{width:52px; text-align:center; font-family:'Space Grotesk',monospace; font-size:17px; font-weight:700; background:#F1F5F9; border:1.5px solid var(--line); color:var(--text); border-radius:9px; padding:7px 4px; outline:none;}
  .team .sin:focus{border-color:var(--accent);}
  .sep{height:1px; background:var(--line); margin:1px 0;}

  /* Name & team editor */
  .nameedit{margin:6px 0 2px; padding:9px; background:#F1F5F9; border:1px solid var(--line); border-radius:10px; display:none;}
  .nameedit.open{display:block;}
  .nameedit .grp{margin-bottom:8px;}
  .nameedit .glab{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); margin-bottom:4px;}
  .nameedit input{width:100%; padding:7px 9px; font-size:12.5px; margin-bottom:5px;}
  .nameedit .row2{display:flex; gap:6px;}
  .nameedit .row2 input{flex:1;}

  .sched{display:flex; align-items:center; gap:7px; margin-top:9px; flex-wrap:wrap;}
  .sched label{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint);}
  .sched select,.sched input{padding:6px 8px; font-size:12.5px; border-radius:8px;}
  .sched select{min-width:60px;}
  .sched input[type=time]{width:104px;}
  .mactions{display:flex; gap:7px; margin-top:9px; flex-wrap:wrap;}
  .mactions .btn{flex:1; justify-content:center; min-width:96px;}
  .mactions .btn.edit{flex:0 0 auto; min-width:0;}

  /* Standings */
  .stgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px;}
  .stcard{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px;}
  .stcard h3{margin:0 0 8px; font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:19px;}
  table.st{width:100%; border-collapse:collapse; font-size:13px;}
  table.st th{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); text-align:center; padding:5px 4px; border-bottom:1px solid var(--line); font-weight:700;}
  table.st th.tteam,table.st td.tteam{text-align:left;}
  table.st td{padding:6px 4px; text-align:center; border-bottom:1px solid rgba(255,255,255,.04);}
  table.st td.rk{color:var(--faint); font-family:'Space Grotesk',monospace;}
  table.st tr.q td.rk,table.st tr.top td.rk,table.st tr.champ td.rk{color:var(--accent); font-weight:700;}
  table.st tr.champ{background:rgba(255,87,34,.05);} table.st tr.prosp{opacity:.72;}
  table.st td.tteam{font-weight:600;}
  .stnote{font-size:10.5px; color:var(--faint); margin-bottom:8px; line-height:1.4;}
  /* Bracket generate controls */
  .brctrls{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:14px;}
  .brctrls .brlbl{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:14px;}
  .brctrls .brhint{font-family:'Space Grotesk',monospace; font-size:10.5px; color:var(--faint); margin-left:auto;}

  /* Bracket */
  .brtier{margin-bottom:22px;}
  .brtier h3{margin:0 0 10px; font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:20px;}
  .podium{display:flex; gap:9px; flex-wrap:wrap; margin-bottom:12px;}
  .podium .p{font-size:12.5px; padding:6px 11px; border-radius:999px; border:1px solid var(--line);}
  .podium .p b{color:var(--accent);}
  .brrounds{display:flex; gap:16px; overflow-x:auto; padding-bottom:6px; align-items:flex-start;}
  .brcol{min-width:210px;}
  .brcol .rlab{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:8px; font-weight:700;}
  .brm{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:10px;}
  .brm .bl{display:flex; justify-content:space-between; gap:8px; font-size:12.5px; padding:2px 0;}
  .brm .bl .s{font-family:'Space Grotesk',monospace; color:var(--muted);}
  .brm .bl.win{color:var(--accent); font-weight:700;} .brm .bl.win .s{color:var(--accent);}
  .brm .bmeta{font-family:'Space Grotesk',monospace; font-size:10px; color:var(--faint); margin-top:3px;}

  /* Command bar + collapsible rounds (Courts tab) */
  .cmdbar{position:sticky; top:0; z-index:8; background:rgba(248,250,252,.95); backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; margin-bottom:14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .cmdbar .cprog{font-family:'Space Grotesk',monospace; font-size:12px; color:var(--muted);} .cmdbar .cprog b{color:var(--text);}
  .cmdbar .cctrl,.cmdbar .cdurs{display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:6px 9px;}
  .cmdbar label{font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .cmdbar input[type=time]{padding:5px 6px; font-size:13px; border-radius:7px; width:96px;}
  .cmdbar .dd{display:flex; flex-direction:column; align-items:center; gap:2px;}
  .cmdbar .dd i{font-family:'Space Grotesk',monospace; font-size:9px; font-weight:700; color:var(--muted); font-style:normal;}
  .cmdbar .dd span{display:flex; align-items:center; gap:2px; font-size:9px; color:var(--faint);}
  .cmdbar .dd input{width:38px; text-align:center; padding:4px 3px; font-family:'Space Grotesk',monospace; font-weight:700; font-size:12px; border-radius:6px;}

  .rd{border:1px solid var(--line); border-radius:var(--r); background:var(--panel); margin-bottom:11px; overflow:hidden;}
  .rdhead{display:flex; align-items:center; gap:10px; padding:9px 12px; flex-wrap:wrap;}
  .rdhead .tri{color:var(--accent); font-size:12px; transition:transform .18s; cursor:pointer; width:15px; flex:none;}
  .rd.open .rdhead .tri{transform:rotate(90deg);}
  .rdhead .rn{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:18px; letter-spacing:-.01em; cursor:pointer;}
  .rdhead .stg{font-family:'Space Grotesk',monospace; font-size:10px; font-weight:700; color:var(--accent); background:rgba(255,87,34,.10); padding:2px 8px; border-radius:999px;}
  .rdhead .rtime{display:flex; align-items:center; gap:6px; font-family:'Space Grotesk',monospace; font-size:12px; color:var(--muted);}
  .rdhead .rtime input[type=time]{padding:4px 6px; font-size:12px; border-radius:7px; width:92px;}
  .rdhead .rtime .arr{color:var(--faint);}
  .rdhead .rpill{font-family:'Space Grotesk',monospace; font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px; margin-left:auto;}
  .rpill.live{color:var(--warn); background:rgba(180,83,9,.12);} .rpill.up{color:var(--muted); background:var(--panel2); border:1px solid var(--line);} .rpill.ok{color:var(--ok); background:rgba(16,185,129,.14);}
  .rdhead .rcnt{font-family:'Space Grotesk',monospace; font-size:11px; color:var(--faint);}
  .rdbody{display:none; padding:0 12px 12px;} .rd.open .rdbody{display:block;}
  .mcat{font-family:'Space Grotesk',monospace; font-size:10px; font-weight:700; color:#fff; background:var(--accent2); padding:2px 8px; border-radius:999px; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .empty{color:var(--muted); font-size:13.5px; padding:14px 4px;}
  .empty.err{color:var(--danger);}
  #toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); z-index:50; background:#FFFFFF; border:1px solid var(--line); border-left:3px solid var(--accent); color:var(--text); padding:12px 18px; border-radius:10px; font-size:13.5px; box-shadow:0 10px 30px rgba(0,0,0,.4); opacity:0; transition:opacity .2s, transform .2s; max-width:90vw;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #toast.err{border-left-color:var(--danger);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="logo">Turnamen<span class="dot">Padel</span></span><span class="tag">Scorer Desk</span></div>
    <div class="hactions">
      <span class="who">Admin: <b id="who">—</b></span>
      <a href="/engine">Engine</a>
      <a href="#" onclick="logout();return false;">Log out</a>
    </div>
  </header>

  <div class="pickrow">
    <div class="pick" id="eventPick">
      <label>Event</label>
      <select id="eventSelect" onchange="onPickEvent(this.value)"><option value="">— select event —</option></select>
    </div>
    <div class="pick">
      <label>Category</label>
      <select id="catSelect" onchange="onPickCat(this.value)"><option value="">—</option></select>
    </div>
    <button type="button" class="btn btn-primary" onclick="reload()">↻ Refresh</button>
  </div>

  <div class="subtitle" id="subtitle" style="display:none;"></div>

  <div class="links" id="linksPanel" style="display:none;">
    <h4>Links <span id="liveFlag"></span></h4>
    <div class="linkblock">
      <div class="linklabel">Scorer — per court (share with each court's marshal, no login)</div>
      <div class="linkgrid" id="scorerGrid"></div>
    </div>
    <div class="linkblock">
      <div class="linklabel">LED / TV — big screen</div>
      <div class="linkgrid" id="ledGrid"></div>
    </div>
    <div class="linkblock">
      <div class="linklabel">Player — participant board (schedule, standings, bracket)</div>
      <div class="linkgrid" id="playerGrid"></div>
    </div>
    <div style="margin-top:12px;"><button type="button" class="btn btn-ghost btn-sm" id="setLiveBtn" onclick="setLive()">Set this event as Live</button></div>
  </div>

  <div class="tabbar" id="tabbar" style="display:none;">
    <button type="button" class="tabbtn active" data-tab="courts" onclick="switchTab('courts')">Courts &amp; Scores</button>
    <button type="button" class="tabbtn" data-tab="standings" onclick="switchTab('standings')">Standings</button>
    <button type="button" class="tabbtn" data-tab="bracket" onclick="switchTab('bracket')">Bracket</button>
  </div>

  <div id="tabCourts"><p class="empty">Pick an event to start scoring.</p></div>
  <div id="tabStandings" style="display:none;"></div>
  <div id="tabBracket" style="display:none;"></div>
</div>
<div id="toast"></div>

<script>
let SESSION=null;
try{ SESSION=JSON.parse(sessionStorage.getItem("tp_session")||localStorage.getItem("tp_session")||"null"); }catch(e){}
// Not signed in → go to the shared admin login, and come BACK here after login
// (not to /engine) via ?next=.
if(!SESSION || !SESSION.username){ location.replace("/admin.html?next="+encodeURIComponent(location.pathname)); }
const BASE = location.protocol.startsWith("http") ? "/api" : "https://www.turnamenpadel.com/api";
const ORIGIN = location.origin;
const LEVEL={beginner:"Beginner",upper_beginner:"Upper Beginner",lower_bronze:"Lower Bronze",bronze:"Bronze",upper_bronze:"Upper Bronze",silver:"Silver",gold:"Gold",platinum:"Platinum"};
const TIER_LABEL={MAIN:"Main Draw",PLATE:"Plate",PLATINUM:"Platinum",GOLD:"Gold",SILVER:"Silver",BRONZE:"Bronze"};
// Stage → durasi (menit). Default; bisa diadjust di command bar (disimpan per event di localStorage).
const STAGE_ORDER=["group","r32","r16","qf","sf","final","bronze"];
const STAGE_LABEL={group:"Grup",r32:"32 Besar",r16:"16 Besar",qf:"8 Besar",sf:"Semifinal",final:"Final",bronze:"Juara 3"};
const DUR_DEFAULT={group:25,r32:25,r16:30,qf:35,sf:40,final:60,bronze:40};
function stageFromLabel(lbl){ lbl=String(lbl||"");
  if(/3rd|juara 3|bronze/i.test(lbl))return"bronze";
  if(/semifinal/i.test(lbl))return"sf";
  if(/\bfinal\b/i.test(lbl))return"final";
  if(/quarter|8 besar/i.test(lbl))return"qf";
  if(/round of 16|16 besar/i.test(lbl))return"r16";
  if(/round of 32|32 besar/i.test(lbl))return"r32";
  return"group"; }

const state={ session:SESSION, events:[], eventId:"", event:null, payload:null, categories:[], catId:"", matches:[], allMatches:[], durations:{...DUR_DEFAULT}, openRounds:{}, entrantsById:{}, liveEventId:"", numCourts:1, tab:"courts" };

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const isInt=v=>/^\d+$/.test(String(v).trim());
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function cssid(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g,"_"); }
function slugify(s){ return String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80)||"event"; }
function fmtTime(t){ const s=String(t==null?"":t).trim(); if(!s) return ""; const p=s.split(/[:.]/); let h=parseInt(p[0],10),m=parseInt(p[1],10); if(isNaN(h)) return s; if(isNaN(m))m=0; return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`; }
function tkey(t){ const s=fmtTime(t); if(!s) return 1e9; const [h,m]=s.split(":"); return (parseInt(h)||0)*60+(parseInt(m)||0); }
function toast(msg,isErr){ const t=$("toast"); t.textContent=msg; t.className=isErr?"err show":"show"; clearTimeout(t._t); t._t=setTimeout(()=>{ t.className=t.className.replace("show","").trim(); },3200); }
function logout(){ try{ sessionStorage.removeItem("tp_session"); localStorage.removeItem("tp_session"); }catch(e){} location.replace("/admin.html?next="+encodeURIComponent(location.pathname)); }

async function rawFetch(path,opts={}){ const res=await fetch(`${BASE}/${path}`,{ method:opts.method||"GET", headers:{"Content-Type":"application/json"}, body:opts.body?JSON.stringify(opts.body):undefined }); let data={}; try{ data=await res.json(); }catch(e){} return {res,data}; }
async function api(path,opts={}){ const {res,data}=await rawFetch(path,opts); if(!res.ok){ const e=new Error(data.error||`HTTP ${res.status}`); e.status=res.status; throw e; } return data; }
async function apiWithRetry(path,opts={},tries=4){ let delay=500,lastErr; for(let i=0;i<tries;i++){ try{ const {res,data}=await rawFetch(path,opts); if(res.ok) return data; if(res.status>=500||res.status===429){ lastErr=new Error(data.error||`HTTP ${res.status}`);} else { const e=new Error(data.error||`HTTP ${res.status}`); e.status=res.status; e.fatal=true; throw e; } }catch(e){ if(e.fatal) throw e; lastErr=e; } if(i<tries-1){ await sleep(delay); delay=Math.min(delay*2,4000);} } throw lastErr; }

function catLabel(c){ return {MD:"Men's Doubles",WD:"Women's Doubles",MIXED:"Mixed"}[c]||c||""; }
function catFullLabel(cat){ return catLabel(cat.category)+(cat.level?(" "+(LEVEL[cat.level]||cat.level)):""); }
function tierLabel(t){ return TIER_LABEL[t]||t||"Bracket"; }
function roundLabel(round,numRounds){ if(String(round)==="BRONZE") return "3rd Place"; const r=parseInt(round),fe=numRounds-r; if(fe===0)return"Final"; if(fe===1)return"Semifinal"; if(fe===2)return"Quarterfinal"; if(fe===3)return"Round of 16"; return "Round "+r; }
function downstreamDoneCount(info){
  const b=info.bracket; if(!b) return 0;
  const r0=parseInt(info.round); if(isNaN(r0)) return 0;
  const at=(rr,ii)=>{ const rd=(b.rounds||[]).find(x=>parseInt(x.round)===rr); return rd?(rd.matches||[]).find(m=>(m.idx||0)===ii):null; };
  let cnt=0, r=r0, i=parseInt(info.idx)||0;
  while(r < info.numRounds){ const p=at(r+1, Math.floor(i/2)); if(p && p.status==="DONE") cnt++; i=Math.floor(i/2); r++; }
  if(r0 === info.numRounds-1 && b.bronze && b.bronze.status==="DONE") cnt++;
  return cnt;
}

// ---- events ----
async function loadEvents(){
  const s=state.session||{};
  const q="?admin="+encodeURIComponent(s.username||"")+"&role="+encodeURIComponent(s.role||"");
  const [{events}, settingsRes] = await Promise.all([
    api("tournament/events"+q),
    api("settings").catch(()=>({settings:{}})),
  ]);
  state.events=events||[];
  state.liveEventId=(settingsRes.settings&&settingsRes.settings.liveEventId)||"";
  const sel=$("eventSelect");
  sel.innerHTML='<option value="">— select event —</option>'+state.events.map(e=>`<option value="${esc(e.eventId)}">${esc(e.name)}${e.date?" · "+esc(e.date):""}</option>`).join("");
  let def=localStorage.getItem("tp_court_admin_event")||"";
  if(!(def && state.events.some(e=>e.eventId===def))) def=(state.liveEventId && state.events.some(e=>e.eventId===state.liveEventId))?state.liveEventId:(state.events[0]&&state.events[0].eventId)||"";
  // Admin ter-assign satu event → sembunyikan pemilih event (auto-buka event-nya).
  // Pemilih hanya tampil untuk superadmin, atau admin dengan >1 event.
  const role=String((s.role)||"").toLowerCase();
  const showPicker = role==="superadmin" || state.events.length>1;
  const ep=$("eventPick"); if(ep) ep.style.display = showPicker ? "" : "none";
  if(def){ sel.value=def; await onPickEvent(def); }
}
async function onPickEvent(eventId){
  state.eventId=eventId; state.matches=[]; state.event=null; state.payload=null; state.categories=[]; state.catId="";
  if(!eventId){ $("tabCourts").innerHTML='<p class="empty">Select an event.</p>'; $("linksPanel").style.display="none"; $("tabbar").style.display="none"; $("subtitle").style.display="none"; $("catSelect").innerHTML='<option value="">—</option>'; localStorage.removeItem("tp_court_admin_event"); return; }
  localStorage.setItem("tp_court_admin_event",eventId);
  await load();
}
function onPickCat(catId){
  state.catId=catId;
  try{ if(state.eventId) localStorage.setItem("tp_court_admin_cat_"+state.eventId, catId); }catch(e){}
  buildForCat(); renderSubtitle(); renderActive();
}

// Flatten one category's matches (group + playoff) into scorer cards.
function flattenCat(cat){
  const out=[];
  const ent=cat.entrants||{};
  const attach=(o,eidA,eidB)=>{ const a=ent[eidA]||{},b=ent[eidB]||{};
    o.aP1=a.player1||""; o.aP2=a.player2||""; o.aTeam=a.teamName||"";
    o.bP1=b.player1||""; o.bP2=b.player2||""; o.bTeam=b.teamName||""; return o; };
  (cat.schedule||[]).forEach(m=>{
    out.push(attach({ kind:"group", tid:cat.tournamentId, matchId:m.matchId, court:parseInt(m.court)||0, slot:m.slot||0, time:m.time||"",
      label:"Group "+(m.groupLabel||""), nameA:m.teamA, nameB:m.teamB, entrantA:m.entrantA, entrantB:m.entrantB, scoreA:m.scoreA, scoreB:m.scoreB, winner:m.winner, status:m.status }, m.entrantA, m.entrantB));
  });
  (cat.playoff||[]).forEach(b=>{
    const push=(m,slot,label)=>{ if(!m||!m.entrantA||!m.entrantB) return; out.push(attach({ kind:"playoff", tid:cat.tournamentId, matchId:m.matchId, court:parseInt(m.court)||0, slot:slot, time:m.time||"", label:label, nameA:m.teamA, nameB:m.teamB, entrantA:m.entrantA, entrantB:m.entrantB, scoreA:m.scoreA, scoreB:m.scoreB, winner:m.winner, status:m.status, round:m.round, idx:m.idx, numRounds:b.numRounds, bracket:b }, m.entrantA, m.entrantB)); };
    (b.rounds||[]).forEach(r=>(r.matches||[]).forEach(m=>push(m,(parseInt(m.round)||0)*100+(m.idx||0),roundLabel(m.round,b.numRounds))));
    if(b.bronze) push(b.bronze,99999,"3rd Place");
  });
  return out;
}
function currentCat(){ return state.categories.find(c=>c.tournamentId===state.catId)||null; }
function buildForCat(){
  const cat=currentCat();
  state.matches = cat ? flattenCat(cat) : [];
  state.entrantsById = {};
  if(cat){ const ent=cat.entrants||{}; Object.keys(ent).forEach(eid=>{ state.entrantsById[eid]={...ent[eid], tid:cat.tournamentId}; }); }
}
// Gabungkan SEMUA kategori jadi satu daftar match (untuk tab Courts, fokus court).
function buildAll(){
  state.allMatches=[]; state.entrantsById={};
  (state.categories||[]).forEach(cat=>{
    const catLbl=catFullLabel(cat);
    const ent=cat.entrants||{}; Object.keys(ent).forEach(eid=>{ state.entrantsById[eid]={...ent[eid], tid:cat.tournamentId}; });
    flattenCat(cat).forEach(m=>{ m.catLabel=catLbl; m.stage = m.kind==="playoff" ? stageFromLabel(m.label) : "group"; state.allMatches.push(m); });
  });
}
// Durasi per-stage: default → config event (roundDurations) → override lokal per event.
function loadDurations(){
  const d={...DUR_DEFAULT};
  const cfg=(state.event&&state.event.roundDurations)||(state.payload&&state.payload.roundDurations)||null;
  if(cfg) Object.keys(d).forEach(k=>{ if(cfg[k]) d[k]=parseInt(cfg[k])||d[k]; });
  try{ const ov=JSON.parse(localStorage.getItem("tp_desk_dur_"+state.eventId)||"null"); if(ov) Object.keys(d).forEach(k=>{ if(ov[k]) d[k]=parseInt(ov[k])||d[k]; }); }catch(e){}
  state.durations=d;
}
function saveDurationsLocal(){ try{ localStorage.setItem("tp_desk_dur_"+state.eventId, JSON.stringify(state.durations)); }catch(e){} }
function addMin(t,min){ const b=tkey(t); if(b>=1e9) return ""; const x=((b+min)%1440+1440)%1440; return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0"); }

async function load(){
  $("tabCourts").innerHTML='<p class="empty">Loading…</p>';
  try{
    const payload=await api(`tournament/event/${encodeURIComponent(state.eventId)}/public?live=1`);
    state.payload=payload;
    state.event=payload.event||null;
    state.numCourts=Math.max(1,(payload.event&&payload.event.numCourts)||1);
    state.categories=payload.categories||[];
    // choose category: remembered -> first
    let want=""; try{ want=localStorage.getItem("tp_court_admin_cat_"+state.eventId)||""; }catch(e){}
    if(!(want && state.categories.some(c=>c.tournamentId===want))) want=(state.categories[0]&&state.categories[0].tournamentId)||"";
    state.catId=want;
    const cs=$("catSelect");
    cs.innerHTML=state.categories.length ? state.categories.map(c=>`<option value="${esc(c.tournamentId)}" ${c.tournamentId===want?"selected":""}>${esc(catFullLabel(c))}</option>`).join("") : '<option value="">— no categories yet —</option>';
    buildForCat(); buildAll(); loadDurations(); state.openRounds={};
    renderSubtitle(); renderLinks(); $("tabbar").style.display=state.categories.length?"":"none";
    updateCatPickVisibility();
    renderActive();
  }catch(e){ $("tabCourts").innerHTML=`<p class="empty err">Failed to load: ${esc(e.message)}</p>`; }
}
function reload(){ if(state.eventId) load(); }

function renderSubtitle(){
  const st=$("subtitle"); const cat=currentCat();
  if(!state.event){ st.style.display="none"; return; }
  const meta=[state.event.venue, state.event.date].filter(Boolean).join(" · ");
  st.innerHTML=`<span class="ev">${esc(state.event.name||"")}</span>`
    + (cat?`<span class="catpill">${esc(catFullLabel(cat))}</span>`:"")
    + (meta?`<span class="meta">${esc(meta)}</span>`:"");
  st.style.display="";
}

function courtNumbers(){
  const set=new Set();
  for(let i=1;i<=state.numCourts;i++) set.add(i);
  (state.allMatches.length?state.allMatches:state.matches).forEach(m=>{ if(m.court>0) set.add(m.court); });
  return [...set].sort((a,b)=>a-b);
}

// ---- links: scorer / LED / player ----
function renderLinks(){
  const nums=courtNumbers();
  const isLive=state.liveEventId===state.eventId;
  $("liveFlag").innerHTML=isLive?'<span class="liveflag"><i>●</i> LIVE</span>':'';
  $("setLiveBtn").textContent=isLive?"This event is Live ✓":"Set this event as Live";
  $("setLiveBtn").disabled=isLive;
  const suffix=isLive?"":("?e="+encodeURIComponent(state.eventId));
  $("scorerGrid").innerHTML=nums.map(n=>{
    const url=ORIGIN+"/court"+n+suffix;
    return `<span class="linkchip" title="Click to copy" onclick="copyLink('${esc(url)}')"><span class="cn">/court${n}</span> ${isLive?"":'<span style="color:var(--faint)">'+esc(suffix)+'</span>'}</span>`;
  }).join("");
  // Use the event's frozen slug (rename-safe); fall back to the name-derived slug.
  const slug=String(state.event&&state.event.slug||"").trim()||slugify(state.event&&state.event.name);
  // LED/TV: short URL for the remote-navigable picker (easy to type on a TV remote).
  const tvUrl=ORIGIN+"/tv";
  const mbUrl=ORIGIN+"/mobile/"+encodeURIComponent(slug);
  $("ledGrid").innerHTML=`<a class="linkchip led" href="${esc(tvUrl)}" target="_blank" rel="noopener"><span class="cn">/tv</span> ↗</a>`
    +`<span class="linkchip led" title="Copy" onclick="copyLink('${esc(tvUrl)}')">Copy</span>`;
  $("playerGrid").innerHTML=`<a class="linkchip player" href="${esc(mbUrl)}" target="_blank" rel="noopener"><span class="cn">/mobile/${esc(slug)}</span> ↗</a>`
    +`<span class="linkchip player" title="Copy" onclick="copyLink('${esc(mbUrl)}')">Copy</span>`;
  $("linksPanel").style.display="";
}
function copyLink(url){ (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast("Link copied: "+url)).catch(()=>toast(url)); }
async function setLive(){
  try{ await api("settings",{method:"POST",body:{key:"liveEventId",value:state.eventId}}); state.liveEventId=state.eventId; renderLinks(); toast("This event is now Live — /court1 etc. point here ✓"); }
  catch(e){ toast("Failed: "+e.message,true); }
}

// ---- courts tab ----
const byCid={};
// Command bar: progress + Mulai R1 + durasi per stage (+ Terapkan jadwal).
function cmdBarHtml(waves){
  const D=state.durations||DUR_DEFAULT;
  const done=state.allMatches.filter(m=>m.status==="DONE").length, tot=state.allMatches.length;
  const durInputs=STAGE_ORDER.map(s=>`<div class="dd"><i>${esc(STAGE_LABEL[s])}</i><span><input id="dur-${s}" value="${D[s]||DUR_DEFAULT[s]}" inputmode="numeric">m</span></div>`).join("");
  const base=(waves&&waves[0]&&waves[0].time)?fmtTime(waves[0].time):"";
  return `<div class="cmdbar">
    <div class="cprog">Selesai <b>${done}</b>/<b>${tot}</b> match</div>
    <div class="cctrl"><label>Mulai R1</label><input type="time" id="baseTime" value="${esc(base)}"></div>
    <div class="cdurs"><label>Durasi/stage</label>${durInputs}<button type="button" class="btn btn-primary btn-sm" onclick="applySchedule()">Terapkan jadwal</button></div>
  </div>`;
}
function wavesOf(){
  const groups={};
  state.allMatches.forEach(m=>{ const k=m.time||""; (groups[k]=groups[k]||[]).push(m); });
  let keys=Object.keys(groups).sort((a,b)=>{ if(a===b)return 0; if(a==="")return 1; if(b==="")return -1; return tkey(a)-tkey(b); });
  let grpNo=0;
  return keys.map(k=>{
    const list=groups[k].sort((a,b)=>((a.court||99)-(b.court||99))||String(a.label).localeCompare(String(b.label)));
    const cnts={}; list.forEach(m=>{cnts[m.stage]=(cnts[m.stage]||0)+1;});
    const stage=Object.keys(cnts).sort((x,y)=>cnts[y]-cnts[x])[0]||"group";
    let label; if(stage==="group"){ grpNo++; label="Round "+grpNo; } else { label=STAGE_LABEL[stage]||stage; }
    return {key:k, list, stage, label, time:k};
  });
}
function renderCourts(){
  const wrap=$("tabCourts");
  if(!state.categories.length){ wrap.innerHTML='<p class="empty">No categories yet.</p>'; return; }
  const nums=courtNumbers();
  if(!state.allMatches.length){ wrap.innerHTML=cmdBarHtml(null)+'<p class="empty">No matches scheduled yet.</p>'; return; }
  const waves=wavesOf();
  const bodies=waves.map((w,i)=>{
    if(!(w.key in state.openRounds)) state.openRounds[w.key]=(i<2); // default: 2 round pertama terbuka
    const open=state.openRounds[w.key];
    const nd=w.list.filter(m=>m.status==="DONE").length, n=w.list.length;
    const dur=state.durations[w.stage]||30, cid=cssid(w.key||("w"+i));
    const endT=w.time?addMin(w.time,dur):"";
    const pill=(n&&nd>=n)?'<span class="rpill ok">✓ selesai</span>':(nd>0?'<span class="rpill live">'+nd+'/'+n+'</span>':'<span class="rpill up">berikutnya</span>');
    const cards=w.list.map(m=>mcard(m,nums)).join("");
    return `<div class="rd ${open?'open':''}">
      <div class="rdhead">
        <span class="tri" onclick="toggleRound('${esc(w.key)}')">▶</span>
        <span class="rn" onclick="toggleRound('${esc(w.key)}')">${esc(w.label)}</span>
        <span class="stg">${esc(STAGE_LABEL[w.stage]||w.stage)} · ${dur}'</span>
        <span class="rtime"><input type="time" id="rt-${cid}" value="${esc(fmtTime(w.time))}">${w.time?'<span class="arr">→ '+esc(endT)+'</span>':''}<button type="button" class="btn btn-ghost btn-sm" onclick="applyWaveTime('${esc(w.key)}')">Terapkan jam</button></span>
        ${pill}<span class="rcnt">${n} court</span>
      </div>
      <div class="rdbody"><div class="roundgrid">${cards}</div></div></div>`;
  }).join("");
  wrap.innerHTML=cmdBarHtml(waves)+bodies;
  state.allMatches.forEach(initStatus);
}
function toggleRound(key){ state.openRounds[key]=!state.openRounds[key]; renderCourts(); }
// Terapkan jam untuk satu round (wave) → simpan ke semua match di wave itu (endpoint meta yang sudah ada).
async function applyWaveTime(key){
  const el=$("rt-"+cssid(key)); if(!el){ return; } const t=el.value; if(!t){ toast("Isi jam dulu",true); return; }
  const list=state.allMatches.filter(m=>(m.time||"")===key);
  if(!list.length) return;
  if(!confirm(`Terapkan jam ${t} ke ${list.length} match di round ini?`)) return;
  toast("Menyimpan jam…");
  try{ for(const m of list){ await apiWithRetry("tournament/match/meta",{method:"PUT",body:{matchId:m.matchId,tournamentId:m.tid,court:String(m.court||""),time:t}}); } toast("Jam round tersimpan"); reload(); }
  catch(e){ toast("Gagal menyimpan jam: "+e.message,true); }
}
// Terapkan jadwal penuh: durasi per-stage + Mulai R1 → hitung ulang jam tiap round & simpan.
async function applySchedule(){
  STAGE_ORDER.forEach(s=>{ const el=$("dur-"+s); if(el){ const v=parseInt(el.value,10); if(v>0) state.durations[s]=v; } });
  saveDurationsLocal();
  const baseEl=$("baseTime"); const waves=wavesOf();
  let t=(baseEl&&baseEl.value)|| (waves[0]&&fmtTime(waves[0].time)) || "";
  if(!waves.length){ renderCourts(); return; }
  if(!t){ toast("Isi 'Mulai R1' dulu",true); return; }
  const plan=[]; let cur=t;
  waves.forEach(w=>{ plan.push({list:w.list,time:cur}); cur=addMin(cur, state.durations[w.stage]||30); });
  const tot=state.allMatches.length;
  if(!confirm(`Terapkan jadwal: menyusun ulang jam ${waves.length} round (${tot} match) mulai ${t}. Lanjut?`)){ renderCourts(); return; }
  toast("Menyimpan jadwal…");
  try{ for(const w of plan){ for(const m of w.list){ await apiWithRetry("tournament/match/meta",{method:"PUT",body:{matchId:m.matchId,tournamentId:m.tid,court:String(m.court||""),time:w.time}}); } } toast("Jadwal tersimpan"); reload(); }
  catch(e){ toast("Gagal menyimpan jadwal: "+e.message,true); }
}
function teamRow(cid,side,m){
  const nm = side==="a" ? m.nameA : m.nameB;
  const team = side==="a" ? m.aTeam : m.bTeam;
  const sc = side==="a" ? m.scoreA : m.scoreB;
  const has=v=>v!=="" && v!=null;
  const done=m.status==="DONE";
  const win = done && String(m.winner)===String(side==="a"?m.entrantA:m.entrantB);
  return `${team?`<div class="tnm" id="tnm-${side}-${cid}">${esc(team)}</div>`:""}
    <div class="team ${win?'win':''}" id="row-${side}-${cid}">
      <span class="nm" id="nm-${side}-${cid}">${esc(nm)}</span>
      <input class="sin" id="${side}-${cid}" type="number" inputmode="numeric" min="0" value="${has(sc)?esc(String(sc)):""}">
    </div>`;
}
function mcard(m,nums){
  const cid=cssid(m.matchId); byCid[cid]=m;
  const done=m.status==="DONE";
  const opts=nums.map(n=>`<option value="${n}" ${n===m.court?"selected":""}>${n}</option>`).join("")+(m.court?"":`<option value="0" selected>—</option>`);
  return `<div class="mcard ${done?'st-done':''}" id="card-${cid}">
    <div class="mtop"><span class="cbig">COURT ${m.court||"—"}</span><span class="gbig">${esc(m.label)}</span>${m.catLabel?`<span class="mcat">${esc(m.catLabel)}</span>`:""}<span class="badge" id="badge-${cid}"></span></div>
    ${teamRow(cid,"a",m)}
    <div class="sep"></div>
    ${teamRow(cid,"b",m)}
    <div class="nameedit" id="edit-${cid}">
      <div class="grp"><div class="glab">Team A — players &amp; team name</div>
        <div class="row2"><input id="eaP1-${cid}" value="${esc(m.aP1)}" placeholder="Player 1"><input id="eaP2-${cid}" value="${esc(m.aP2)}" placeholder="Player 2"></div>
        <input id="eaT-${cid}" value="${esc(m.aTeam)}" placeholder="Team name (optional)">
        <button type="button" class="btn btn-ghost btn-sm" onclick="saveTeam('${cid}','a')">Save Team A</button>
      </div>
      <div class="grp"><div class="glab">Team B — players &amp; team name</div>
        <div class="row2"><input id="ebP1-${cid}" value="${esc(m.bP1)}" placeholder="Player 1"><input id="ebP2-${cid}" value="${esc(m.bP2)}" placeholder="Player 2"></div>
        <input id="ebT-${cid}" value="${esc(m.bTeam)}" placeholder="Team name (optional)">
        <button type="button" class="btn btn-ghost btn-sm" onclick="saveTeam('${cid}','b')">Save Team B</button>
      </div>
    </div>
    <div class="sched">
      <label>Court</label><select id="ct-${cid}">${opts}</select>
      <label>Time</label><input type="time" id="tm-${cid}" value="${esc(fmtTime(m.time))}">
    </div>
    <div class="mactions">
      <button type="button" class="btn btn-ghost btn-sm edit" onclick="toggleEdit('${cid}')" title="Edit player / team names">✎ Names</button>
      <button type="button" class="btn btn-ghost btn-sm" onclick="saveMeta('${cid}')">Schedule</button>
      <button type="button" class="btn btn-primary btn-sm" onclick="saveScore('${cid}')">${done?"Revise score":"Save score"}</button>
    </div>
  </div>`;
}
function toggleEdit(cid){ const el=$("edit-"+cid); if(el) el.classList.toggle("open"); }
function initStatus(m){ const cid=cssid(m.matchId); const b=$("badge-"+cid); if(!b) return; if(m.status==="DONE"){ b.textContent="✓ Done"; b.className="badge st-done"; } else { b.textContent="Not scored"; b.className="badge st-empty"; } }
function setBadge(cid,st,label){ const b=$("badge-"+cid); if(b){ b.textContent=label; b.className="badge st-"+st; } }

async function saveScore(cid){
  const m=byCid[cid]; if(!m) return;
  const a=$("a-"+cid).value.trim(), b=$("b-"+cid).value.trim();
  if(a==="" && b===""){ toast("Enter both teams' scores",true); return; }
  if(a==="" || b===""){ toast("Both teams' scores are required",true); return; }
  if(!isInt(a)||!isInt(b)){ toast("Scores must be whole numbers",true); return; }
  const na=+a, nb=+b;
  if(na===nb){
    if(m.kind==="playoff"){ toast("Playoff can't be a draw — pick a winner",true); return; }
    if(!confirm("Scores are equal — save as a draw?")) return;
  }
  if(m.kind==="playoff"){
    const nw = na>nb ? m.entrantA : nb>na ? m.entrantB : "";
    if(m.winner && nw && String(nw)!==String(m.winner)){
      const dn = downstreamDoneCount(m);
      if(dn>0 && !confirm(`Changing this match's winner will RESET ${dn} downstream match(es) (they must be re-entered). Continue?`)) return;
    }
  }
  setBadge(cid,"saving","⟳ Saving…");
  const path=m.kind==="playoff"?"tournament/playoff/match":"tournament/match";
  try{
    await apiWithRetry(path,{method:"PUT",body:{matchId:m.matchId,tournamentId:m.tid,scoreA:a,scoreB:b}});
    const aw=na>nb,bw=nb>na;
    $("row-a-"+cid).classList.toggle("win",aw); $("row-b-"+cid).classList.toggle("win",bw);
    $("card-"+cid).classList.add("st-done"); setBadge(cid,"done","✓ Done");
    m.scoreA=a; m.scoreB=b; m.status="DONE"; m.winner=aw?m.entrantA:(bw?m.entrantB:"");
    toast(na===nb?"Draw saved":`Saved — ${aw?m.nameA:m.nameB}`);
    if(m.kind==="playoff") setTimeout(reload,600);
  }catch(e){ setBadge(cid,"error","⚠ Failed"); toast("Failed to save score: "+e.message,true); }
}
async function saveMeta(cid){
  const m=byCid[cid]; if(!m) return;
  const court=$("ct-"+cid).value, time=$("tm-"+cid).value;
  setBadge(cid,"saving","⟳ Saving…");
  try{
    await apiWithRetry("tournament/match/meta",{method:"PUT",body:{matchId:m.matchId,tournamentId:m.tid,court:court,time:time}});
    toast("Schedule saved");
    reload();
  }catch(e){ initStatus(m); toast("Failed to save schedule: "+e.message,true); }
}
// Edit player names & team name for one side, via the entrant record (propagates everywhere).
async function saveTeam(cid,side){
  const m=byCid[cid]; if(!m) return;
  const eid = side==="a" ? m.entrantA : m.entrantB;
  if(!eid){ toast("Entrant not set yet (match TBD)",true); return; }
  const p1=$("e"+side+"P1-"+cid).value.trim(), p2=$("e"+side+"P2-"+cid).value.trim(), team=$("e"+side+"T-"+cid).value.trim();
  if(!p1||!p2){ toast("Both player names are required",true); return; }
  try{
    await apiWithRetry("tournament/entrant",{method:"PUT",body:{entrantId:eid,updates:{player1Name:p1,player2Name:p2,teamName:team}}});
    toast("Participant names updated");
    reload();
  }catch(e){ toast("Failed to save names: "+e.message,true); }
}

// ---- standings tab ----
function renderStandings(){
  const wrap=$("tabStandings"); const cat=currentCat();
  if(!cat){ wrap.innerHTML='<p class="empty">Select a category.</p>'; return; }
  const groups=cat.groups||[];
  if(!groups.length){ wrap.innerHTML='<p class="empty">No groups / standings yet. Draw the groups in Engine first.</p>'; return; }
  // Samakan dengan player page (mobile.html): urutan & kolom & highlight sama.
  const N=parseInt(cat.advancersPerGroup)||0;
  const split=String(cat.format||"").toUpperCase()==="SPLIT";
  const rankNote="Ranked by: most wins → head-to-head → point difference → points for → points against";
  wrap.innerHTML='<div class="stgrid">'+groups.map(g=>{
    const denom=Math.max(1,((g.standings||[]).length||1)-1);
    const rows=(g.standings||[]).map(s=>{
      const cls=split?(s.rank<=N?'champ':'prosp'):(N&&s.rank<=N?'top':'');
      const pa=(s.ga!=null)?s.ga:(Number(s.gf||0)-Number(s.gd||0));
      return `<tr class="${cls}">
        <td class="rk">${s.rank}</td>
        <td class="tteam">${esc(s.team)}</td>
        <td>${s.played}/${denom}</td><td>${s.wins}</td><td>${s.losses}</td>
        <td>${s.gd>0?"+":""}${s.gd}</td><td>${s.gf!=null?s.gf:"–"}</td><td>${pa}</td></tr>`;
    }).join("");
    const advText=split?`Rank 1${N>1?`–${N}`:''} → Championship · Rank ${N+1}+ → Prospect`:(N?`Top ${N} advance`:"");
    return `<div class="stcard"><h3>Group ${esc(g.label)}</h3>
      <div class="stnote">${advText?esc(advText)+' · ':''}${esc(rankNote)}</div>
      <table class="st"><thead><tr><th>#</th><th class="tteam">Pair</th><th>P</th><th>W</th><th>L</th><th>PD</th><th>PF</th><th>PA</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="8" class="empty">—</td></tr>'}</tbody></table></div>`;
  }).join("")+'</div>';
}

// ---- bracket tab ----
function bracketControls(){
  return `<div class="brctrls"><span class="brlbl">Generate bracket</span>
    <button type="button" class="btn btn-primary btn-sm" onclick="generateBracket(0)">Per grup</button>
    <button type="button" class="btn btn-ghost btn-sm" onclick="generateBracketTopN()">Top-N (peringkat)</button>
    <span class="brhint">menimpa bracket kategori ini · seeding manual/custom di /engine</span></div>`;
}
async function generateBracket(overall){
  const cat=currentCat(); if(!cat){ toast("Pilih kategori dulu",true); return; }
  overall=parseInt(overall)||0;
  const msg=overall>=2?`Generate bracket ${overall} besar (peringkat keseluruhan) — menimpa bracket kategori ini. Lanjut?`
    :"Generate bracket per grup — menimpa bracket kategori ini berdasarkan standing terkini. Lanjut?";
  if(!confirm(msg)) return;
  toast("Membuat bracket…");
  try{
    const body={ date:(state.event&&state.event.date)||"", startTime:"", numCourts:String(state.numCourts||1),
      matchMinutes:String(state.durations.qf||state.durations.final||35), breaks:[], crossSeed:true };
    if(overall>=2) body.topOverall=overall;
    const r=await api("tournament/"+encodeURIComponent(cat.tournamentId)+"/playoff",{method:"POST",body});
    const txt=(r.brackets||[]).map(b=>`${tierLabel(b.tier)}: ${b.entrants||"?"} tim`).join(" · ");
    toast("Bracket dibuat"+(txt?" · "+txt:"")); reload();
  }catch(e){ toast("Gagal generate bracket: "+e.message,true); }
}
function generateBracketTopN(){ const n=parseInt(prompt("Top berapa tim (peringkat keseluruhan) yang lolos? mis. 8",""),10); if(n>=2) generateBracket(n); else if(n) toast("Minimal 2 tim",true); }
function renderBracket(){
  const wrap=$("tabBracket"); const cat=currentCat();
  if(!cat){ wrap.innerHTML='<p class="empty">Select a category.</p>'; return; }
  const brackets=(cat.playoff&&cat.playoff.length)?cat.playoff:[];
  if(!brackets.length){ wrap.innerHTML=bracketControls()+'<p class="empty">Belum ada bracket. Klik "Generate bracket" di atas (atau otomatis muncul saat semua match grup selesai).</p>'; return; }
  wrap.innerHTML=bracketControls()+brackets.map(b=>{
    const pod=b.podium||{};
    const podium=(pod.champion||pod.runnerUp||pod.third)?`<div class="podium">
      ${pod.champion?`<span class="p">🏆 <b>${esc(pod.champion)}</b></span>`:""}
      ${pod.runnerUp?`<span class="p">🥈 ${esc(pod.runnerUp)}</span>`:""}
      ${pod.third?`<span class="p">🥉 ${esc(pod.third)}</span>`:""}</div>`:"";
    const cols=(b.rounds||[]).map(r=>{
      const ms=(r.matches||[]).map(m=>brMatch(m)).join("");
      return `<div class="brcol"><div class="rlab">${esc(roundLabel(r.round,b.numRounds))}</div>${ms||'<p class="empty">—</p>'}</div>`;
    }).join("");
    const bronze=b.bronze?`<div class="brcol"><div class="rlab">3rd Place</div>${brMatch(b.bronze)}</div>`:"";
    return `<div class="brtier"><h3>${esc(tierLabel(b.tier))}</h3>${podium}<div class="brrounds">${cols}${bronze}</div></div>`;
  }).join("");
}
function brMatch(m){
  const done=m.status==="DONE";
  const aw=done&&String(m.winner)===String(m.entrantA), bw=done&&String(m.winner)===String(m.entrantB);
  const has=v=>v!=="" && v!=null;
  const nA=m.teamA||(m.entrantA?"…":"TBD"), nB=m.teamB||(m.entrantB?"…":"TBD");
  const meta=[m.court?("Court "+m.court):"", fmtTime(m.time)].filter(Boolean).join(" · ");
  return `<div class="brm">
    <div class="bl ${aw?'win':''}"><span>${esc(nA)}</span><span class="s">${has(m.scoreA)?esc(String(m.scoreA)):"–"}</span></div>
    <div class="bl ${bw?'win':''}"><span>${esc(nB)}</span><span class="s">${has(m.scoreB)?esc(String(m.scoreB)):"–"}</span></div>
    ${meta?`<div class="bmeta">${esc(meta)}</div>`:""}</div>`;
}

$("who").textContent=(state.session&&state.session.username)||"—";
loadEvents().catch(e=>toast(e.message,true));
// MANUAL refresh only — the ↻ Refresh button. (No auto-refresh.)
</script>
