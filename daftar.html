<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendaftaran · TurnamenPadel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/tp-theme.css"/>
<style>
  :root{
    --accent:var(--orange); --accent2:var(--orange); --press:var(--orange-hover);
    --danger:#DC2626; --warn:#B45309; --ok:#065F46;
    --r:var(--r-2xl); --r-sm:var(--r-lg);
    --body:var(--sans);
    --grad:linear-gradient(120deg,#FF5722,#FF7A45);
    --inset:#F1F5F9;
  }
  body{font-size:14px;line-height:1.5}
  .wrap{max-width:490px;margin:0 auto;padding:16px;padding-block:16px 52px;}
  h1,h2,h3,h4{font-family:var(--display);font-weight:900;letter-spacing:-.01em;margin:0;}
  a{color:var(--orange);font-weight:600} .faint{color:var(--slate-400)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate-500);}
  .card{background:#fff;border:var(--bd);border-radius:var(--r-2xl);padding:18px;box-shadow:var(--sh-sm);}
  .card+.card{margin-top:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap} .divider{height:2px;background:var(--slate-200);margin:14px 0}
  .note{font-size:12px;color:var(--slate-500);margin-top:6px}
  .hero{position:relative;overflow:hidden;border-radius:var(--r-2xl);border:var(--bd);background:rgba(254,243,199,.5);padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
  .hero .eyebrow{color:var(--orange)} .hero h1{font-size:28px;margin:6px 0 10px;line-height:1.05}
  .prog{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .stepper{display:flex;align-items:center;flex:1}
  .snode{display:flex;align-items:center;flex:1}.snode:last-child{flex:0}
  .dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;border:var(--bd);background:#fff;color:var(--slate-400)}
  .snode.done .dot{background:var(--orange);border-color:var(--dark);color:#fff}
  .snode.cur .dot{border-color:var(--orange);color:var(--orange);box-shadow:0 0 0 4px rgba(255,87,34,.18)}
  .seg-line{flex:1;height:2px;background:var(--slate-300);margin:0 4px}.snode.done .seg-line{background:var(--orange)}
  .steplbl{font-family:var(--mono);font-size:11px;color:var(--slate-500);white-space:nowrap}
  label.f{display:block;margin-bottom:12px}label.f>span{display:block;font-family:var(--mono);font-size:12px;font-weight:700;text-transform:uppercase;color:var(--slate-600);margin-bottom:6px}
  .req{color:var(--orange)}
  input,select,textarea{width:100%;background:#fff;border:var(--bd);color:var(--dark);border-radius:var(--r-lg);padding:11px 12px;font-family:var(--sans);font-size:14px;box-shadow:var(--sh-sm)}
  input:focus,select:focus,textarea:focus{outline:none;box-shadow:var(--sh-sm),0 0 0 3px rgba(255,87,34,.35)}
  textarea{min-height:70px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:430px){.grid2{grid-template-columns:1fr}}
  .btn{appearance:none;border:var(--bd);background:#fff;color:var(--dark);font-family:var(--display);font-weight:800;font-size:14px;padding:12px 16px;border-radius:var(--r-lg);cursor:pointer;box-shadow:var(--sh-sm);transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:translate(2px,2px);box-shadow:none}.btn.primary{background:var(--orange);color:#fff}
  .btn.ghost{background:var(--slate-100)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--sh-sm)}
  .nav{display:flex;gap:10px;margin-top:18px}.nav .btn{flex:1}.nav .btn.ghost{flex:0 0 auto}
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--r-full);border:var(--bd);background:#fff}
  .chip.ok{color:#065F46;border-color:var(--mint);background:var(--mint-20)}
  .chip.warn{color:var(--warn);border-color:var(--amber-bd);background:var(--amber-bg)}
  .elo{font-family:var(--mono);color:var(--orange);font-weight:800}
  .summary{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--orange-10);border:2px solid var(--orange);border-radius:var(--r-lg);padding:9px 13px;margin-bottom:14px}
  .summary .s-fee{font-family:var(--mono);font-weight:800;color:var(--orange)}
  .opt{display:flex;gap:12px;align-items:center;border:var(--bd);border-radius:var(--r-lg);padding:14px;cursor:pointer;background:#fff;box-shadow:var(--sh-sm)}
  .opt.sel{border-color:var(--orange);background:var(--orange-10);box-shadow:var(--sh-sm),0 0 0 3px rgba(255,87,34,.15)}
  .opt.full{border-style:dashed} .opt input{width:auto;margin:0;box-shadow:none} .opt .grow{flex:1}
  .opt .meta{font-family:var(--mono);font-size:11.5px;color:var(--slate-500);margin-top:4px}
  .opt .prize{font-family:var(--display);font-weight:900;font-size:20px;color:var(--orange);line-height:1;text-align:right}
  .opt .prize small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--slate-400);text-transform:uppercase;margin-bottom:2px}
  .quota{display:flex;align-items:center;gap:8px;margin-top:8px}
  .qbar{flex:1;height:8px;border-radius:99px;background:var(--slate-200);border:1px solid var(--dark);overflow:hidden}
  .qbar i{display:block;height:100%;background:var(--orange)}
  .qnum{font-family:var(--mono);font-size:11px;color:var(--slate-500);white-space:nowrap}.qnum.full{color:var(--danger)}
  .wltag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid var(--amber-bd);background:var(--amber-bg);border-radius:6px;padding:2px 7px;margin-top:6px}
  .kv{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--slate-200);font-size:13.5px}.kv:last-child{border:0}
  .kv .ic{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--slate-100);border:var(--bd)}
  .pcard{border:var(--bd);border-radius:var(--r-lg);padding:15px;background:#fff;box-shadow:var(--sh-sm)}.pcard+.pcard{margin-top:13px}
  .avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:16px;color:#fff;background:var(--orange);border:var(--bd)}
  .phead{display:flex;align-items:center;gap:11px;margin-bottom:12px}.phead .who{font-family:var(--display);font-weight:800;font-size:16px}.phead .sub{font-size:11.5px;color:var(--slate-500)}
  .timeline{list-style:none;margin:8px 0 0;padding:0}
  .timeline li{position:relative;padding:0 0 12px 20px;font-size:13px;color:var(--slate-600)}
  .timeline li::before{content:"";position:absolute;left:3px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--orange)}
  .timeline li b{color:var(--dark)}
  .logo{display:inline-flex;align-items:center;gap:10px}
  .logo .glyph{width:32px;height:32px;border-radius:var(--r-lg);background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:14px;border:var(--bd)}
  .logo .name{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:-.01em}.logo .name b{color:var(--orange)}
  /* Sticky header — consistent with the event page (/&lt;slug&gt;) */
  .ev-head{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:var(--bd)}
  .ev-head .inner{max-width:490px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .ev-title{font-family:var(--display);font-weight:900;letter-spacing:-.01em;line-height:1.1;font-size:clamp(17px,3.6vw,22px);color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72%}
  #homeBtn{flex:none}
  .done-hero{text-align:center;padding:8px 0}.done-hero .big{font-size:46px}
  .empty{color:var(--slate-400);text-align:center;padding:40px 0}
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:18px;z-index:50}
  .modal{background:#fff;border:var(--bd);border-radius:var(--r-2xl);padding:20px;max-width:420px;width:100%;box-shadow:var(--sh-lg)}
  .modal h3{font-size:19px;margin-bottom:4px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header class="ev-head"><div class="inner">
  <span class="ev-title" id="evTitle"></span>
  <a class="btn btn--white btn--sm" id="homeBtn" href="#"><span class="material-symbols-outlined" style="font-size:16px">home</span>Home</a>
</div></header>
<div class="wrap">
  <div id="head"></div>
  <div id="host"><p class="empty">Memuat…</p></div>
</div>
<div id="modalHost"></div>
<script>
const API = "/api";
// Daftar kota/kabupaten Indonesia (subset representatif; bisa diperluas).
const REG_CITIES = ["Kota Jakarta Pusat","Kota Jakarta Utara","Kota Jakarta Barat","Kota Jakarta Selatan","Kota Jakarta Timur","Kota Tangerang","Kota Tangerang Selatan","Kabupaten Tangerang","Kota Bekasi","Kabupaten Bekasi","Kota Depok","Kota Bogor","Kabupaten Bogor","Kota Bandung","Kabupaten Bandung","Kota Cimahi","Kota Serang","Kabupaten Serang","Kota Cilegon","Kota Sukabumi","Kota Cirebon","Kota Bandung Barat","Kota Semarang","Kota Surakarta","Kota Yogyakarta","Kabupaten Sleman","Kabupaten Bantul","Kota Surabaya","Kota Malang","Kota Sidoarjo","Kabupaten Gresik","Kota Denpasar","Kabupaten Badung","Kota Medan","Kota Binjai","Kota Pekanbaru","Kota Batam","Kota Padang","Kota Palembang","Kota Bandar Lampung","Kota Makassar","Kota Manado","Kota Balikpapan","Kota Samarinda","Kota Pontianak","Kota Banjarmasin","Kota Ambon","Kota Jayapura","Kota Mataram","Kota Kupang","Kota Palu","Kota Kendari","Kota Gorontalo","Kota Jambi","Kota Bengkulu","Kota Pangkalpinang","Kota Tanjungpinang","Kota Banda Aceh","Kota Ternate","Kota Sorong"];
const rupiah = n => { const v=parseInt(String(n).replace(/\D/g,"")); return isNaN(v)?String(n||""):"Rp"+v.toLocaleString("id-ID"); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// Accept a raw event ref from: /daftar/<ref>, a friendly root slug /<slug>
// (via the vercel.json catch-all), or ?e=<ref>. The ref may be an eventId
// (EV_/TM_…) or a friendly slug derived from the event name.
function qs(){
  const m=location.pathname.match(/\/daftar\/([^\/?#]+)/);
  if(m) return decodeURIComponent(m[1]);
  const seg=location.pathname.replace(/^\/+|\/+$/g,"").split("/").filter(Boolean);
  if(seg.length===1 && seg[0].toLowerCase()!=="daftar" && seg[0].indexOf(".")<0) return decodeURIComponent(seg[0]);
  return new URLSearchParams(location.search).get("e")||"";
}
function slugify(s){ return String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80); }
// Full category names / levels (avoid codes like MD/WD/MIXED and raw levels).
function catLabel(c){ const k=String(c||"").trim().toUpperCase(); return {MD:"Men's Doubles",WD:"Women's Doubles",MIXED:"Mixed Doubles",XD:"Mixed Doubles"}[k] || c; }
function levelLabel(l){ const k=String(l||"").toLowerCase().trim().replace(/\s+/g,"_"); return {beginner:"Beginner",upper_beginner:"Upper Beginner",lower_bronze:"Lower Bronze",bronze:"Bronze",upper_bronze:"Upper Bronze",silver:"Silver",gold:"Gold",platinum:"Platinum"}[k] || l; }
function catText(c){ const cl=catLabel(c.label); const lv=levelLabel(c.level); return lv ? (cl+" · "+lv) : cl; }

const F = { eventId:qs(), data:null, step:0, catId:null,
  players:[blankP(),blankP()], waiverA:false, waiverB:false, payFile:"" };
function blankP(){ return {name:"",phone:"",email:"",ig:"",nick:"",dob:"",gender:"",region:"",jersey:"",photo:"",photoUrl:"",decision:null,chk:null,checking:false,cand:null,otpStage:null,otpMask:"",otpCode:"",otpErr:"",otpBusy:false,otpMsg:""}; }

async function api(path, opts){
  const res = await fetch(API+"/"+path, { method:(opts&&opts.method)||"GET",
    headers:{"Content-Type":"application/json"}, body:opts&&opts.body?JSON.stringify(opts.body):undefined });
  let d={}; try{ d=await res.json(); }catch(e){}
  if(!res.ok){ const err=new Error(d.error||("HTTP "+res.status)); err.status=res.status; throw err; }
  return d;
}
function fileToDataUrl(input){ return new Promise(r=>{ const f=input.files&&input.files[0]; if(!f) return r(""); const rd=new FileReader(); rd.onload=()=>r(rd.result); rd.onerror=()=>r(""); rd.readAsDataURL(f); }); }

function cat(){ return (F.data.categories||[]).find(c=>c.tournamentId===F.catId); }
function catFull(c){ return c && c.quota>0 && c.filled>=c.quota; }
function isWL(){ return catFull(cat()); }
const STEP_NAME=["Kategori","Pemain 1","Pemain 2","Rangkuman","Persetujuan","Pembayaran"];
function stepKeys(){ return isWL()? ["cat","p1","p2","summary","waiver","done"] : ["cat","p1","p2","summary","waiver","pay","done"]; }
function stepNum(){ const k=stepKeys(); const cur=k[F.step]; const numbered=k.filter(x=>x!=="done"); return {cur, idx:numbered.indexOf(cur)+1, total:numbered.length}; }

async function boot(){
  if(!F.eventId){ document.getElementById("host").innerHTML='<p class="empty">Link tidak valid.</p>'; return; }
  // Resolve a friendly slug (e.g. /nama-event) to the real eventId. Raw
  // eventIds (EV_/TM_…) pass through untouched.
  if(!/^(EV_|TM_)/.test(F.eventId)){
    try{
      const d = await api("tournament/events");
      const want = slugify(F.eventId);
      const hits = (d.events||[]).filter(e => ((e.slug && String(e.slug).toLowerCase()) || slugify(e.name)) === want);
      if(hits.length) F.eventId = hits[hits.length-1].eventId;
    }catch(e){}
  }
  try{ F.data = await api("reg/public/"+encodeURIComponent(F.eventId)); }
  catch(e){ document.getElementById("host").innerHTML='<div class="card"><p class="empty" style="padding:20px 0">'+(e.status===404?"Pendaftaran belum tersedia untuk event ini.":esc(e.message))+'</p></div>'; return; }
  // Come straight from the event landing's "Register now" → open the category
  // step directly (skip the intro). When registration is closed, fall back to
  // the info view so the closed state is shown.
  F.started = !!(F.data && F.data.status === "open");
  render();
}
// Back to this event's public landing page (/<slug>).
function eventPageHref(){
  const m=location.pathname.match(/\/daftar\/([^\/?#]+)/);
  if(m) return "/"+m[1];
  const e=new URLSearchParams(location.search).get("e");
  return e?("/"+encodeURIComponent(e)):"/";
}
function head(){
  const h=document.getElementById("head");
  const k=stepKeys()[F.step];
  if(k==="info"||k==="done"||F.step===0&&k==="cat"&&!F.started){ h.innerHTML=""; return; }
  const {idx,total,cur}=stepNum();
  let nodes=""; for(let n=1;n<=total;n++){ const cls=n<idx?"done":(n===idx?"cur":""); nodes+=`<div class="snode ${cls}"><div class="dot">${n<idx?"✓":n}</div>${n<total?'<div class="seg-line"></div>':''}</div>`; }
  const c=cat();
  const sum=c?`<div class="summary"><span>${esc(catText(c))}${isWL()?' · waitlist':''}</span><span class="s-fee">${isWL()?'bayar nanti':rupiah(c.fee)}</span></div>`:"";
  h.innerHTML=`<div class="prog"><div class="stepper">${nodes}</div><span class="steplbl">${idx}/${total}</span></div>${sum}`;
}
function render(){
  const t=document.getElementById("evTitle"); if(t) t.textContent=(F.data&&(F.data.name||(F.data.event&&F.data.event.name)))||"Pendaftaran";
  const hb=document.getElementById("homeBtn"); if(hb) hb.setAttribute("href", eventPageHref());
  head();
  const k = F.started ? stepKeys()[F.step] : "info";
  const host=document.getElementById("host");
  host.innerHTML = ({info:vInfo,cat:vCat,p1:()=>vPlayer(0),p2:()=>vPlayer(1),summary:vSummary,waiver:vWaiver,pay:vPay,done:vDone}[k])();
  if(k==='p1') updatePlayerNav(0); if(k==='p2') updatePlayerNav(1);
  window.scrollTo(0,0);
}
function go(k){ const list=stepKeys(); F.step=list.indexOf(k); render(); }
function start(){ F.started=true; F.step=0; render(); }

function vInfo(){
  const d=F.data, ev=d.event||{}, cfg=d.config||{}, tl=cfg.timeline||{};
  const open = d.status==="open";
  const cats=d.categories||[];
  const tRow=(k,l)=> tl[k]?`<li><b>${esc(tl[k])}</b> — ${l}</li>`:"";
  return `<div class="hero"><div class="eyebrow">Pendaftaran turnamen</div>
      <h1>${esc(d.name||ev.name||"")}</h1>
      <span class="chip ${open?'ok':'warn'}">● Pendaftaran ${open?'dibuka':'ditutup'}</span></div>
    <div class="card">
      ${ev.venue?`<div class="kv"><span class="ic">📍</span><div><b>${esc(ev.venue)}</b>${cfg.address?'<br><span class="muted">'+esc(cfg.address)+'</span>':''}${cfg.maps?' · <a href="'+esc(cfg.maps)+'" target="_blank" rel="noopener">Maps</a>':''}</div></div>`:""}
      ${ev.date?`<div class="kv"><span class="ic">📅</span><div><b>${esc(ev.date)}</b>${ev.startTime?' · mulai '+esc(ev.startTime):''}</div></div>`:""}
    </div>
    <div class="card"><div class="eyebrow">Kategori · biaya</div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:10px">
      ${cats.map(c=>`<div class="opt ${catFull(c)?'full':''}" style="cursor:default;flex-wrap:wrap">
        <div class="grow"><b>${esc(catText(c))}</b>
          <div class="meta">${rupiah(c.fee)}${c.req?' · syarat '+esc(c.req):''}</div>${quotaBar(c)}${catFull(c)?'<span class="wltag">penuh · masuk waitlist</span>':''}</div></div>`).join("")}
      </div>
      ${cfg.rules?`<div class="divider"></div><div class="eyebrow">Aturan main</div><p class="muted" style="margin:8px 0 0;font-size:13px;white-space:pre-line">${esc(cfg.rules)}</p>`:''}
    </div>
    ${(tl.openStart||tl.curationStart||tl.appealDeadline||tl.tmDate||tl.oopDate)?`<div class="card"><div class="eyebrow">Alur &amp; jadwal</div>
      <ul class="timeline">${tRow('openStart','pendaftaran dibuka')}${tRow('openEnd','pendaftaran ditutup')}${tRow('curationStart','kurasi')}${tRow('appealDeadline','batas appeal')}${tRow('tmDate','Technical Meeting + grup')}${tRow('oopDate','order of play')}</ul></div>`:''}
    <div class="nav"><button class="btn primary" ${open?'':'disabled'} onclick="start()">${open?'Daftar sekarang →':'Pendaftaran ditutup'}</button></div>`;
}
function quotaBar(c){
  if(!c.quota) return "";
  const pct=Math.min(100,Math.round(c.filled/c.quota*100));
  return `<div class="quota"><div class="qbar"><i style="width:${pct}%;${catFull(c)?'background:var(--danger)':''}"></i></div><span class="qnum ${catFull(c)?'full':''}">${c.filled}/${c.quota}${catFull(c)?' · penuh':''}</span></div>`;
}
function vCat(){
  const cats=F.data.categories||[];
  return `<div class="card"><p class="muted" style="margin:0 0 14px;font-size:13px">Pilih kategori.</p>
    <div style="display:flex;flex-direction:column;gap:11px">
    ${cats.map(c=>`<label class="opt ${F.catId===c.tournamentId?'sel':''} ${catFull(c)?'full':''}" style="flex-wrap:wrap">
      <input type="radio" name="cat" ${F.catId===c.tournamentId?'checked':''} onchange="F.catId='${esc(c.tournamentId)}';render()">
      <div class="grow"><b>${esc(catText(c))}</b><div class="meta">${rupiah(c.fee)}${c.req?' · '+esc(c.req):''}</div>${quotaBar(c)}${catFull(c)?'<span class="wltag">penuh · masuk waitlist</span>':''}</div>
    </label>`).join("")}
    </div>
    ${F.catId&&isWL()?`<div class="card" style="margin-top:12px;border-color:rgba(255,209,102,.4)"><b class="mono" style="color:var(--warn)">⚠ Kuota penuh · waitlist</b><div class="note">Kamu masuk antrean <b>tanpa bayar dulu</b>. Jika ada slot kosong, panitia mengundangmu via email untuk membayar.</div></div>`:''}
    <div class="nav"><a class="btn ghost" href="${eventPageHref()}">←</a>
      <button class="btn primary" ${F.catId?'':'disabled'} onclick="go('p1')">Lanjut →</button></div></div>`;
}
/* ---------- STEP: per-player (Pemain 1 lalu Pemain 2) ---------- */
function fieldsOn(){ const f=(F.data.config&&F.data.config.fields)||{}; return function(k){ const d=(k!=="jersey"); return f[k]===undefined?d:!!f[k]; }; }
function allFilled(i){ const p=F.players[i], on=fieldsOn();
  if(!(p.name||"").trim()||!(p.email||"").trim()||!(p.phone||"").trim()) return false;
  if(on("nick") && !(p.nick||"").trim()) return false;
  if(on("gender") && !(p.gender||"").trim()) return false;
  if(on("dob") && !(p.dob||"").trim()) return false;
  if(on("region") && !(p.region||"").trim()) return false;
  if(on("jersey") && !(p.jersey||"").trim()) return false;
  if(on("photo") && !(p.photo||p.photoUrl)) return false;
  return true;
}
function setF(i,k,v){ F.players[i][k]=v; updatePlayerNav(i); }
function updatePlayerNav(i){ const b=document.getElementById("pNext_"+i); if(b) b.disabled=!(F.players[i].decision && allFilled(i)); }
function clearOtp(p){ p.cand=null; p.otpStage=null; p.otpMask=""; p.otpCode=""; p.otpErr=""; p.otpBusy=false; p.otpMsg=""; }
function onName(i,v){ const p=F.players[i]; p.name=v; p.chk=null; p.decision=null; p.checking=false; clearOtp(p);
  const r=document.getElementById("pres_"+i); if(r) r.innerHTML=(v||"").trim()?'<div class="note">akan cek saat berhenti mengetik…</div>':"";
  clearTimeout(p._t); if(!(v||"").trim()) return; p._t=setTimeout(function(){ doCheck(i); }, 600);
}
async function doCheck(i){ const p=F.players[i], c=cat(); if(!(p.name||"").trim()) return;
  p.checking=true; const r=document.getElementById("pres_"+i); if(r) r.innerHTML='<div class="note">⏳ Mencari nama mirip di Trekkr…</div>';
  try{ p.chk=await api("reg/check-player",{method:"POST",body:{name:p.name,eventId:F.eventId,category:F.catId,level:c?c.level:""}}); }
  catch(e){ p.chk={found:false,candidates:[]}; }
  p.checking=false;
  render();   // tampilkan daftar kandidat (atau opsi buat baru bila kosong)
}
// Pendaftar memilih salah satu kandidat → verifikasi OTP (data kontak sensitif).
function chooseCandidate(i,idx){ const p=F.players[i]; const list=(p.chk&&p.chk.candidates)||[];
  const c=list[idx]; if(!c) return; const e=c.eligibility||{}; if(e.state==='block') return;
  p.cand=c; p.otpStage=null; p.otpErr=""; p.otpCode=""; p.otpMask="";
  if(c.verify && c.verify.available){ startOtp(i); }
  else { p.otpStage="unavail"; p.otpMsg="Tidak ada email terdaftar untuk profil ini."; render(); }
}
function candName(p){ return (p.cand&&p.cand.name)||p.name; }
async function startOtp(i){ const p=F.players[i]; const nm=candName(p); if(!(nm||"").trim()) return;
  p.otpBusy=true; p.otpErr=""; render();
  let r; try{ r=await api("reg/verify/start",{method:"POST",body:{name:nm,eventId:F.eventId}}); }
  catch(e){ p.otpBusy=false; p.otpErr="Gagal mengirim kode. Coba lagi."; render(); return; }
  p.otpBusy=false;
  if(!r.available){ p.otpStage="unavail"; p.otpMsg=r.message||"Tidak ada email terdaftar untuk profil ini."; render(); return; }
  p.otpStage="sent"; p.otpMask=r.emailMask||""; p.otpCode="";
  p.otpErr = r.sent===false ? ("Email gagal terkirim"+(r.message?": "+r.message:"")+". Coba kirim ulang atau pilih Buat baru.") : "";
  render();
}
async function confirmOtp(i){ const p=F.players[i]; const code=String(p.otpCode||"").replace(/\D/g,""); const nm=candName(p);
  if(!/^\d{6}$/.test(code)){ p.otpErr="Masukkan 6 digit kode."; render(); return; }
  p.otpBusy=true; p.otpErr=""; render();
  let r; try{ r=await api("reg/verify/confirm",{method:"POST",body:{name:nm,code:code}}); }
  catch(e){ p.otpBusy=false; p.otpErr=(e&&e.message)||"Kode salah atau kedaluwarsa."; render(); return; }
  p.otpBusy=false;
  const pr=r.profile||{};
  p.name=pr.name||nm; p.nick=pr.alias||""; p.gender=pr.gender||""; p.region=pr.region||"";
  p.phone=pr.phone||""; p.email=pr.email||""; p.photoUrl=pr.photoUrl||""; p.photo="";
  p.decision="use"; p.cand=null; p.otpStage=null; p.otpErr=""; p.otpCode=""; p.otpMask="";
  render();
}
function backToChooser(i){ const p=F.players[i]; clearOtp(p); render(); }
function buatBaru(i){ const p=F.players[i];
  p.nick="";p.gender="";p.dob="";p.region="";p.jersey="";p.phone="";p.email="";p.photo="";p.photoUrl="";

}
function resetPlayer(i){ const p=F.players[i]; p.decision=null; p.chk=null; p.checking=false; clearOtp(p); render(); }
async function pickPhoto(i,input){ const p=F.players[i]; p.photo=await fileToDataUrl(input);

// Kartu kandidat: daftar nama mirip yang bisa dipilih pendaftar.
function candList(i){ const p=F.players[i]; const cs=(p.chk&&p.chk.candidates)||[];

function otpBlock(i){ const p=F.players[i]; const nm=candName(p);
  const head=`<div class="row" style="justify-content:space-between;align-items:center"><span>Verifikasi: <b>${esc(nm)}</b></span>

      <div class="nav" style="margin-top:8px"><button class="btn primary" onclick="buatBaru(${i})">Buat baru</button></div></div>`;

      <div class="nav" style="margin-top:8px"><button class="btn primary" ${p.otpBusy?'disabled':''} onclick="confirmOtp(${i})">${p.otpBusy?'Memverifikasi…':'Verifikasi & pakai data'}</button>
        <button class="btn ghost" ${p.otpBusy?'disabled':''} onclick="startOtp(${i})">Kirim ulang</button></div></div>`;
  }
  return `<div class="card" style="margin-top:10px;background:var(--inset)">${head}
    <div class="note" style="margin:8px 0 4px">Untuk melindungi data pribadi, kami kirim <b>kode ke email terdaftar</b> sebelum data dibuka.</div>

function profileForm(i,on){ const p=F.players[i];

function copyText(txt, el){ const done=()=>{ if(el){ const o=el.textContent; el.textContent="✔ tersalin"; setTimeout(()=>{el.textContent=o;},1400); } };
  try{ navigator.clipboard.writeText(txt).then(done, ()=>fallbackCopy(txt,done)); }catch(e){ fallbackCopy(txt,done); } }
function fallbackCopy(txt, done){ try{ const t=document.createElement("textarea"); t.value=txt; t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t); t.select(); document.execCommand("copy"); document.body.removeChild(t); done&&done(); }catch(e){} }

    </div>
    <div class="divider"></div>${passBtns}
    ${(tl.curationStart||tl.tmDate||tl.oopDate)?`<div class="divider"></div><div class="eyebrow">Langkah berikutnya</div><ul class="timeline" style="margin-top:8px">${tl.curationStart?'<li><b>'+esc(tl.curationStart)+'</b> — kurasi</li>':''}${tl.tmDate?'<li><b>'+esc(tl.tmDate)+'</b> — Technical Meeting + grup</li>':''}${tl.oopDate?'<li><b>'+esc(tl.oopDate)+'</b> — order of play</li>':''}</ul>`:''}
    <p class="note">Simpan halaman ini sebagai bukti pendaftaran.</p></div>`;
}
boot();
</script>
