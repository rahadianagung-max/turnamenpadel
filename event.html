<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Event · TurnamenPadel</title>
<meta name="description" content="Halaman pendaftaran turnamen padel — TurnamenPadel."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/tp-theme.css"/>
<style>
  .ev-head{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:var(--bd)}
  .ev-head .inner{max-width:820px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logo{display:inline-flex;align-items:center;gap:10px}
  .logo .glyph{width:32px;height:32px;border-radius:var(--r-lg);background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:14px;border:var(--bd)}
  .logo .name{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:-.01em}.logo .name b{color:var(--orange)}
  .logo .sub{display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--slate-500);margin-top:2px}
  .ev-title{font-family:var(--display);font-weight:900;letter-spacing:-.01em;line-height:1.1;
    font-size:clamp(17px,3.6vw,24px);color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72%}
  #homeBtn{flex:none}

  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 96px;position:relative}
  .wrap .dots{position:absolute;inset:0 0 auto 0;height:340px;opacity:.10;pointer-events:none;z-index:0}
  .stack{position:relative;z-index:1;display:flex;flex-direction:column;gap:20px}

  /* flyer */
  .flyer{border:var(--bd);border-radius:var(--r-3xl);box-shadow:var(--sh-lg);overflow:hidden;background:#fff}
  .flyer img{display:block;width:100%;height:auto}
  .flyer.placeholder{aspect-ratio:16/10;display:grid;place-items:center;background:
     radial-gradient(600px 300px at 80% -10%,rgba(255,87,34,.16),transparent 60%),var(--card)}
  .flyer.placeholder .ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--slate-400)}
  .flyer.placeholder .ph .material-symbols-outlined{font-size:52px}

  /* title block */
  .titlecard{display:flex;flex-direction:column;gap:14px}
  .eyebrow{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--orange);display:inline-flex;align-items:center;gap:8px}
  .eyebrow .dot{width:8px;height:8px;border-radius:var(--r-full);background:var(--orange)}
  h1.title{font-family:var(--display);font-weight:900;letter-spacing:-.02em;line-height:1.05;
    font-size:clamp(30px,6vw,52px);margin:0}
  .meta{display:flex;flex-wrap:wrap;gap:10px}
  .meta .chip .material-symbols-outlined{font-size:16px}

  /* description / tabs */
  .desc{background:var(--card);border:var(--bd);border-radius:var(--r-3xl);box-shadow:var(--sh);padding:24px}
  .desc h2{font-family:var(--display);font-weight:900;font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .desc h2 .material-symbols-outlined{color:var(--orange)}
  .desc .body{color:var(--slate-700);font-size:15px;line-height:1.7;white-space:pre-line}
  .desc .empty{color:var(--slate-400)}

  .tabbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .tab{font-family:var(--display);font-weight:800;font-size:13px;cursor:pointer;
    border:var(--bd);background:#fff;color:var(--dark);border-radius:var(--r-full);
    padding:9px 16px;box-shadow:var(--sh-sm);transition:transform .12s,box-shadow .12s,background .12s,color .12s}
  .tab:hover{transform:translate(2px,2px);box-shadow:none}
  .tab.is-active{background:var(--orange);color:#fff;border-color:var(--dark)}
  .tabpanel{display:none}
  .tabpanel.is-active{display:block}

  /* important dates */
  .dates{list-style:none;margin:0;padding:0}
  .dates li{display:flex;justify-content:space-between;gap:14px;align-items:baseline;
    padding:11px 0;border-bottom:1px solid var(--slate-200);font-size:14px}
  .dates li:last-child{border-bottom:0}
  .dates .dlabel{color:var(--slate-600);font-weight:600}
  .dates .dval{font-family:var(--mono);font-weight:700;color:var(--dark);text-align:right;white-space:nowrap}

  /* categories mini */
  .cats{display:flex;flex-wrap:wrap;gap:8px}
  .cat{font-family:var(--mono);font-size:12px;font-weight:700;border:var(--bd);border-radius:var(--r-lg);
    background:#fff;box-shadow:var(--sh-sm);padding:8px 12px;display:flex;flex-direction:column;gap:2px}
  .cat b{font-family:var(--sans)} .cat .fee{color:var(--orange)}

  /* sticky register bar */
  .cta-wrap{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;padding-top:4px}
  .cta-wrap .note{font-family:var(--mono);font-size:12px;color:var(--slate-500)}
  .reg-btn{font-size:16px;padding:16px 28px}
  .reg-btn .material-symbols-outlined{font-size:20px}

  .state{text-align:center;padding:60px 16px;color:var(--slate-500)}
  .state .material-symbols-outlined{font-size:44px;color:var(--slate-300);display:block;margin:0 auto 12px}
  [hidden]{display:none!important}

  /* ── Nightmode (per-event theme, set by superadmin in /engine) ──
     Dark background variant. Retunes tp-theme tokens so cards, text,
     borders and the brutal shadows stay legible on a dark canvas;
     the orange brand + layout are untouched. */
  body[data-theme="nightmode"]{
    --canvas:#0B1120; --card:#131C2E; --dark:#E5E9F0;
    --slate-700:#CBD5E1; --slate-600:#AEBACd; --slate-500:#94A3B8;
    --slate-400:#64748B; --slate-300:#475569; --slate-200:#334155;
    --slate-100:#1E293B; --slate-50:#0F172A;
    background:#0B1120; color:#E5E9F0;
  }
  body[data-theme="nightmode"] .ev-head{background:rgba(11,17,32,.95)}
  body[data-theme="nightmode"] .flyer{background:#131C2E}
  body[data-theme="nightmode"] .cat{background:#131C2E}
  /* Home button keeps its white pill → force dark text so it stays legible. */
  body[data-theme="nightmode"] #homeBtn{color:#0F172A}
  body[data-theme="nightmode"] #homeBtn .material-symbols-outlined{color:#0F172A}
  /* Tab buttons: white chips + dark text so they stand out on the dark card
     (default token would make text light-on-white and vanish). Active = orange. */
  body[data-theme="nightmode"] .tab{background:#fff;color:#0F172A}
  body[data-theme="nightmode"] .tab.is-active{background:var(--orange);color:#fff}
</style>
</head>
<body>
<header class="ev-head"><div class="inner">
  <span class="ev-title" id="evTitle"></span>
  <a class="btn btn--white btn--sm" id="homeBtn" href="#"><span class="material-symbols-outlined" style="font-size:16px">home</span>Home</a>
</div></header>

<div class="wrap">
  <div class="dots dotgrid"></div>
  <div id="host" class="stack">
    <div class="state"><span class="material-symbols-outlined">progress_activity</span>Memuat…</div>
  </div>
</div>

<script>
(function(){
  var API="/api", TRK_ID_RE=/^(EV_|TM_)/;
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function slugify(s){ return String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80); }
  // Google Drive "uc?export=view" links do not reliably hotlink inside <img>;
  // the thumbnail endpoint does. Normalise any Drive URL to that form.
  function imgSrc(u){
    u=String(u||"");
    var m=u.match(/drive\.google\.com\/(?:uc\?(?:[^"']*?&)?id=|open\?id=|thumbnail\?(?:[^"']*?&)?id=|file\/d\/)([-\w]{20,})/);
    return m ? ("https://drive.google.com/thumbnail?id="+m[1]+"&sz=w2000") : u;
  }
  function phInner(name){ return '<div class="ph"><span class="material-symbols-outlined">sports_tennis</span><span>'+esc(name)+'</span></div>'; }
  window.tpFlyerFail=function(img){ var f=img.closest(".flyer"); if(f){ f.className="flyer placeholder"; f.innerHTML=phInner(f.getAttribute("data-name")||""); } };
  function ref(){
    var m=location.pathname.match(/\/event\/([^\/?#]+)/); if(m) return decodeURIComponent(m[1]);
    var seg=location.pathname.replace(/^\/+|\/+$/g,"").split("/").filter(Boolean);
    if(seg.length===1 && seg[0].toLowerCase()!=="event" && seg[0].indexOf(".")<0) return decodeURIComponent(seg[0]);
    return new URLSearchParams(location.search).get("e")||"";
  }
  function api(path){
    return fetch(API+"/"+path).then(function(r){ return r.json().then(function(d){ if(!r.ok){var e=new Error((d&&d.error)||("HTTP "+r.status));e.status=r.status;throw e;} return d; }); });
  }
  var host=document.getElementById("host");
  function fail(msg){ host.innerHTML='<div class="state"><span class="material-symbols-outlined">event_busy</span>'+esc(msg)+'</div>'; }

  var RAW=ref();
  if(!RAW){ fail("Event tidak ditemukan."); return; }

  // Resolve slug/eventId -> event summary (+ eventId), then load the public form.
  api("tournament/events").then(function(d){
    var events=(d&&d.events)||[];
    var ev;
    if(TRK_ID_RE.test(RAW)) ev=events.filter(function(e){return e.eventId===RAW;})[0];
    if(!ev){ var s=slugify(RAW); var hits=events.filter(function(e){return ((e.slug&&String(e.slug).toLowerCase())||slugify(e.name))===s;}); ev=hits[hits.length-1]; }
    var eventId=(ev&&ev.eventId)||(TRK_ID_RE.test(RAW)?RAW:"");
    if(!eventId){ fail("Event \""+esc(RAW)+"\" tidak ditemukan."); return; }
    return api("reg/public/"+encodeURIComponent(eventId)).then(
      function(pub){ render(ev, pub, eventId); },
      function(err){ render(ev, {status:(err.status===404?"none":"error"), config:{}, categories:[]}, eventId, err); }
    );
  }).catch(function(){ fail("Gagal memuat data event."); });

  function chip(icon,text){ return text?'<span class="chip chip--brutal"><span class="material-symbols-outlined">'+icon+'</span>'+esc(text)+'</span>':''; }

  function render(ev, pub, eventId, err){
    ev=ev||{}; pub=pub||{}; var cfg=pub.config||{};
    // Per-event theme (set by superadmin in /engine): "daylight" (default) or "nightmode".
    if(cfg.theme==="nightmode") document.body.setAttribute("data-theme","nightmode");
    else document.body.removeAttribute("data-theme");
    var name=pub.name||ev.name||"Tournament";
    var venue=(ev.venue||cfg.address||"");
    var date=ev.date||"";
    var region=cfg.region||"";
    var status=pub.status||"none";
    var open=status==="open";
    // A friendly ref for the registration wizard link.
    var regRef=(ev&&ev.slug)?ev.slug:(eventId||RAW);

    // Flyer (top). Broken image → fall back to the branded placeholder.
    var flyer = cfg.flyer
      ? '<div class="flyer" data-name="'+esc(name)+'"><img src="'+esc(imgSrc(cfg.flyer))+'" alt="Flyer '+esc(name)+'" referrerpolicy="no-referrer" loading="eager" onerror="tpFlyerFail(this)"/></div>'
      : '<div class="flyer placeholder">'+phInner(name)+'</div>';

    // Status chip
    var statusChip = open
      ? '<span class="chip chip--mint chip--pill"><span class="dot" style="background:var(--mint)"></span>PENDAFTARAN DIBUKA</span>'
      : (status==="closed"
          ? '<span class="chip chip--amber chip--pill">PENDAFTARAN DITUTUP</span>'
          : '<span class="chip chip--pill">PENDAFTARAN BELUM DIBUKA</span>');

    // Tab bodies: About (description) is the default; Players eligibility,
    // Game Rules and Important Date are authored per-event in /engine.
    function panelBody(text, empty){ return text ? esc(text) : '<span class="empty">'+empty+'</span>'; }
    function datesBody(tl){
      tl=tl||{};
      var rows=[
        ["Registration opens", tl.openStart],
        ["Registration closes", tl.openEnd],
        ["Curation starts", tl.curationStart],
        ["Appeal deadline", tl.appealDeadline],
        ["Technical Meeting", tl.tmDate],
        ["Order of play released", tl.oopDate]
      ].filter(function(r){ return r[1]; });
      if(!rows.length) return '<span class="empty">No important dates yet.</span>';
      return '<ul class="dates">'+rows.map(function(r){
        return '<li><span class="dlabel">'+esc(r[0])+'</span><span class="dval">'+esc(r[1])+'</span></li>';
      }).join("")+'</ul>';
    }
    var tabs =
      '<div class="desc">'+
        '<div class="tabbar" role="tablist">'+
          '<button type="button" class="tab is-active" data-tab="about" role="tab">About</button>'+
          '<button type="button" class="tab" data-tab="elig" role="tab">Players eligibility</button>'+
          '<button type="button" class="tab" data-tab="rules" role="tab">Game Rules</button>'+
          '<button type="button" class="tab" data-tab="dates" role="tab">Important Date</button>'+
        '</div>'+
        '<div class="tabpanel is-active" data-panel="about"><div class="body">'+panelBody(cfg.description,'Belum ada deskripsi untuk event ini.')+'</div></div>'+
        '<div class="tabpanel" data-panel="elig"><div class="body">'+panelBody(cfg.eligibility,'Belum ada info kelayakan peserta.')+'</div></div>'+
        '<div class="tabpanel" data-panel="rules"><div class="body">'+panelBody(cfg.rules,'Belum ada aturan permainan.')+'</div></div>'+
        '<div class="tabpanel" data-panel="dates"><div class="body">'+datesBody(cfg.timeline)+'</div></div>'+
      '</div>';

    // Categories (optional, compact)
    var cats=(pub.categories||[]).map(function(c){
      return '<div class="cat"><b>'+esc(c.label||"")+(c.level?' · '+esc(c.level):'')+'</b>'+(c.fee?'<span class="fee">'+esc(c.fee)+'</span>':'')+'</div>';
    }).join("");

    // CTA
    var cta = open
      ? '<a class="btn btn--primary btn--pop btn--upper reg-btn" href="/daftar/'+encodeURIComponent(regRef)+'"><span class="material-symbols-outlined">how_to_reg</span>Register now</a>'
      : '<span class="btn btn--ghost btn--upper reg-btn" style="cursor:default;opacity:.7">'+(status==="closed"?"Pendaftaran ditutup":"Pendaftaran belum dibuka")+'</span>';

    // Header: event title replaces the logo; Home points to this event's page.
    var titleEl=document.getElementById("evTitle"); if(titleEl) titleEl.textContent=name;
    var homeEl=document.getElementById("homeBtn"); if(homeEl) homeEl.setAttribute("href","/"+encodeURIComponent(regRef));

    host.innerHTML = flyer + tabs + '<div class="cta-wrap">'+statusChip+cta+'</div>';
    // Tab switching
    var tabBtns=host.querySelectorAll(".tab"), panels=host.querySelectorAll(".tabpanel");
    tabBtns.forEach(function(btn){ btn.addEventListener("click",function(){
      var t=btn.getAttribute("data-tab");
      tabBtns.forEach(function(b){ b.classList.toggle("is-active", b===btn); });
      panels.forEach(function(p){ p.classList.toggle("is-active", p.getAttribute("data-panel")===t); });
    }); });
    document.title = name+" · TurnamenPadel";
  }
})();
</script>
</body>
</html>
