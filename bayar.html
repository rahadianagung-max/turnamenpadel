<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pembayaran · TurnamenPadel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/tp-theme.css"/>
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:18px}
  .card{max-width:460px;width:100%}
  .logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:16px}
  .logo .glyph{width:34px;height:34px;border-radius:var(--r-lg);background:var(--orange);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:15px;border:var(--bd)}
  .logo .name{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:-.01em}
  .logo .name b{color:var(--orange)}
  h2{font-family:var(--display);font-weight:900;font-size:24px;margin:0 0 10px}
  .muted{color:var(--slate-600)} .note{font-size:12px;color:var(--slate-500);margin-top:8px}
  .box{background:var(--slate-50);border:var(--bd);border-radius:var(--r-xl);padding:16px;margin-bottom:14px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .elo{font-family:var(--mono);color:var(--orange);font-weight:800;font-size:22px}
  .divider{height:2px;background:var(--slate-200);margin:12px 0}
  label span{display:block;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--slate-600);margin-bottom:6px;text-transform:uppercase}
  input{width:100%;background:#fff;border:var(--bd);color:var(--dark);border-radius:var(--r-lg);padding:11px 12px;font-family:var(--sans);font-size:14px;box-shadow:var(--sh-sm)}
  input[type=file]{padding:9px}
  .btn{appearance:none;width:100%;font-family:var(--display);font-weight:900;font-size:14px;text-transform:uppercase;
    letter-spacing:.04em;padding:14px;border:var(--bd);border-radius:var(--r-xl);background:var(--orange);color:#fff;
    cursor:pointer;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:translate(2px,2px);box-shadow:var(--sh-sm)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--sh-sm)}
  .chip{display:inline-flex;align-items:center;font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--r-full);border:var(--bd)}
  .chip.ok{color:#065F46;border-color:var(--mint);background:var(--mint-20)}
  .chip.warn{color:var(--amber);border-color:var(--amber-bd);background:var(--amber-bg)}

  /* ── Nightmode (inherited from the event's per-event theme, set in /engine).
     Keeps the pay-link page consistent with a nightmode event. */
  body[data-theme="nightmode"]{
    --canvas:#0B1120; --card:#131C2E; --dark:#E5E9F0;
    --slate-700:#CBD5E1; --slate-600:#AEBACD; --slate-500:#94A3B8;
    --slate-400:#64748B; --slate-300:#475569; --slate-200:#334155;
    --slate-100:#1E293B; --slate-50:#131C2E;
    background:#0B1120; color:#E5E9F0;
  }
  body[data-theme="nightmode"] input{background:#131C2E}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="glyph">P</span><span class="name">TURNAMEN<b>PADEL</b></span></div>
  <div id="host"><p class="muted">Memuat…</p></div>
</div>
<script>
const API="/api";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function rupiah(n){const v=parseInt(String(n).replace(/\D/g,""));return isNaN(v)?String(n||""):"Rp"+v.toLocaleString("id-ID");}
const P={ }; (function(){ const m=location.pathname.match(/\/bayar\/([^\/?#]+)/); const sp=new URLSearchParams(location.search);
  P.eventId=m?decodeURIComponent(m[1]):sp.get("e")||""; P.r=sp.get("r")||""; P.t=sp.get("t")||""; })();
let PROOF="";
async function api(path,opts){const res=await fetch(API+"/"+path,{method:(opts&&opts.method)||"GET",headers:{"Content-Type":"application/json"},body:opts&&opts.body?JSON.stringify(opts.body):undefined});
  let d={};try{d=await res.json();}catch(e){} if(!res.ok){const err=new Error(d.error||("HTTP "+res.status));err.status=res.status;throw err;} return d;}
function fileToDataUrl(input){return new Promise(r=>{const f=input.files&&input.files[0];if(!f)return r("");const rd=new FileReader();rd.onload=()=>r(rd.result);rd.onerror=()=>r("");rd.readAsDataURL(f);});}
async function boot(){
  const host=document.getElementById("host");
  if(!P.eventId||!P.r||!P.t){ host.innerHTML='<p class="muted">Link pembayaran tidak valid.</p>'; return; }
  let info; try{ info=await api("reg/pay-info/"+encodeURIComponent(P.eventId)+"?r="+encodeURIComponent(P.r)+"&t="+encodeURIComponent(P.t)); }
  catch(e){ host.innerHTML='<p class="muted">'+esc(e.message)+'</p>'; return; }
  // Per-event theme (set in /engine): match the event's nightmode.
  if(info && info.theme==="nightmode") document.body.setAttribute("data-theme","nightmode");
  else document.body.removeAttribute("data-theme");
  if(info.status==="received"||info.status==="imported"||info.status==="approved"||info.status==="final"){ host.innerHTML='<h2>Sudah dibayar</h2><p class="muted">Pembayaran untuk pendaftaran ini sudah tercatat.</p>'; return; }
  host.innerHTML=`<h2>Pembayaran</h2>
    <p class="muted" style="margin:0 0 12px">${esc(info.team)} · ${esc(info.category)} — ${esc(info.eventName)}</p>
    <div class="box"><div class="row"><span class="muted">Total</span><b class="elo">${rupiah(info.fee)}</b></div>
      <div class="divider"></div><div class="muted" style="font-size:13px">Transfer ke:</div><div class="mono" style="margin-top:4px">${esc(info.account||'-')}</div></div>
    <label><span>Upload bukti transfer</span><input type="file" accept="image/*" onchange="pick(this)"></label>
    <div id="proofChip" style="margin:8px 0"></div>
    <button class="btn" id="btn" disabled onclick="submitPay()">Kirim bukti</button>
    <p class="note">Setelah dikirim, status menjadi menunggu kurasi.</p>`;
}
async function pick(input){ PROOF=await fileToDataUrl(input);
  document.getElementById("proofChip").innerHTML = PROOF?'<span class="chip ok">bukti terpilih ✔</span>':'';
  document.getElementById("btn").disabled=!PROOF; }
async function submitPay(){
  const btn=document.getElementById("btn"); btn.disabled=true; btn.textContent="Mengirim…";
  try{ await api("reg/pay",{method:"POST",body:{eventId:P.eventId,regId:P.r,token:P.t,proof:PROOF}});
    document.getElementById("host").innerHTML='<h2>✅ Terima kasih!</h2><p class="muted">Bukti transfer terkirim. Status: <span class="chip warn">menunggu kurasi</span>. Kami akan mengabari via email.</p>';
  }catch(e){ btn.disabled=false; btn.textContent="Kirim bukti"; alert("Gagal: "+e.message); }
}
boot();
</script>
</body>
</html>
