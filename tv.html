<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trekkr · TV Board</title>
<!-- Full Simulation mode (inert unless ?sim=1): routes /api/* to an in-browser mock, never the real server. -->
<script>if(new URLSearchParams(location.search).get("sim")==="1"){document.write('<script src="/sim/backend.js"><\/script><script src="/sim/guard.js"><\/script>');}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
<style>
  /* PlayRank-home neo-brutalist skin for the TV/LED board. Token NAMES are kept
     (--bg/--panel/--line/--text/--muted/--accent/--accent2/--grad) so the per-event
     theme override (applyTvTheme) and the fit-to-screen logic keep working. Light
     default; dark follows the viewer's OS. */
  :root{
    --bg:#EFEADF; --panel:#FBF8F1; --panel2:#ECE6DA; --line:#0F172A;
    --text:#0F172A; --muted:#475569; --faint:#64748B; --soft:#CBD5E1;
    --accent:#FF5722; --accent-10:rgba(255,87,34,.12); --accent2:#B45309;
    --blue:#2563EB; --blue-bg:#DBEAFE; --silver:#64748B;
    --hot:#FF3830; --danger:#DC2626; --shadow:#0F172A;
    --grad:linear-gradient(90deg,#FF5722,#FF7A45);
    --disp:'Plus Jakarta Sans',system-ui,sans-serif;
    --mono:'Space Grotesk',ui-monospace,monospace;
    --body:'Inter',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0B0A08; --panel:#16130E; --panel2:#201B14; --line:#3A3228;
    --text:#F2EADF; --muted:#C4BEAE; --faint:#8A8370; --soft:#4A4537;
    --accent:#FF6A3D; --accent-10:rgba(255,106,61,.14); --accent2:#FFB000;
    --blue:#7DA2FF; --blue-bg:#1E2A44; --silver:#AEB6C2; --shadow:#000;
    --grad:linear-gradient(90deg,#FF6A3D,#FF925F); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0B0A08; --panel:#16130E; --panel2:#201B14; --line:#3A3228;
    --text:#F2EADF; --muted:#C4BEAE; --faint:#8A8370; --soft:#4A4537;
    --accent:#FF6A3D; --accent-10:rgba(255,106,61,.14); --accent2:#FFB000;
    --blue:#7DA2FF; --blue-bg:#1E2A44; --silver:#AEB6C2; --shadow:#000;
    --grad:linear-gradient(90deg,#FF6A3D,#FF925F); color-scheme:dark;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  [hidden]{display:none!important;}
  html,body{height:100%;}
  body{background:var(--bg); color:var(--text); font-family:var(--body); overflow:hidden;}
  .material-symbols-outlined{font-family:'Material Symbols Outlined'; font-weight:normal; font-style:normal; line-height:1;
    vertical-align:middle; font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;}
  .screen{height:100vh; display:flex; flex-direction:column; padding:2vh 2.2vw;}
  @keyframes liveblink{0%,62%{opacity:1} 63%,100%{opacity:.22}}

  /* top bar: category (left) · event name (center) · QR + date + LIVE (right) */
  .bar{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1.2vw; flex:0 0 auto; margin-bottom:1.2vh;}
  .catbox{grid-column:1; justify-self:start; min-width:0;}
  .catname{font-family:var(--disp); font-weight:900; font-size:clamp(16px,1.7vw,36px); letter-spacing:-.01em; line-height:1.03; color:var(--text);}
  .catnext{font-family:var(--mono); font-size:clamp(9px,.8vw,16px); color:var(--faint); margin-top:.5vh; letter-spacing:.02em;}
  .catnext b{color:var(--accent2);}
  .ev{grid-column:2; text-align:center; min-width:0;}
  .ev .nm{font-family:var(--disp); font-weight:900; font-size:clamp(26px,3vw,64px); line-height:1; letter-spacing:-.02em; text-transform:uppercase;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .meta{grid-column:3; justify-self:end; display:flex; align-items:center; gap:clamp(8px,.9vw,18px);}
  .qr{display:flex; align-items:center; gap:.7vw;}
  .qr .qrimg{background:#fff; padding:.4vw; border:2px solid var(--line); border-radius:9px; line-height:0; box-shadow:3px 3px 0 0 var(--shadow);}
  .qr .qrimg img{display:block; width:clamp(60px,5vw,104px); height:clamp(60px,5vw,104px);}
  .qr .qrlabel{font-family:var(--mono); text-transform:uppercase; letter-spacing:.08em; font-weight:700;
    font-size:clamp(9px,.74vw,13px); color:var(--accent2); line-height:1.35;}
  .title{text-align:right; font-family:var(--mono);}
  .title .tt{font-family:var(--disp); font-weight:800; font-size:clamp(12px,1.1vw,20px); line-height:1.05; color:var(--muted);}
  .title .td{font-family:var(--mono); font-size:clamp(10px,.82vw,16px); color:var(--faint); letter-spacing:.04em; margin-top:.4vh;}
  .title .l{display:inline-flex; align-items:center; gap:6px; margin-top:.7vh; font-family:var(--mono); font-weight:800;
    font-size:clamp(9px,.78vw,14px); letter-spacing:.08em; color:#fff; background:var(--accent); border:2px solid var(--line);
    border-radius:999px; box-shadow:2px 2px 0 0 var(--shadow); padding:3px 10px;}
  .title .l::before{content:""; width:8px; height:8px; border-radius:50%; background:#fff; animation:liveblink 1.4s steps(1,end) infinite;}

  /* main split */
  .main{flex:1 1 auto; min-height:0; display:flex; gap:1.6vw;}
  .left{flex:0 0 35%; min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden; gap:1vh;}
  .right{flex:1 1 auto; min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden;}
  #leftTitle{display:none;}  /* "Now Playing" heading removed per request */
  .col-title{font-family:var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--accent2); font-weight:800;
    font-size:clamp(11px,.9vw,16px); margin:0 0 1vh; flex:0 0 auto;}
  .col-title.up{margin-top:.4vh;}
  .col-title.live{color:var(--accent);}
  .col-title.live::before{content:"\25CF  ";}
  .rot-cd{display:none;}  /* countdown shown under the category name instead */

  /* avatars — square tile, gender-icon fallback */
  .av{ --s:42px; position:relative; width:var(--s); height:var(--s); border-radius:calc(var(--s)*.22); overflow:hidden;
    display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
    background:var(--panel2); border:2px solid var(--line); box-shadow:2px 2px 0 0 var(--shadow);}
  .av img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .av .material-symbols-outlined{color:var(--faint); font-size:calc(var(--s)*.62);}

  /* now playing */
  #nowWrap{flex:1 1 auto; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:1vh;}
  .np-card{flex:1 1 0; min-height:0; overflow:hidden; display:flex; flex-direction:row; align-items:center; gap:1vw;
    border:2.5px solid var(--line); border-radius:16px; background:var(--panel); box-shadow:5px 5px 0 0 var(--accent); padding:.6vh 1.2vw;}
  .np-court{flex:0 0 auto; font-family:var(--mono); font-weight:800; color:#fff; background:var(--accent);
    border:2px solid var(--line); border-radius:8px; box-shadow:2px 2px 0 0 var(--shadow); padding:.5vh .8vw;
    font-size:clamp(11px,1vw,19px); letter-spacing:.03em; white-space:nowrap;}
  .np-teams{flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:.7vw; overflow:hidden; white-space:nowrap; font-size:clamp(13px,1.15vw,22px);}
  .np-teams .npt{font-family:var(--disp); font-weight:800; min-width:0; overflow:hidden; text-overflow:ellipsis; flex:0 1 auto;}
  .np-teams .amp{color:var(--faint); font-weight:600; padding:0 .18em;}
  .np-x{flex:0 0 auto; font-family:var(--mono); font-weight:800; color:var(--faint); font-size:.62em; letter-spacing:.1em;}
  .np-meta{flex:0 1 auto; max-width:24%; font-family:var(--mono); font-weight:700; color:var(--muted); font-size:clamp(9px,.82vw,15px);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right;}
  .np-dot{flex:0 0 auto; width:clamp(9px,.8vw,15px); height:clamp(9px,.8vw,15px); border-radius:50%; background:var(--accent);
    box-shadow:0 0 10px var(--accent); animation:liveblink 1.4s steps(1,end) infinite;}
  .np-empty,.up-empty{color:var(--faint); font-family:var(--mono); font-size:clamp(13px,1.1vw,18px); padding:2vh 0;}

  /* upcoming */
  #nextWrap{flex:0 0 auto; min-height:clamp(80px,12vh,180px); display:flex; flex-direction:column; gap:.7vh;}
  .up-row{display:flex; align-items:center; gap:.9vw; border:2px solid var(--line); border-radius:10px; background:var(--panel);
    box-shadow:2px 2px 0 0 var(--shadow); padding:.6vh 1vw;}
  .up-time{flex:0 0 auto; font-family:var(--mono); font-weight:700; color:var(--text); font-size:clamp(11px,1vw,18px); letter-spacing:.02em;}
  .up-court{flex:0 0 auto; font-family:var(--mono); font-weight:700; color:var(--accent2); font-size:clamp(9px,.78vw,14px); white-space:nowrap;}
  .up-teams{flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:.6vw; overflow:hidden; white-space:nowrap; font-size:clamp(11px,.98vw,18px);}
  .up-teams b{font-family:var(--disp); font-weight:700; overflow:hidden; text-overflow:ellipsis; flex:0 1 auto;}
  .up-x{flex:0 0 auto; font-family:var(--mono); color:var(--faint); font-size:clamp(9px,.78vw,13px); text-transform:uppercase;}

  /* standings (keeps --sfz so fit-to-screen still works) */
  #standWrap{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:1.2vh;}
  .fit{--sfz:15px; display:flex; flex-direction:column; gap:calc(var(--sfz)*.9); align-content:start;}
  .cat-block{display:flex; flex-direction:column;}
  .cat-block + .cat-block{margin-top:calc(var(--sfz)*.6);}
  .cat-head{flex:0 0 auto; font-family:var(--disp); font-weight:900; font-size:calc(var(--sfz)*1.5); display:flex; align-items:baseline; gap:.9vw; flex-wrap:wrap; margin-bottom:calc(var(--sfz)*.5);}
  .cat-cap{font-family:var(--mono); font-weight:400; font-size:calc(var(--sfz)*.72); color:var(--muted); letter-spacing:.02em;}
  .grp-grid{display:grid; gap:calc(var(--sfz)*.6) calc(var(--sfz)*.6); align-content:start;}
  .grp{overflow:hidden; border:2px solid var(--line); border-radius:calc(var(--sfz)*.7); background:var(--panel);
    box-shadow:3px 3px 0 0 var(--shadow); padding:calc(var(--sfz)*.55) calc(var(--sfz)*.65); display:flex; flex-direction:column;}
  .grp-h{flex:0 0 auto; font-family:var(--disp); font-weight:900; color:var(--text); font-size:calc(var(--sfz)*1.08); letter-spacing:-.01em; margin-bottom:calc(var(--sfz)*.35);}
  table.st{width:100%; border-collapse:collapse; table-layout:auto; font-variant-numeric:tabular-nums;}
  table.st th{font-family:var(--mono); font-weight:700; color:var(--faint); text-transform:uppercase; letter-spacing:.03em;
    font-size:calc(var(--sfz)*.64); text-align:center; padding:calc(var(--sfz)*.2) calc(var(--sfz)*.28); border-bottom:2px solid var(--line); white-space:nowrap;}
  table.st th.nm{text-align:left;}
  table.st td{font-size:var(--sfz); padding:calc(var(--sfz)*.2) calc(var(--sfz)*.3); text-align:center; border-bottom:1px solid var(--soft); white-space:nowrap; vertical-align:middle; color:var(--text);}
  table.st td.rk{font-family:var(--mono); font-weight:700; color:var(--accent2); width:1.8em;}
  table.st td.nm{text-align:left; white-space:normal; line-height:1.07; padding-right:calc(var(--sfz)*.4);}
  table.st td.nm .p1{display:block; font-family:var(--disp); font-weight:800; color:inherit;}
  table.st td.nm .p2{display:block; font-weight:600; color:var(--muted);}
  table.st td.pts{color:var(--accent); font-weight:800;}
  table.st tr:last-child td{border-bottom:none;}
  table.st tbody tr.top td,table.st tbody tr.champ td{background:var(--accent-10);}
  table.st tbody tr.top td.rk,table.st tbody tr.champ td.rk{color:var(--accent);}
  table.st tbody tr.prosp td{background:rgba(255,122,26,.06);}
  /* ranking legend (standings only) */
  .tv-legend{flex:0 0 auto; display:flex; flex-wrap:wrap; gap:.4vw 1.2vw; align-items:center; margin-top:1vh;
    border:2px solid var(--line); border-radius:12px; background:var(--panel); box-shadow:3px 3px 0 0 var(--shadow);
    padding:.8vh 1.1vw; font-family:var(--mono); color:var(--muted); font-size:clamp(9px,.78vw,15px);}
  .tv-legend b{color:var(--text); font-weight:800;}
  .tv-legend .rule b{color:var(--accent);}
  .center{display:flex; align-items:center; justify-content:center; height:100%; color:var(--faint); font-family:var(--mono);
    font-size:clamp(14px,1.4vw,22px); text-align:center; padding:2vh;}

  /* brand pill — bottom-right */
  .footer{position:fixed; right:max(12px,env(safe-area-inset-right,0px)); bottom:calc(1.4vh + env(safe-area-inset-bottom,0px)); z-index:40;
    display:flex; align-items:center; gap:7px; background:var(--panel); border:2px solid var(--line); border-radius:999px;
    box-shadow:2px 2px 0 0 var(--shadow); padding:4px 12px;}
  .footer .pwr{font-family:var(--mono); font-size:clamp(8px,.68vw,12px); color:var(--faint); letter-spacing:.08em; text-transform:uppercase;}
  .footer .logo-sm{font-family:var(--disp); font-weight:900; font-size:clamp(12px,1vw,18px); letter-spacing:-.01em;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}

  /* playoff bracket */
  .bracket-block{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;}
  .bracket-block + .bracket-block{margin-top:1.4vh;}
  .bt{flex:0 0 auto; font-family:var(--disp); font-weight:900; font-size:clamp(15px,1.5vw,28px); margin-bottom:1vh; letter-spacing:-.01em;}
  .bpodium{flex:0 0 auto; display:flex; gap:1vw; margin-bottom:1.4vh;}
  .bpod{flex:1; min-width:0; border:2px solid var(--line); border-radius:13px; background:var(--panel); box-shadow:4px 4px 0 0 var(--shadow); padding:1vh 1vw;}
  .bpod .bpk{font-family:var(--mono); font-weight:800; font-size:clamp(9px,.8vw,14px); letter-spacing:.05em; text-transform:uppercase; color:var(--muted);}
  .bpod .bpw{font-family:var(--disp); font-weight:800; font-size:clamp(14px,1.3vw,24px); margin-top:.5vh; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bpod.g{border-color:var(--accent); background:var(--accent-10);} .bpod.g .bpk{color:var(--accent);}
  .bpod.g .bpw{color:var(--accent);} .bpod.s .bpk{color:var(--silver);} .bpod.b .bpk{color:var(--accent2);}
  .bracket{flex:1 1 auto; min-height:0; display:flex; gap:1vw; align-items:stretch; overflow:hidden;}
  .bround{flex:1 1 0; min-width:0; display:flex; flex-direction:column;}
  .bround.wide{flex:2.4 1 0;}
  .bround.narrow{flex:0 0 auto; width:clamp(140px,13vw,230px);}
  .brh{flex:0 0 auto; font-family:var(--mono); font-weight:700; font-size:clamp(9px,.78vw,14px); color:var(--faint);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:.8vh; padding-bottom:.6vh; border-bottom:2px solid var(--line); text-align:left;}
  .brcol{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:space-around; gap:1vh;}
  .bround.wide .brcol{justify-content:flex-start; gap:.6vh;}
  .bround.wide .bmatch{flex:1 1 0; min-height:0; overflow:hidden; justify-content:center;}
  .bmatch{border:2px solid var(--line); border-radius:11px; background:var(--panel); box-shadow:3px 3px 0 0 var(--shadow); padding:.9vh .8vw; display:flex; flex-direction:column; gap:.35vh;}
  .bmatch.bye{opacity:.45;}
  .bmeta{font-family:var(--mono); font-size:clamp(8px,.72vw,12px); color:var(--faint); letter-spacing:.02em; margin-bottom:.2vh;}
  .bteam{display:flex; align-items:center; gap:.4vw; min-width:0;}
  .bteam.win{color:var(--accent); font-weight:800;}
  .bteam.tbd{color:var(--faint); font-style:italic;}
  .bteam .bnm{flex:1 1 auto; min-width:0; font-family:var(--disp); font-weight:700; font-size:var(--bfz,clamp(11px,.98vw,18px)); line-height:1.12; word-break:break-word; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .bteam.win .bnm{font-weight:800;}
  .bteam .bsc{flex:0 0 auto; font-family:var(--mono); font-weight:700; font-size:var(--bfz,clamp(11px,1vw,18px)); margin-left:auto; padding-left:.4vw;}
  .bracket-block.dense .bmatch{padding:.6vh .65vw; gap:.2vh;} .bracket-block.dense .brcol{gap:.6vh;} .bracket-block.dense .brh{margin-bottom:.5vh; padding-bottom:.4vh;}
  .bracket-block.xdense .bmatch{padding:.4vh .5vw; gap:.1vh;} .bracket-block.xdense .brcol{gap:.35vh;} .bracket-block.xdense .brh{margin-bottom:.35vh; padding-bottom:.3vh; font-size:clamp(8px,.66vw,11px);} .bracket-block.xdense .bmeta{display:none;}
  .bracket-block.proj .bt{color:var(--accent);} .bmatch.proj{border-style:dashed;} .bteam.proj{color:var(--muted); font-style:italic;}

  /* provisional qualification strip */
  .qrulebox{flex:0 0 auto; background:var(--accent-10); border:2px solid var(--accent); border-radius:14px; padding:1vh 1.2vw; margin-bottom:1.2vh;}
  .qruleh{font-family:var(--disp); font-weight:900; font-size:clamp(14px,1.4vw,26px); letter-spacing:-.01em; color:var(--accent);}
  .qruleb{font-family:var(--body); font-size:clamp(11px,1vw,20px); color:var(--text); line-height:1.5; margin-top:.5vh;}
  .qruleb b{color:var(--accent); font-weight:800;}
  .qchip .qg{flex:0 0 auto; font-family:var(--mono); font-weight:700; font-size:clamp(8px,.68vw,12px); color:var(--muted); letter-spacing:.02em;}
  .qpanel{flex:0 0 auto; margin-bottom:1.2vh;}
  .qh{font-family:var(--disp); font-weight:900; font-size:clamp(14px,1.4vw,24px); margin-bottom:.7vh;}
  .qh .qsub{font-family:var(--mono); font-weight:400; font-size:clamp(9px,.8vw,14px); color:var(--muted); margin-left:.6vw;}
  .qchips{display:grid; grid-template-columns:repeat(4,1fr); gap:.6vw;}
  .qchip{display:flex; align-items:center; gap:.4vw; border:2px solid var(--line); border-radius:9px; background:var(--panel); box-shadow:2px 2px 0 0 var(--shadow); padding:.5vh .6vw; min-width:0;}
  .qchip .qp{font-family:var(--mono); font-weight:700; font-size:clamp(9px,.8vw,14px); color:var(--muted); flex:0 0 auto;}
  .qchip .qn{flex:1 1 auto; min-width:0; font-family:var(--disp); font-weight:800; font-size:clamp(11px,.95vw,17px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .qchip .qn.tbc{color:var(--faint); font-style:italic; font-weight:400;}
  .qchip.ok{border-color:var(--accent); background:var(--accent-10);}
  .qgblk{margin-bottom:.8vh;}
  .qgl{font-family:var(--mono); font-weight:800; font-size:clamp(9px,.8vw,14px); letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:.4vh;}

  /* full-screen winners — three equal placements side by side */
  .winners3{flex:1 1 auto; min-height:0; display:grid; grid-template-columns:repeat(3,1fr); gap:1.4vw; align-items:stretch; margin-top:1vh;}
  .wcard{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.8vh; text-align:center;
    background:var(--panel); border:2.5px solid var(--line); border-radius:20px; box-shadow:6px 6px 0 0 var(--shadow); padding:2vh 1vw;}
  .wcard.champ{border-color:var(--accent); box-shadow:7px 7px 0 0 var(--accent); background:var(--accent-10);}
  .wrank{font-family:var(--mono); font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
    font-size:clamp(13px,1.4vw,30px); display:flex; align-items:center; gap:9px;}
  .wcard.champ .wrank{color:var(--accent);} .wcard.ru .wrank{color:var(--accent2);} .wcard.third .wrank{color:var(--silver);}
  .wcard .wpair{display:flex; gap:1vw;}
  .wcard .av{--s:clamp(60px,6.4vw,150px); border-radius:18px;}
  .wcard.champ .av{border-color:var(--accent); box-shadow:5px 5px 0 0 var(--accent);}
  .wteam{font-family:var(--disp); font-weight:900; line-height:1.04; font-size:clamp(22px,2.7vw,60px);}
  .wcard.champ .wteam{color:var(--accent);}
  .wplayers{font-family:var(--mono); color:var(--muted); font-size:clamp(11px,1.05vw,22px); letter-spacing:.02em; line-height:1.3;}
  .wstat{font-family:var(--mono); font-weight:800; font-size:clamp(13px,1.3vw,28px); letter-spacing:.04em;}
  .wstat .w{color:var(--accent);} .wstat .l{color:var(--faint);} .wstat .sep{color:var(--soft);}

  /* event picker (remote) */
  .tvpick-ov{position:fixed; inset:0; z-index:100; background:var(--bg); padding:5vh 6vw; overflow:auto; display:flex; flex-direction:column;}
  .tvpick-brand{font-family:var(--disp); font-weight:900; font-size:clamp(22px,3vw,44px); background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:.6vh;}
  .tvpick-h{font-family:var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--accent2); font-size:clamp(11px,1.1vw,18px); margin-bottom:3vh;}
  .tvpick-h b{color:var(--accent);}
  .tvpick-list{display:flex; flex-direction:column; gap:1.4vh; max-width:min(94vw,1000px);}
  .tvpick-row{display:flex; align-items:center; gap:1.6vw; padding:1.6vh 1.6vw; border:2px solid var(--line); border-radius:14px; background:var(--panel); box-shadow:3px 3px 0 0 var(--shadow);}
  .tvpick-row.on{border-color:var(--accent); background:var(--accent-10); box-shadow:4px 4px 0 0 var(--accent);}
  .tvpick-n{flex:0 0 auto; font-family:var(--mono); font-weight:700; color:#fff; background:var(--muted); border:2px solid var(--line); border-radius:9px; padding:.5vh 1.1vw; font-size:clamp(15px,1.5vw,26px); min-width:2.2em; text-align:center;}
  .tvpick-row.on .tvpick-n{background:var(--accent);}
  .tvpick-nm{flex:1 1 auto; min-width:0; font-family:var(--disp); font-weight:900; font-size:clamp(22px,2.6vw,46px); line-height:1.02; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tvpick-mt{flex:0 0 auto; font-family:var(--mono); color:var(--muted); font-size:clamp(12px,1.15vw,20px); white-space:nowrap;}
  .tvpick-cd{margin-top:2.4vh; font-family:var(--mono); color:var(--muted); font-size:clamp(12px,1.1vw,18px);}
  .tvpick-cd b{color:var(--accent);}

  /* sponsor reel overlay — stays black so logos sit on a neutral ground */
  #sponsorOverlay{position:fixed; inset:0; z-index:9999; background:#000; display:none; align-items:center; justify-content:center;}
  #sponsorOverlay.show{display:flex; animation:spFade .4s ease;}
  @keyframes spFade{from{opacity:0}to{opacity:1}}
  #sponsorOverlay img{width:100%; height:100%; object-fit:contain; display:block;}
  #spCountdown{position:fixed; left:1.2vw; bottom:1vh; z-index:50; font-family:var(--mono); font-size:clamp(7px,.55vw,10px); color:var(--faint); background:var(--panel); border:2px solid var(--line); border-radius:999px; padding:.35vh .8vw; letter-spacing:.05em;}

</style>
</head>
<body>
<div id="sponsorOverlay"><img id="spImg" alt="sponsor"></div>
<div id="spCountdown"></div>
<div class="screen">
  <div class="bar">
    <div class="catbox">
      <div class="catname" id="catName">—</div>
      <div class="catnext" id="catNext"></div>
    </div>
    <div class="ev"><div class="nm" id="evnm">—</div></div>
    <div class="meta">
      <div class="qr" id="qrBox" style="display:none">
        <div class="qrimg"><img id="qrImg" alt="QR" /></div>
        <div class="qrlabel">Scan to follow<br>live on your phone</div>
      </div>
      <div class="title"><div class="tt" id="evTitle"></div><div class="td" id="evDate"></div><div class="l" id="livedot">LIVE</div></div>
    </div>
  </div>
  <div class="main">
    <div class="left" id="leftCol">
      <div class="col-title live" id="leftTitle">Now Playing</div>
      <div id="nowWrap"><div class="np-empty">Loading…</div></div>
      <div class="col-title up" id="upTitle">Upcoming</div>
      <div id="nextWrap"></div>
    </div>
    <div class="right">
      <div class="col-title" id="rightTitle">Group Standings</div>
      <div class="rot-cd" id="rotCountdown" style="display:none"></div>
      <div id="standWrap"><div class="center">Loading tournament data…</div></div>
      <div class="tv-legend" id="tvLegend" hidden>
        <div><b>P</b> Played · <b>W</b> Win · <b>L</b> Loss · <b>PD</b> Point diff · <b>PF</b> Points for · <b>PA</b> Points against</div>
        <div class="rule"><b>Ranking</b> Most wins → Head-to-head (H2H) → PD → PF → PA</div>
      </div>
    </div>
  </div>
  <div class="footer"><span class="pwr">powered by</span><span class="logo-sm">turnamenpadel.com</span></div>
</div>

<script>
const BASE = location.protocol.startsWith("http") ? "/api" : "https://www.turnamenpadel.com/api";
const qs = new URLSearchParams(location.search);
// Event via ?event=<id> (old links) or friendly slug path /tv/<slug> (resolved
// from the event name in boot()).
let EVENT_ID = qs.get("event");
// ?cat= selects which categories this TV screen shows. One value = single-category
// screen; several (comma-separated ?cat=WD,MD or repeated ?cat=WD&cat=MD) = show just
// those. Empty = all categories. Lets you dedicate one LED to e.g. 2 of 3 categories.
const CAT_FILTER = qs.getAll("cat").flatMap(v=>String(v||"").split(",")).map(s=>s.trim().toLowerCase()).filter(Boolean);
// ?level= further narrows to a level (e.g. ?cat=women&level=lower_bronze). Accepts
// "lower_bronze" / "lower-bronze" / "lower bronze". Combined with ?cat= it is AND.
const nrm = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const LEVEL_FILTER = qs.getAll("level").flatMap(v=>String(v||"").split(",")).map(nrm).filter(Boolean);
function levelMatch(c,q){
  if(!q) return false;
  const lv=nrm(c.level), lb=nrm(levelLabel(c.level));
  if(lv===q||lb===q||lv.startsWith(q)||lb.startsWith(q)) return true;
  // Custom/combined category (level column empty or non-standard, e.g. the level
  // is baked into the category name): match the level token inside the name.
  if(!lb){ const cat=nrm(c.category), cl=nrm(catLabel(c.category)); if(cat.includes(q)||cl.includes(q)) return true; }
  return false;
}
function catAllowed(c){
  const catOk = !CAT_FILTER.length || CAT_FILTER.some(q=>catMatch(c,q));
  const lvlOk = !LEVEL_FILTER.length || LEVEL_FILTER.some(q=>levelMatch(c,q));
  return catOk && lvlOk;
}
let CAT_LABEL = "";
const slugify = s => String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80) || "event";
function slugFromPath(){ const m = /^\/(?:mobile|tv|led)\/([^\/?#]+)/.exec(location.pathname); return m ? decodeURIComponent(m[1]) : ""; }
const PATH_SLUG = slugFromPath();
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state = { data:null };
// Group-stage right-panel toggle: false = standings, true = playoff simulation.
let RIGHT_ALT = false;
// Category rotation for the right panel when the event has 2+ categories.
let CAT_ROT = 0;
const ROT_MS = 60000;      // 60s per category
let nextRotAt = 0;         // timestamp of the next category switch (for the countdown)
let ROT_N = 0;             // categories in the currently shown rotating view (>1 => rotating)
let STAND_PAGES = 1;       // group-standings pages (>1 => split per category & rotating)
let ROT_LABELS = [];       // labels of the categories currently rotating (for the "Next:" line)
const TIER = { MAIN:"Main Bracket", CHAMPION:"Champion", PROSPECT:"Prospect" };
// Full category names (avoid codes like MD/WD/MIXED on the LED board).
function catLabel(c){ const k=String(c||"").trim().toUpperCase(); return {MD:"Men's Doubles", WD:"Women's Doubles", MIXED:"Fixed Mixed"}[k] || c; }
function levelLabel(l){ const k=String(l||"").toLowerCase().trim().replace(/\s+/g,"_"); return {beginner:"Beginner", upper_beginner:"Upper Beginner", lower_bronze:"Lower Bronze", bronze:"Bronze", upper_bronze:"Upper Bronze", silver:"Silver", gold:"Gold", platinum:"Platinum"}[k] || ""; }
// Match a category against the ?cat= URL value (code like WD/MD, its label like
// "women"/"men", or the tournamentId). startsWith avoids "men" also hitting "women".
function catMatch(c,q){ const code=String(c.category||"").toLowerCase(), label=String(catLabel(c.category)||"").toLowerCase(), tid=String(c.tournamentId||"").toLowerCase(); return code===q||tid===q||label===q||label.startsWith(q)||code.startsWith(q); }
// When 2+ categories have content, show only the current one (rotates); else all.
function rotateCats(list){ return (list && list.length>1) ? [list[CAT_ROT % list.length]] : (list||[]); }

async function api(p){ const r=await fetch(BASE+p); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
function fmtTime(t){ const s=String(t==null?"":t).trim(); if(!s) return ""; const ap=/(am|pm)/i.exec(s); const x=s.replace(/\s*(am|pm)/i,"").trim(); const pp=x.split(/[:.]/); let h=parseInt(pp[0],10), m=parseInt(pp[1],10); if(isNaN(h)) return s; if(isNaN(m)) m=0; if(ap){const pm=/pm/i.test(ap[0]); if(pm&&h<12)h+=12; if(!pm&&h===12)h=0;} h=((h%24)+24)%24; m=((m%60)+60)%60; return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }
function normName(s){ return String(s||"").trim().toLowerCase().replace(/\s+/g," "); }
function firstName(s){ const t=String(s||"").trim(); return t? t.split(/\s+/)[0] : ""; }
// TV/mobile show the Display_Name column (set via check-in). The full Name is only
// used on the Trekkr passport + its URL. No more first-name derivation.
function dispName(n){ const p=state.data&&state.data.players&&state.data.players[normName(n)]; const d=p&&p.display?String(p.display).trim():""; return d || String(n||""); }
// TV fallback when a pair has no custom team name: show first name only (compact).
function shortName(n){ return firstName(dispName(n)); }
function firstNames(s){ return String(s||"").split(/\s*[+&]\s*/).filter(Boolean).map(shortName).join(" & "); }
// Event date shown in the top-right (next to the tournament title).
function fmtEventDate(ds){ ds=String(ds||"").trim(); if(!ds) return ""; const d=new Date(ds+"T00:00:00"); if(isNaN(d.getTime())) return ds;
  const MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], DY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return `${DY[d.getDay()]}, ${d.getDate()} ${MO[d.getMonth()]} ${d.getFullYear()}`; }
function catFullLabel(c){ return catLabel(c.category)+(levelLabel(c.level)?" · "+levelLabel(c.level):""); }
// Big centre label = the category currently featured. Mirrors the right panel's
// rotation so the centre name matches the standings/bracket being shown; when
// several categories share the screen it lists them all.
function updateCenterCat(){
  const el=document.getElementById("catName"); if(!el||!state.data) return;
  const cats=state.data.categories||[]; let label="";
  if(CAT_LABEL){ label=CAT_LABEL; }
  else if(cats.length<=1){ label=cats.length?catFullLabel(cats[0]):((state.data.event&&state.data.event.name)||""); }
  else {
    const bcats=cats.filter(c=>(c.playoff||[]).length);
    const scats=cats.filter(c=>c.groups&&c.groups.some(g=>g.standings.length));
    if(bcats.length>1){ label=catFullLabel(bcats[CAT_ROT % bcats.length]); }
    else if(STAND_PAGES>1 && scats.length){ label=catFullLabel(scats[CAT_ROT % scats.length]); }
    else { label=cats.map(catFullLabel).join("  ·  "); }
  }
  el.textContent=label||"—";
}

function photoOf(name){ const p=state.data.players && state.data.players[normName(name)]; return (p&&p.photo)?p.photo:""; }
function genderIcon(name){ const p=state.data&&state.data.players&&state.data.players[normName(name)]; const g=(p&&p.gender?String(p.gender):"M").toUpperCase(); return g.charAt(0)==="F"?"woman":"man"; }
function avatar(name,size){ const ph=photoOf(name);
  return `<span class="av" style="--s:${size}">${ph?`<img src="${esc(ph)}" alt="" onerror="this.closest('.av').innerHTML='<span class=&quot;material-symbols-outlined&quot;>'+'person'+'</span>'"/>`:`<span class="material-symbols-outlined">${genderIcon(name)}</span>`}</span>`; }
function pairPlayers(c, eid){ const e=c.entrants && c.entrants[eid]; if(!e) return [eid||"TBD",""]; return [e.player1||"", e.player2||""]; }

function teamNameOf(c, eid){ const e=c.entrants && c.entrants[eid]; return e && e.teamName ? String(e.teamName).trim() : ""; }
function teamBlock(c, eid, sz){
  const tn=teamNameOf(c,eid);
  // TV shows the team name ONLY (no player names). Falls back to players when a
  // pair has no custom team name so the board never renders blank.
  if(tn) return `<div class="tmblk tn-only"><div class="tmname">${esc(tn)}</div></div>`;
  const [p1,p2]=pairPlayers(c,eid);
  const chip=(n)=>`<div class="pl">${avatar(n,sz)}<span class="plnm">${esc(shortName(n))||"TBD"}</span></div>`;
  return `<div class="tmblk"><div class="tmpair">${chip(p1)}${p2?chip(p2):""}</div></div>`;
}
// One readable line per court: COURT | teamA VS teamB | meta | live-dot.
// Uses the team name when set, else first names of the pair (compact).
function nowTeamInline(c, eid){
  const tn = teamNameOf(c, eid);
  if(tn) return esc(tn);
  const [p1,p2] = pairPlayers(c, eid);
  return (esc(shortName(p1)) + (p2 ? ` <span class="amp">&amp;</span> ${esc(shortName(p2))}` : "")) || "TBD";
}
function nowCard(f){
  return `<div class="np-card">
    <span class="np-court">COURT ${esc(f.court)}</span>
    <div class="np-teams">
      <b class="npt">${nowTeamInline(f.c,f.eA)}</b>
      <span class="np-x">VS</span>
      <b class="npt">${nowTeamInline(f.c,f.eB)}</b>
    </div>
    <span class="np-meta">${esc(f.label)}</span>
    <span class="np-dot" aria-label="live"></span></div>`;
}
function upRow(f){
  const [a1,a2]=pairPlayers(f.c,f.eA), [b1,b2]=pairPlayers(f.c,f.eB);
  const nm=(x,y)=> esc(shortName(x))+(y?" & "+esc(shortName(y)):"");
  const lbl=(eid,x,y)=>{ const t=teamNameOf(f.c,eid); return t?esc(t):nm(x,y); };
  return `<div class="up-row">
    <span class="up-time">${f.time?fmtTime(f.time):"—"}</span>
    <span class="up-court">Court ${esc(f.court||"?")}</span>
    <span class="up-teams"><b>${lbl(f.eA,a1,a2)}</b><span class="up-x">vs</span><b>${lbl(f.eB,b1,b2)}</b></span>
  </div>`;
}

function buildFeed(){
  const d=state.data, feed=[];
  d.categories.forEach(c=>{
    (c.schedule||[]).forEach(m=> feed.push({ key:m.matchId, c, court:m.court, sortKey:(m.slot||0), stage:"GROUP", slot:(m.slot||0),
      time:m.time, date:m.date||"", updatedAt:m.updatedAt||"", label:`Group ${m.groupLabel}`, eA:m.entrantA, eB:m.entrantB, status:m.status }));
    (c.playoff||[]).forEach(b=> (b.rounds||[]).forEach(r=> (r.matches||[]).forEach(m=>{
      if(m.status==="BYE" || !m.entrantA || !m.entrantB) return;
      feed.push({ key:m.matchId, c, court:m.court, sortKey:100000+(parseInt(m.round)||0)*100+(m.idx||0), stage:"PLAYOFF",
        time:m.time, label:`${TIER[b.tier]||b.tier}`, eA:m.entrantA, eB:m.entrantB, status:m.status });
    })));
  });
  feed.sort((a,b)=> (a.sortKey-b.sortKey) || ((a.court||0)-(b.court||0)));
  return feed;
}

// Static schedule times: each group match = event start time + slot * admin match duration.
// Match 0 = start (e.g. 11:00), match 1 = +15min (11:15), and so on. No server-time or
// actual-pace adjustment — the times are fixed and predictable for participants.
function timeToMin(t){ const s=fmtTime(t); if(!s) return null; const p=s.split(":"); return (parseInt(p[0])||0)*60+(parseInt(p[1])||0); }
function minToTime(x){ x=((Math.round(x)%1440)+1440)%1440; return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0"); }
// Build a natural-time -> wall-clock shifter for up to 4 optional breaks.
function makeBreakShift(ev){
  const raw = (Array.isArray(ev.breaks) && ev.breaks.length) ? ev.breaks
            : ((ev.breakStart||ev.breakEnd) ? [{start:ev.breakStart,end:ev.breakEnd}] : []);
  const valid = raw.map(b=>({s:timeToMin(b.start),e:timeToMin(b.end)})).filter(b=>b.s!=null&&b.e!=null&&b.e>b.s).sort((a,b)=>a.s-b.s);
  const nb=[]; let acc=0;
  for(const b of valid){ nb.push({nat:b.s-acc, dur:b.e-b.s}); acc+=b.e-b.s; }
  return (tN)=>{ let add=0; for(const x of nb) if(tN>=x.nat) add+=x.dur; return tN+add; };
}
function predictGroupTimes(feed){
  const ev=state.data.event||{};
  const mm=parseInt(ev.matchMinutes)||15;
  const startMin=timeToMin(ev.startTime);
  if(startMin==null) return {};   // no start time -> fall back to stored m.time
  const shift=makeBreakShift(ev);
  const pred={};
  feed.forEach(f=>{ if(f.stage==="GROUP") pred[f.key]=minToTime(shift(startMin+(f.slot||0)*mm)); });
  return pred;
}

function colsFor(g){ if(g<=1) return 1; if(g<=3) return g; let c=Math.round(Math.sqrt(g*1.3)); return Math.max(2, Math.min(c, g>8?4:3)); }

function standHtml(){
  const out = state.data.categories.map(c=>{
    if(!c.groups || !c.groups.some(g=>g.standings.length)) return "";
    const N=c.advancersPerGroup||0, split=String(c.format||"").toUpperCase()==="SPLIT";
    const pts = String(c.rankMode||"wins")==="points";
    const rankNote = pts
      ? "Ranked by: points (win 3 · draw 1 · loss 0) → head-to-head → point difference → points for → points against"
      : "Ranked by: most wins → head-to-head → point difference → points for → points against";
    const advText = split ? `Rank 1${N>1?`–${N}`:""} → Championship Bracket · Rank ${N+1}+ → Prospect Bracket` : (N?`Top ${N} advance`:"");
    const cap = `${advText ? advText + " · " : ""}${rankNote}`;
    const cols = colsFor(c.groups.length);
    const grps=c.groups.map(g=>{
      const denom=Math.max(1,(g.standings.length||1)-1);
      const rows=g.standings.map(s=>{
        const cls= split?(s.rank<=N?"champ":"prosp"):(N&&s.rank<=N?"top":"");
        const pa = (s.ga!=null) ? s.ga : (Number(s.gf||0)-Number(s.gd||0));
        const dr = (s.draws!=null)?s.draws:0;
        const p = (s.points!=null)?s.points:(Number(s.wins||0)*3+Number(dr));
        const [p1,p2]=pairPlayers(c,s.entrantId);
        const _tn=teamNameOf(c,s.entrantId);
        const pair = _tn
          ? `<span class="p1">${esc(_tn)}</span>`
          : `<span class="p1">${esc(shortName(p1))||esc(shortName(s.team))}</span>${p2?`<span class="p2">${esc(shortName(p2))}</span>`:""}`;
        return `<tr class="${cls}"><td class="rk">${s.rank}</td><td class="nm">${pair}</td>
          <td>${s.played}/${denom}</td><td>${s.wins}</td>${pts?`<td>${dr}</td>`:""}<td>${s.losses}</td>
          <td>${s.gd>0?"+":""}${s.gd}</td><td>${s.gf}</td><td>${pa}</td>${pts?`<td class="pts"><b>${p}</b></td>`:""}</tr>`;
      }).join("");
      return `<div class="grp"><div class="grp-h">Group ${esc(g.label)}</div>
        <table class="st"><thead><tr><th>#</th><th class="nm">Pair</th><th>Played</th><th>Win</th>${pts?"<th>D</th>":""}<th>Lose</th><th>PD</th><th>PF</th><th>PA</th>${pts?"<th>Pts</th>":""}</tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    }).join("");
    return `<div class="cat-block"><div class="cat-head">${esc(catLabel(c.category))}${cap?`<span class="cat-cap">${cap}</span>`:""}</div>
      <div class="grp-grid" style="grid-template-columns:repeat(${cols},1fr)">${grps}</div></div>`;
  }).join("");
  return out || '<div class="center">No standings yet — enter group scores first.</div>';
}

function roundLabel(round, numRounds){
  if(String(round)==="BRONZE") return "3rd Place";
  const r=parseInt(round), f=numRounds-r;
  return f===0?"Final":f===1?"Semifinal":f===2?"Quarterfinal":f===3?"Round of 16":"Round "+r;
}
function bteam(c, eid, score, win){
  if(!eid) return `<div class="bteam tbd"><span class="bnm">TBD</span></div>`;
  const [p1,p2]=pairPlayers(c,eid);
  const tn=teamNameOf(c,eid);
  // TV playoff mirrors mobile: names only (team name when set), no avatars.
  const label = tn ? esc(tn) : `${esc(shortName(p1))}${p2?" & "+esc(shortName(p2)):""}`;
  return `<div class="bteam ${win?'win':''}">
    <span class="bnm">${label}</span>
    <span class="bsc">${(score!==''&&score!=null)?esc(String(score)):''}</span></div>`;
}
function bcell(c,m){
  const done=m.status==="DONE", bye=m.status==="BYE";
  const aw=done&&String(m.winner)===String(m.entrantA);
  const bw=done&&String(m.winner)===String(m.entrantB);
  // Meta line (Court · time), same as the mobile playoff card.
  const parts=[];
  if(!bye){ if(m.date) parts.push(esc(String(m.date))); if(m.time) parts.push(esc(fmtTime(m.time))); if(m.court) parts.push("Court "+esc(String(m.court))); }
  const meta = parts.length ? `<div class="bmeta">${parts.join(" · ")}</div>` : "";
  return `<div class="bmatch ${bye?'bye':''} ${done?'done':''}">${meta}
    ${bteam(c,m.entrantA, bye?'BYE':(done?m.scoreA:''), aw)}
    ${bteam(c,m.entrantB, bye?'':(done?m.scoreB:''), bw)}</div>`;
}
// Compute podium from bracket results (final + bronze). Backend podium field had a bug,
// so we derive locally to stay correct regardless of backend version.
function derivePodium(b){
  const lr=(b.rounds||[])[(b.rounds||[]).length-1];
  const fm=lr&&lr.matches&&lr.matches[0];
  let champion="",runnerUp="",third="",champE="",ruE="",thirdE="";
  if(fm&&fm.status==="DONE"&&fm.winner){
    if(String(fm.winner)===String(fm.entrantA)){ champion=fm.teamA; runnerUp=fm.teamB; champE=fm.entrantA; ruE=fm.entrantB; }
    else { champion=fm.teamB; runnerUp=fm.teamA; champE=fm.entrantB; ruE=fm.entrantA; }
  }
  const bm=b.bronze;
  if(bm&&bm.status==="DONE"&&bm.winner){ const w=String(bm.winner)===String(bm.entrantA); third = w?bm.teamA:bm.teamB; thirdE = w?bm.entrantA:bm.entrantB; }
  return {champion,runnerUp,third,champE,ruE,thirdE};
}
function oneBracket(c, b, cell){
  cell = cell || bcell;
  const tierName = (TIER[b.tier]||b.tier);
  const proj = b.projected;
  const p = derivePodium(b);
  const tnm = (eid, fallback) => { const t = eid ? teamNameOf(c, eid) : ""; return t ? esc(t) : (esc(firstNames(fallback))||"—"); };
  // Podium row (Champion / Runner-up / 3rd) — same three cards as the mobile view.
  const pod = (!proj && (p.champion||p.runnerUp||p.third))
    ? `<div class="bpodium">
        <div class="bpod g"><div class="bpk">🏆 Champion</div><div class="bpw">${tnm(p.champE,p.champion)}</div></div>
        <div class="bpod s"><div class="bpk">Runner-up</div><div class="bpw">${tnm(p.ruE,p.runnerUp)}</div></div>
        <div class="bpod b"><div class="bpk">3rd Place</div><div class="bpw">${tnm(p.thirdE,p.third)}</div></div>
      </div>` : "";
  // Each round as its own left→right column, mirroring the mobile list but arranged
  // horizontally for the landscape screen. The 3rd-place (bronze) match is placed
  // BEFORE the Final so the board reads … → Semifinal → 3rd Place → Final.
  const colHtml = (r, cls) => `<div class="bround ${cls||''}"><div class="brh">${roundLabel(r.round,b.numRounds)}</div><div class="brcol">${(r.matches||[]).map((m)=>cell(c,m)).join("")}</div></div>`;
  const bronzeCol = b.bronze ? `<div class="bround narrow"><div class="brh">3rd Place</div><div class="brcol">${cell(c,b.bronze)}</div></div>` : "";
  const rounds = b.rounds||[];
  let cols = "";
  if(rounds.length){
    const fi = rounds.length-1;                 // final = last round
    // The first round has the most teams → give it extra width (`wide`).
    for(let i=0;i<fi;i++) cols += colHtml(rounds[i], (i===0 && fi>1) ? 'wide' : '');
    cols += bronzeCol;                          // 3rd place first…
    cols += colHtml(rounds[fi]);                // …then the final (1st place)
  } else {
    cols = bronzeCol;
  }
  // Adaptive sizing: the first round holds the most matches; the more there are,
  // the smaller the team-name font (and tighter the spacing) so all teams fit.
  const n = (rounds[0] && rounds[0].matches ? rounds[0].matches.length : (b.bronze?1:0)) || 1;
  const bfz = n>=16 ? "clamp(6px,.62vw,11px)"      // 32-team draw
            : n>=8  ? "clamp(8px,.82vw,14px)"       // 16-team draw
            : n>=4  ? "clamp(11px,1.15vw,20px)"     // 8-team draw
            : n>=2  ? "clamp(14px,1.5vw,26px)"      // 4-team draw
            :         "clamp(17px,1.9vw,34px)";     // 2-team (final only)
  const dens = n>=16 ? " xdense" : n>=8 ? " dense" : "";
  return `<div class="bracket-block${proj?' proj':''}${dens}" style="--bfz:${bfz}">
    <div class="bt">${esc(catLabel(c.category))} · ${esc(tierName)}${proj?' · Simulasi':''}</div>${pod}
    <div class="bracket">${cols}</div></div>`;
}
function bracketHtml(){
  const cats = (state.data.categories||[]).filter(c => (c.playoff||[]).length);
  if(!cats.length) return '<div class="center">Playoff bracket not available yet.</div>';
  return rotateCats(cats).map(c => (c.playoff||[]).map(b => oneBracket(c,b)).join("")).join("");
}

function tvQpChips(slots, c){

    const showG = s.group && (s.confirmed || s.kind==="direct");

      +(s.confirmed?`<span class="qn">${nm(s)}</span>`:`<span class="qn tbc">TBC</span>`)+g+`</div>`;
  }).join("");

function tvOrd(n){ const a=["th","st","nd","rd"], v=n%100; return n+(a[(v-20)%10]||a[v]||a[0]); }
// Rules box for the seed system (top-N overall with best-3rd wildcards).
function tvRulesBox(c){
  const N=c.topOverall||0; if(N<2) return ""; const adv=c.advancersPerGroup||2, ng=(c.groups||[]).length; if(!ng) return "";
  const direct=Math.min(N, adv*ng), wild=Math.max(0, N-direct); if(wild<=0) return "";

    +`<div class="qruleb">Top ${adv} of each group advance directly (<b>${direct}</b>). The last <b>${wild}</b> spot${wild>1?'s':''} go to the best ${wild} <b>${tvOrd(adv+1)}-placed</b> team${wild>1?'s':''} across all groups, by record.</div></div>`;

function tvQualifyPanelHtml(c){

// Full-screen qualification view (rules box + 2-section panel) for the group stage.

// Find a finished bracket (champion decided) to showcase; prefer non-Prospect tiers.
function finishedPodium(){
  let fb=null;
  for(const c of (state.data.categories||[])){
    for(const b of (c.playoff||[])){
      const pod=derivePodium(b);
      if(pod.champion){
        const entry={c,b,pod};
        if(b.tier!=="PROSPECT") return entry;
        if(!fb) fb=entry;
      }
    }
  }
  return fb;
}
function splitPair(s){ const p=String(s||"").split(" + ").map(x=>x.trim()).filter(Boolean); return p.length?p:[String(s||"")]; }
function winnerRow(cls, label, teamStr, sz, c, eid){
  if(!teamStr) return "";

}
// Total wins/losses for an entrant across the group stage + playoff (incl. 3rd-place match).
function tallyWL(c, eid){
  let w=0,l=0; const E=String(eid);
  (c.groups||[]).forEach(g=>(g.standings||[]).forEach(s=>{ if(String(s.entrantId)===E){ w+=Number(s.wins||0); l+=Number(s.losses||0); } }));
  const countM=(m)=>{ if(!m||m.status!=="DONE"||!m.winner) return; if(String(m.entrantA)===E||String(m.entrantB)===E){ if(String(m.winner)===E) w++; else l++; } };
  (c.playoff||[]).forEach(b=>{ (b.rounds||[]).forEach(r=>(r.matches||[]).forEach(countM)); countM(b.bronze); });
  return {w,l};
}
// A category's finished bracket (champion decided), preferring non-Prospect tiers.
function catFinishedPodium(c){
  let fb=null;
  for(const b of (c.playoff||[])){ const pod=derivePodium(b); if(pod.champion){ const e={c,b,pod}; if(b.tier!=="PROSPECT") return e; if(!fb) fb=e; } }
  return fb;
}

function capFor(c){
  const N=c.advancersPerGroup||0, split=String(c.format||"").toUpperCase()==="SPLIT";
  const rankNote = String(c.rankMode||"wins")==="points"
    ? "Ranked by: points (win 3 · draw 1 · loss 0) → head-to-head → point difference → points for → points against"
    : "Ranked by: most wins → head-to-head → point difference → points for → points against";
  const advText = split ? `Rank 1${N>1?`–${N}`:""} → Championship Bracket · Rank ${N+1}+ → Prospect Bracket` : (N?`Top ${N} advance`:"");
  return `${advText?advText+" · ":""}${rankNote}`;
}
function cardHtml(c, g){
  const N=c.advancersPerGroup||0, split=String(c.format||"").toUpperCase()==="SPLIT";
  const pts = String(c.rankMode||"wins")==="points";
  const denom=Math.max(1,(g.standings.length||1)-1);
  const rows=g.standings.map(s=>{
    const cls= split?(s.rank<=N?"champ":"prosp"):(N&&s.rank<=N?"top":"");
    const pa = (s.ga!=null) ? s.ga : (Number(s.gf||0)-Number(s.gd||0));
    const dr = (s.draws!=null)?s.draws:0;
    const p = (s.points!=null)?s.points:(Number(s.wins||0)*3+Number(dr));
    const [p1,p2]=pairPlayers(c,s.entrantId);
    const _tn=teamNameOf(c,s.entrantId);
    const pair = _tn
      ? `<span class="p1">${esc(_tn)}</span>`
      : `<span class="p1">${esc(shortName(p1))||esc(shortName(s.team))}</span>${p2?`<span class="p2">${esc(shortName(p2))}</span>`:""}`;
    return `<tr class="${cls}"><td class="rk">${s.rank}</td><td class="nm">${pair}</td>
      <td>${s.played}/${denom}</td><td>${s.wins}</td>${pts?`<td>${dr}</td>`:""}<td>${s.losses}</td>
      <td>${s.gd>0?"+":""}${s.gd}</td><td>${s.gf}</td><td>${pa}</td>${pts?`<td class="pts"><b>${p}</b></td>`:""}</tr>`;
  }).join("");
  return `<div class="grp"><div class="grp-h">Group ${esc(g.label)} · ${g.standings.length} teams</div>
    <table class="st"><thead><tr><th>#</th><th class="nm">Pair</th><th>Pld</th><th>W</th>${pts?"<th>D</th>":""}<th>L</th><th>PD</th><th>PF</th><th>PA</th>${pts?"<th>Pts</th>":""}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
// Shrink standings font (--sfz) until ALL groups fit the column on one screen — both
// height (no scroll) AND width (no stat-column cutoff).
function fitStandings(){
  const wrap=document.getElementById("standWrap");
  const fit=wrap && wrap.querySelector(".fit");
  if(!fit) return;
  const avail=wrap.clientHeight;
  if(!avail) return;
  const fits=()=>{
    if(fit.scrollHeight>avail+1) return false;
    const grps=fit.querySelectorAll(".grp");
    for(const g of grps){ if(g.scrollWidth>g.clientWidth+1) return false; }
    return true;
  };
  let lo=8, hi=26, best=8;
  for(let i=0;i<16;i++){
    const mid=(lo+hi)/2;
    fit.style.setProperty("--sfz", mid+"px");
    if(fits()){ best=mid; lo=mid; } else { hi=mid; }
  }
  fit.style.setProperty("--sfz", best+"px");
  let g=best;
  while(!fits() && g>8){ g-=0.5; fit.style.setProperty("--sfz", g+"px"); }
  return g;   // the font size it settled on (px) — used to decide if paging is needed
}
function renderRight(){
  const hasPlayoff=(state.data.categories||[]).some(c=>(c.playoff||[]).length);
  const titleEl=document.getElementById("rightTitle");
  const wrap=document.getElementById("standWrap");
  const catSuffix=(list)=> list.length>1 ? " · "+catLabel(list[CAT_ROT % list.length].category) : "";
  const legendEl=document.getElementById("tvLegend");
  if(hasPlayoff){
    const bcats=(state.data.categories||[]).filter(c=>(c.playoff||[]).length);

    if(legendEl) legendEl.hidden=true;

  }

  const cats=(state.data.categories||[]).filter(c=>c.groups && c.groups.some(g=>g.standings.length));

  // Build the standings HTML for a set of categories and shrink-to-fit; returns the font px it settled on.
  const renderCats=(list)=>{
    const blocks=list.map(c=>{
      const cap=capFor(c);
      const groups=c.groups.filter(g=>g.standings.length);

      return `<div class="cat-block">${cap?`<div class="cat-cap" style="margin-bottom:calc(var(--sfz)*.55)">${cap}</div>`:""}
        <div class="grp-grid" style="grid-template-columns:repeat(${cols},1fr)">${cards}</div></div>`;

  }
  // Full rotation = standings page(s) + one qualification screen per wildcard category.

  STAND_PAGES = pages.length; ROT_N = pages.length;
  ROT_LABELS = pages.map(p=> p.qual ? (catLabel(p.qual.category)+" · Qualification") : (p.stand.length===1 ? catFullLabel(p.stand[0]) : "Group Standings"));
  const cur = pages[CAT_ROT % pages.length];
  if(cur.qual){
    titleEl.textContent = "Qualification · "+catLabel(cur.qual.category);
    if(legendEl) legendEl.hidden = true;
    wrap.innerHTML = tvQualView(cur.qual);
  } else {
    titleEl.textContent = "Group Standings" + (cur.stand.length===1 ? " · "+catLabel(cur.stand[0].category) : "");
    if(legendEl) legendEl.hidden = false;

// Countdown to the next category switch, shown under the panel title.
function updateRotCountdown(){
  const el=document.getElementById("catNext");
  if(!el) return;
  if(ROT_N<=1 || !ROT_LABELS || ROT_LABELS.length<=1){ el.textContent=""; return; }
  const rem=Math.max(0, Math.round((nextRotAt-Date.now())/1000));
  const nxt=ROT_LABELS[(CAT_ROT+1)%ROT_LABELS.length]||"";
  el.innerHTML="Next: "+esc(nxt)+" · in <b>"+Math.floor(rem/60)+":"+String(rem%60).padStart(2,"0")+"</b>";

function render(){
  if(!state.data) return;
  const feed=buildFeed();
  // Fill missing group-match times from the predicted schedule, but TRUST the
  // stored time when it is set — that's the source of truth the admin/sheet show
  // (per-category batch times and manual edits). Recomputing from a single event
  // start + slot would otherwise override a corrected time (e.g. show 14:00 when
  // the schedule was changed to 08:00). Regenerate the schedule to re-time in bulk.
  const pred=predictGroupTimes(feed);
  feed.forEach(f=>{ if(f.stage==="GROUP" && !f.date && !f.time && pred[f.key]) f.time=pred[f.key]; });
  // Chronological order: earliest date first, then the (resolved) time, then court.
  const evDate=(state.data.event&&state.data.event.date)||"";
  const fDateKey=f=>String(f.date||evDate);
  const fTimeMin=f=>{ const s=fmtTime(f.time); if(!s) return (f.sortKey||0); const p=s.split(":"); return (parseInt(p[0])||0)*60+(parseInt(p[1])||0); };
  const fCmp=(a,b)=> fDateKey(a).localeCompare(fDateKey(b)) || (fTimeMin(a)-fTimeMin(b)) || (a.sortKey-b.sortKey) || ((a.court||0)-(b.court||0));
  feed.sort(fCmp);
  const perCourt={};
  feed.forEach(f=>{ if(f.status!=="DONE" && f.court){ (perCourt[f.court]=perCourt[f.court]||[]).push(f); } });
  const courts=Object.keys(perCourt).sort((a,b)=>a-b);
  const playing=courts.map(ct=>perCourt[ct][0]).filter(Boolean);
  // Upcoming: flat queue ordered chronologically. Cap must exceed one slot's worth of
  // matches (≈ number of courts) so the NEXT time slot shows too, not just the immediate one.
  const UP_MAX=8;
  const playingKeys=new Set(playing.map(f=>f.key));
  const upcoming=feed.filter(f=> f.status!=="DONE" && f.court && !playingKeys.has(f.key))
    .sort(fCmp)
    .slice(0,UP_MAX);

  const ac=playing.length||1;
  let sz,nmf;
  // nmf = Now Playing player-name font, sized down 50% per request.
  if(ac>=4){ sz="clamp(20px,1.7vw,38px)"; nmf="clamp(6.5px,0.55vw,11px)"; }
  else if(ac===3){ sz="clamp(26px,2.1vw,46px)"; nmf="clamp(7px,0.65vw,13px)"; }
  else if(ac===2){ sz="clamp(32px,2.7vw,60px)"; nmf="clamp(8px,0.8vw,16px)"; }
  else { sz="clamp(42px,3.5vw,80px)"; nmf="clamp(10px,1vw,20px)"; }

  const hasPlayoff = (state.data.categories||[]).some(c => (c.playoff||[]).length);

  const leftCol  = document.getElementById("leftCol");
  const leftTitle= document.getElementById("leftTitle");
  const upTitle  = document.getElementById("upTitle");
  const nextWrap = document.getElementById("nextWrap");
  const nowWrap  = document.getElementById("nowWrap");

  if(hasPlayoff){
    // PLAYOFF (in progress or finished) — bracket only, hide the whole left column.
    // The champions are shown by the podium on top of the bracket itself.
    leftCol.style.display = "none";
  } else {
    // GROUP STAGE — now playing + upcoming.
    leftCol.style.display = "";
    leftTitle.textContent = "Now Playing"; leftTitle.classList.add("live");
    upTitle.style.display = "";
    nextWrap.style.display = "";
    nowWrap.innerHTML = playing.length ? playing.map(f=>nowCard(f)).join("") : '<div class="np-empty">No match in progress.</div>';
    nextWrap.innerHTML = upcoming.length ? upcoming.map(upRow).join("") : '<div class="up-empty">No upcoming match.</div>';
  }

  renderRight();
}

// Apply a per-event color theme (from event.theme) onto the root CSS tokens.
// Only hex values are honored; missing keys keep the default. panel2 & the gradient
// are derived so boxes and the header wordmark stay consistent.
let _themed=false;
function applyTvTheme(t){
  const root=document.documentElement;
  const map={bg:'--bg',panel:'--panel',line:'--line',text:'--text',muted:'--muted',accent:'--accent',accent2:'--accent2'};
  if(!t || typeof t!=='object'){
    if(_themed){ Object.values(map).forEach(v=>root.style.removeProperty(v)); root.style.removeProperty('--panel2'); root.style.removeProperty('--grad'); _themed=false; }
    return;
  }
  const hex=v=>typeof v==='string'&&/^#[0-9a-fA-F]{3,8}$/.test(v);
  for(const k in map){ if(hex(t[k])) root.style.setProperty(map[k], t[k]); }
  if(hex(t.panel)) root.style.setProperty('--panel2', t.panel);
  if(hex(t.accent)||hex(t.accent2)){
    const a=hex(t.accent)?t.accent:(getComputedStyle(root).getPropertyValue('--accent').trim()||'#FF5722');
    const b=hex(t.accent2)?t.accent2:(getComputedStyle(root).getPropertyValue('--accent2').trim()||'#FFB000');
    root.style.setProperty('--grad','linear-gradient(90deg,'+a+','+b+')');
  }
  _themed=true;
}
async function load(){
  try{
    const d=await api("/tournament/event/"+encodeURIComponent(EVENT_ID)+"/public?live=1");
    state.data=d;
    CAT_LABEL="";
    // Dedicated single-category screen (?cat=…): keep only the matching category so
    // spectators of one batch never see the other batch's standings/bracket.
    if((CAT_FILTER.length||LEVEL_FILTER.length) && Array.isArray(d.categories)){
      const only=d.categories.filter(catAllowed);
      if(only.length){ d.categories=only; CAT_LABEL=only.map(c=>catLabel(c.category)+(levelLabel(c.level)?" · "+levelLabel(c.level):"")).join("  ·  "); }
    }
    applyTvTheme(d.event && d.event.theme);
    preloadSponsors(d.sponsors);
    document.getElementById("evnm").textContent=d.event.name||"Tournament";
    document.getElementById("evTitle").textContent=d.event.venue||"";
    document.getElementById("evDate").textContent=fmtEventDate(d.event.date);
    render();
    updateCenterCat();
    setupQR(); // refresh QR now that the event name (and slug) is known
  }catch(e){ document.getElementById("standWrap").innerHTML='<div class="center">Failed to load data.</div>'; }
}

function mobileURL(){
  // Friendly player URL: /mobile/<slug>. Use the slug from the current /tv/<slug>
  // path if present, else derive it from the loaded event name.
  const slug = PATH_SLUG || (state.data && state.data.event && slugify(state.data.event.name)) || "";
  if(slug) return location.origin + "/mobile/" + encodeURIComponent(slug);
  return location.origin + "/mobile.html?event=" + encodeURIComponent(EVENT_ID);
}
function setupQR(){
  if(!EVENT_ID) return;
  const url = mobileURL();
  const img = document.getElementById("qrImg");
  img.onerror = ()=>{ document.getElementById("qrBox").style.display="none"; };
  img.src = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&qzone=1&data=" + encodeURIComponent(url);
  document.getElementById("qrBox").style.display = "flex";
}

// ---- Sponsor reel: every 10 min, play each logo for 3s, then back to the board ----
const SPONSOR_EVERY_MS = 5 * 60 * 1000;   // play the reel every 5 minutes
const SPONSOR_SHOW_MS  = 15000;           // each logo on screen for 15 seconds
let _spPlaying = false;
const URL_SPONSOR = (new URLSearchParams(location.search).get("sponsor")||"").trim();
function sponsorList(){ const base=(state.data && Array.isArray(state.data.sponsors)) ? state.data.sponsors : []; return URL_SPONSOR ? [URL_SPONSOR].concat(base.filter(u=>u!==URL_SPONSOR)) : base; }
function preloadSponsors(list){ (list||[]).forEach(u=>{ const im=new Image(); im.src=u; }); }
async function playSponsors(){
  if(_spPlaying) return;
  const list = sponsorList();
  if(!list.length) return;
  _spPlaying = true;
  const ov=document.getElementById("sponsorOverlay"), img=document.getElementById("spImg");
  ov.classList.add("show");
  for(let i=0;i<list.length;i++){
    img.src = list[i];
    await new Promise(r=>setTimeout(r, SPONSOR_SHOW_MS));
  }
  ov.classList.remove("show");
  _spPlaying = false;
}
let nextSponsorAt = Date.now() + SPONSOR_EVERY_MS;
function updateSpCountdown(){
  const el=document.getElementById("spCountdown"); if(!el) return;
  const ov=document.getElementById("sponsorOverlay");
  if(!sponsorList().length || (ov && ov.classList.contains("show"))){ el.style.display="none"; return; }
  el.style.display="";
  const rem=Math.max(0, Math.round((nextSponsorAt-Date.now())/1000));
  el.textContent = "Sponsor in "+Math.floor(rem/60)+":"+String(rem%60).padStart(2,"0");
}
function startSponsorCycle(){
  nextSponsorAt = Date.now() + SPONSOR_EVERY_MS;
  setInterval(async ()=>{ if(Date.now()>=nextSponsorAt){ await playSponsors(); nextSponsorAt = Date.now() + SPONSOR_EVERY_MS; } }, 1000);
  setInterval(updateSpCountdown, 1000); updateSpCountdown();
}

// Resolve a friendly /tv/<slug> path to an event id via the event list.
async function resolveEventId(){
  if(EVENT_ID) return EVENT_ID;
  if(!PATH_SLUG) return null;
  try{
    const { events } = await api("/tournament/events");
    // Match the FROZEN slug first (an event can be renamed without moving its URL),
    // then fall back to the name-derived slug for older links.
    const matches = (events||[]).filter(e=>(e.slug||slugify(e.name))===PATH_SLUG);
    if(matches.length) return matches[matches.length-1].eventId; // newest on name collision
  }catch(e){}
  return null;
}
// ---- Remote-navigable event picker (for the short /tv or /led URL, no slug typing) ----
let PICK=[], PICK_I=0, PICK_CD=null;
function pickSlug(e){ return e.slug || slugify(e.name); }
function pickGo(){ const e=PICK[PICK_I]; if(!e) return; try{ localStorage.setItem("tp_tv_last_slug", pickSlug(e)); }catch(_){} location.href = "/tv/" + encodeURIComponent(pickSlug(e)); }
function pickStop(){ if(PICK_CD){ clearInterval(PICK_CD); PICK_CD=null; renderPicker(); } }
function renderPicker(cd){
  const ov=document.getElementById("tvPicker"); if(!ov) return;
  ov.innerHTML = `<div class="tvpick-brand">TurnamenPadel</div>
    <div class="tvpick-h">Pilih event — <b>▲ ▼</b> lalu <b>OK</b>, atau tekan angka</div>
    <div class="tvpick-list">${PICK.map((e,i)=>`<div class="tvpick-row ${i===PICK_I?'on':''}">
      <span class="tvpick-n">${i+1}</span>
      <span class="tvpick-nm">${esc(e.name||"")}</span>
      <span class="tvpick-mt">${esc([e.venue,e.date].filter(Boolean).join(" · "))}</span></div>`).join("")}</div>
    ${cd!=null?`<div class="tvpick-cd">Membuka <b>${esc(PICK[PICK_I]&&PICK[PICK_I].name||"")}</b> dalam <b>${cd}</b> dtk — tekan tombol apa saja untuk memilih lain.</div>`:""}`;
}
function pickerKey(ev){
  if(!PICK.length) return;
  const k=ev.key;
  if(k==="ArrowDown"||k==="ArrowRight"){ pickStop(); PICK_I=(PICK_I+1)%PICK.length; renderPicker(); ev.preventDefault(); }
  else if(k==="ArrowUp"||k==="ArrowLeft"){ pickStop(); PICK_I=(PICK_I-1+PICK.length)%PICK.length; renderPicker(); ev.preventDefault(); }
  else if(k==="Enter"||k===" "){ pickStop(); pickGo(); ev.preventDefault(); }
  else if(/^[1-9]$/.test(k)){ const i=parseInt(k,10)-1; if(i<PICK.length){ pickStop(); PICK_I=i; pickGo(); } }
  else { pickStop(); }
}
async function showPicker(){
  let ov=document.getElementById("tvPicker");
  if(!ov){ ov=document.createElement("div"); ov.id="tvPicker"; ov.className="tvpick-ov"; document.body.appendChild(ov); }
  ov.innerHTML='<div class="tvpick-brand">TurnamenPadel</div><div class="tvpick-h">Memuat event…</div>';
  let events=[];
  try{ ({events}=await api("/tournament/events")); }catch(e){}
  PICK=(events||[]).slice().sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")));
  if(!PICK.length){ ov.innerHTML='<div class="tvpick-brand">TurnamenPadel</div><div class="tvpick-h">Belum ada event. Buat dulu di /engine.</div>'; return; }
  let last=""; try{ last=localStorage.getItem("tp_tv_last_slug")||""; }catch(e){}
  const li=PICK.findIndex(e=>pickSlug(e)===last);
  PICK_I = li>=0 ? li : 0;
  document.addEventListener("keydown", pickerKey);
  // Auto-resume the last-shown event after a short countdown (any key cancels).
  if(li>=0){ let n=6; renderPicker(n); PICK_CD=setInterval(()=>{ n--; if(n<=0){ pickStop(); pickGo(); } else renderPicker(n); },1000); }
  else renderPicker();
}

(async function boot(){
  EVENT_ID = await resolveEventId();
  if(EVENT_ID){
    try{ if(PATH_SLUG) localStorage.setItem("tp_tv_last_slug", PATH_SLUG); }catch(e){}
    setupQR(); load(); setInterval(load,20000); startSponsorCycle();
    // Group stage shows Group Standings only; the simulated playoff bracket is no
    // longer rotated in. The real bracket appears once the playoff actually starts.
    // Rotate the right panel (bracket / simulation / standings) between
    // categories every 60s when the event has 2+ categories, so each gets
    // full-screen airtime. A countdown under the title shows the time left.
    nextRotAt = Date.now() + ROT_MS;
    setInterval(()=>{
      if(!state.data) return;
      const cats=state.data.categories||[];
      const nBracket=cats.filter(c=>(c.playoff||[]).length).length;
      const nProj=cats.filter(c=>(c.playoffProjection||[]).some(b=>(b.rounds||[]).some(r=>(r.matches||[]).length))).length;
      // Rotate between categories when: a bracket/projection view spans several
      // categories, OR group standings were split into per-category pages because
      // they didn't all fit legibly on one screen (STAND_PAGES>1).
      if(Math.max(nBracket,nProj)>1 || STAND_PAGES>1){ CAT_ROT++; nextRotAt=Date.now()+ROT_MS; renderRight(); }
    }, 60000);
    setInterval(updateRotCountdown, 1000);
    let rzt; window.addEventListener("resize", ()=>{ clearTimeout(rzt); rzt=setTimeout(()=>{ if(state.data) renderRight(); }, 200); });
  } else {
    // No event resolved (bare /tv, /led, or a mistyped slug) → remote-friendly picker.
    showPicker();
  }
})();
</script>
