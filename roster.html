<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roster Peserta · TurnamenPadel</title>
<style>
  :root{--bg:#0A0A0B;--panel:#141416;--panel2:#1B1B1F;--line:#2A2A2E;--text:#F5F5F7;--muted:#A1A1AA;--faint:#6B6B72;
    --accent:#FF6A00;--accent2:#FFB000;--ok:#3ad19b;--warn:#ffd166;--danger:#ff6f60;--r:16px;--r-sm:11px;
    --display:'Saira Condensed','Arial Narrow',sans-serif;--body:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'Space Mono',ui-monospace,monospace;
    --grad:linear-gradient(120deg,var(--accent),var(--accent2));color-scheme:dark;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;
    background-image:radial-gradient(900px 460px at 88% -12%,rgba(255,106,0,.16),transparent 62%);background-attachment:fixed;}
  .wrap{max-width:520px;margin:0 auto;padding:16px;padding-block:16px 52px}
  h1,h2,h3{font-family:var(--display);font-weight:700;margin:0} .muted{color:var(--muted)} .faint{color:var(--faint)} .mono{font-family:var(--mono)}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 10px 30px -18px rgba(0,0,0,.9)}
  .card+.card{margin-top:12px}
  .hero{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(150deg,#1c1207,#141416 60%);padding:20px;margin-bottom:14px}
  .hero h1{font-size:24px;margin:6px 0} .hero .eyebrow{color:var(--accent2)}
  .row{display:flex;gap:10px;flex-wrap:wrap} .note{font-size:12px;color:var(--faint);margin-top:6px}
  label.f{display:block;margin-bottom:12px} label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px} .req{color:var(--accent)}
  input,select,textarea{width:100%;background:#0e0e10;border:1px solid var(--line);color:var(--text);border-radius:var(--r-sm);padding:11px 12px;font-family:var(--body);font-size:14px}
  textarea{min-height:80px;resize:vertical}
  .btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-family:var(--body);font-weight:700;font-size:14px;padding:11px 15px;border-radius:var(--r-sm);cursor:pointer}
  .btn.primary{background:var(--grad);border-color:transparent;color:#0A0A0B}.btn.ghost{background:transparent}.btn.sm{padding:7px 11px;font-size:12.5px}.btn:disabled{opacity:.4;cursor:not-allowed}
  .nav{display:flex;gap:10px;margin-top:16px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
  .chip.ok{color:var(--ok);border-color:rgba(58,209,155,.35);background:rgba(58,209,155,.08)}
  .chip.warn{color:var(--warn);border-color:rgba(255,209,102,.35);background:rgba(255,209,102,.08)}
  .chip.block{color:var(--danger);border-color:rgba(255,111,96,.4);background:rgba(255,111,96,.09)}
  .phead{display:flex;align-items:center;gap:11px}
  .avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;color:#0A0A0B;background:var(--grad);overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .who{font-family:var(--display);font-size:15px;line-height:1.1}.sub{font-size:11.5px;color:var(--muted)}
  .logo{font-family:var(--display);font-weight:800;font-size:22px}.logo .dot{color:var(--accent)}
  .empty{color:var(--faint);text-align:center;padding:40px 0}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:18px;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-width:400px;width:100%;max-height:88vh;overflow:auto}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo" style="margin-bottom:12px">turnamen<span class="dot">.</span>padel</div>
  <div id="host"><p class="empty">Memuat…</p></div>
</div>
<div id="modalHost"></div>
<script>
const API="/api";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function qp(){ const m=location.pathname.match(/\/roster\/([^\/?#]+)/); const sp=new URLSearchParams(location.search);
  return { eventId:(m?decodeURIComponent(m[1]):sp.get("e")||""), t:sp.get("t")||"", c:sp.get("c")||"" }; }
const R={ ...qp(), data:null, cat:"" };
async function api(path,opts){ const res=await fetch(API+"/"+path,{method:(opts&&opts.method)||"GET",headers:{"Content-Type":"application/json"},body:opts&&opts.body?JSON.stringify(opts.body):undefined});
  let d={};try{d=await res.json();}catch(e){} if(!res.ok){const err=new Error(d.error||("HTTP "+res.status));err.status=res.status;throw err;} return d; }
function fileToDataUrl(input){return new Promise(r=>{const f=input.files&&input.files[0];if(!f)return r("");const rd=new FileReader();rd.onload=()=>r(rd.result);rd.onerror=()=>r("");rd.readAsDataURL(f);});}

async function boot(){
  if(!R.eventId||!R.t){ document.getElementById("host").innerHTML='<div class="card"><p class="empty">Link roster tidak valid.</p></div>'; return; }
  try{ R.data=await api("reg/roster/"+encodeURIComponent(R.eventId)+"?t="+encodeURIComponent(R.t)); }
  catch(e){ document.getElementById("host").innerHTML='<div class="card"><p class="empty">'+esc(e.message)+'</p></div>'; return; }
  R.cat = R.c && (R.data.categories||[]).some(c=>c.tournamentId===R.c) ? R.c : ((R.data.categories[0]||{}).tournamentId||"");
  render();
}
function avatar(p){ return '<div class="avatar">'+(p.photoUrl?'<img src="'+esc(p.photoUrl)+'" alt="" onerror="this.remove()">':esc((p.name||'?').charAt(0).toUpperCase()))+'</div>'; }
function miniP(p){ return '<div class="phead" style="margin:0">'+avatar(p)+'<div><div class="who">'+esc(p.name)+(p.alias?' <span class="faint" style="font-weight:400">· '+esc(p.alias)+'</span>':'')+'</div><div class="sub">📍 '+esc(p.region||'-')+(p.ig?' · @'+esc(p.ig):'')+'</div></div></div>'; }
function render(){
  const d=R.data, cat=(d.categories||[]).find(c=>c.tournamentId===R.cat)||{pairs:[]};
  const open=d.appealOpen;
  document.getElementById("host").innerHTML=`
    <div class="hero"><div class="eyebrow">Kurasi peserta · roster</div><h1>${esc(d.name||"")}</h1>
      <p class="muted" style="margin:8px 0 0;font-size:13px">Periksa peserta lain di kelasmu. Jika ada yang kamu rasa tidak sesuai level, ajukan <b>appeal</b> beserta bukti.</p></div>
    <div class="card ${open?'':''}" style="border-color:${open?'rgba(255,209,102,.4)':'rgba(255,111,96,.4)'}">
      ${open?`<b class="mono" style="color:var(--warn)">⏳ Appeal dibuka${d.appealDeadline?' s/d '+esc(d.appealDeadline):''}</b>`
             :`<b class="mono" style="color:var(--danger)">🔒 Batas appeal berakhir — roster final</b>`}</div>
    <label class="f" style="margin-top:12px"><span>Kategori</span><select onchange="R.cat=this.value;render()">
      ${(d.categories||[]).map(c=>`<option value="${esc(c.tournamentId)}" ${R.cat===c.tournamentId?'selected':''}>${esc(c.label)} · ${esc(c.level)} (${(c.pairs||[]).length})</option>`).join("")}</select></label>
    <div>${(cat.pairs||[]).length? cat.pairs.map(pr=>`<div class="card">
        <div style="display:flex;flex-direction:column;gap:10px">${miniP(pr.p1)}${miniP(pr.p2)}</div>
        <div class="nav"><button class="btn ghost sm" style="margin-left:auto" ${open?'':'disabled'} onclick="openAppeal('${esc(pr.regId)}','${esc((pr.p1.name||'')+' + '+(pr.p2.name||''))}')">⚑ Appeal pasangan ini</button></div>
      </div>`).join("") : '<p class="empty">Belum ada peserta di kategori ini.</p>'}</div>`;
}
function closeModal(){ document.getElementById("modalHost").innerHTML=""; }
function openAppeal(regId,label){
  document.getElementById("modalHost").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal"><div class="eyebrow">Ajukan appeal</div><h2 style="font-size:19px;margin:2px 0 10px">${esc(label)}</h2>
      <div id="apBody">
        <label class="f"><span>Nama kamu <span class="req">*</span></span><input id="apName" placeholder="nama lengkap"></label>
        <label class="f"><span>Email <span class="req">*</span></span><input id="apEmail" placeholder="email@mail.com"></label>
        <label class="f"><span>Alasan appeal <span class="req">*</span></span><textarea id="apReason" placeholder="jelaskan kenapa tidak sesuai level…"></textarea></label>
        <label class="f"><span>Bukti (foto) <span class="req">*</span></span><input id="apProof" type="file" accept="image/*" onchange="apPick(this)"></label>
        <span class="chip ok" id="apOk" hidden>bukti terpilih ✔</span>
        <div class="nav"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="submitAppeal('${esc(regId)}','${esc(label)}')">Kirim appeal</button></div>
        <p class="note">No. HP kamu diambil otomatis dari data registrasi (via email).</p>
      </div></div></div>`;
}
let AP_PROOF="";
async function apPick(input){ AP_PROOF=await fileToDataUrl(input); const ok=document.getElementById("apOk"); if(ok) ok.hidden=!AP_PROOF; }
async function submitAppeal(regId,label){
  const name=(document.getElementById("apName").value||"").trim();
  const email=(document.getElementById("apEmail").value||"").trim();
  const reason=(document.getElementById("apReason").value||"").trim();
  if(!name||!email||!reason||!AP_PROOF){ alert("Nama, email, alasan, dan bukti (foto) wajib."); return; }
  const cb=document.getElementById("apBody"); cb.innerHTML='<p class="muted">Mengirim…</p>';
  try{
    await api("reg/appeal",{method:"POST",body:{eventId:R.eventId,category:R.cat,againstRegId:regId,againstLabel:label,appellantName:name,appellantEmail:email,reason,proof:AP_PROOF}});
    cb.innerHTML='<div class="chip ok">✔ Appeal terkirim</div><p class="note">Admin akan meninjau. Terima kasih.</p><button class="btn primary" style="width:100%;margin-top:8px" onclick="closeModal()">Selesai</button>';
    AP_PROOF="";
  }catch(e){ cb.innerHTML='<div class="chip block">Gagal: '+esc(e.message)+'</div><button class="btn" style="width:100%;margin-top:8px" onclick="closeModal()">Tutup</button>'; }
}
boot();
</script>
</body>
</html>
