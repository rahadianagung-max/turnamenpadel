<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roster Peserta · TurnamenPadel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/tp-theme.css"/>
<style>
  :root{--warn:#B45309;--danger:#DC2626;--accent2:var(--orange);--ok:#065F46}
  body{font-size:14px}
  .wrap{max-width:560px;margin:0 auto;padding:16px;padding-block:16px 52px}
  h1,h2,h3{font-family:var(--display);font-weight:900;margin:0} .faint{color:var(--slate-400)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate-500);display:inline-flex}
  .card{background:#fff;border:var(--bd);border-radius:var(--r-2xl);padding:16px;box-shadow:var(--sh-sm)}
  .card+.card{margin-top:12px}
  .hero{position:relative;overflow:hidden;border-radius:var(--r-2xl);border:var(--bd);
    background:rgba(254,243,199,.5);padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
  .hero h1{font-size:26px;margin:6px 0} .hero .eyebrow{color:var(--orange)}
  .row{display:flex;gap:10px;flex-wrap:wrap} .note{font-size:12px;color:var(--slate-500);margin-top:6px}
  label.f{display:block;margin-bottom:12px} label.f>span{display:block;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--slate-600);margin-bottom:6px;text-transform:uppercase} .req{color:var(--orange)}
  input,select,textarea{width:100%;background:#fff;border:var(--bd);color:var(--dark);border-radius:var(--r-lg);padding:11px 12px;font-family:var(--sans);font-size:14px;box-shadow:var(--sh-sm)}
  textarea{min-height:80px;resize:vertical}
  .btn{appearance:none;border:var(--bd);background:#fff;color:var(--dark);font-family:var(--display);font-weight:800;font-size:14px;padding:11px 15px;border-radius:var(--r-lg);cursor:pointer;box-shadow:var(--sh-sm);transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:translate(2px,2px);box-shadow:none}
  .btn.primary{background:var(--orange);color:#fff}.btn.ghost{background:var(--slate-100)}.btn.sm{padding:7px 11px;font-size:12.5px}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--sh-sm)}
  .nav{display:flex;gap:10px;margin-top:16px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--r-full);border:var(--bd);background:#fff}
  .chip.ok{color:#065F46;border-color:var(--mint);background:var(--mint-20)}
  .chip.warn{color:var(--warn);border-color:var(--amber-bd);background:var(--amber-bg)}
  .chip.block{color:var(--danger);border-color:var(--danger);background:rgba(220,38,38,.08)}
  .phead{display:flex;align-items:center;gap:11px}
  .avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:16px;color:#fff;background:var(--orange);border:var(--bd);overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .who{font-family:var(--display);font-weight:800;font-size:15px;line-height:1.1}.sub{font-size:11.5px;color:var(--slate-500)}
  .logo{display:inline-flex;align-items:center;gap:10px}
  .logo .glyph{width:32px;height:32px;border-radius:var(--r-lg);background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:14px;border:var(--bd)}
  .logo .name{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:-.01em}.logo .name b{color:var(--orange)}
  .empty{color:var(--slate-400);text-align:center;padding:40px 0}
  /* pair: two compact player rows (small square photo) — hemat ruang utk banyak peserta */
  .paircard{padding:12px}
  .ppair{display:flex;flex-direction:column;gap:8px}
  .pp{display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
  .pp .sq{width:52px;height:52px;flex:none;border-radius:var(--r-lg);border:var(--bd);overflow:hidden;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:20px}
  .pp .sq img{width:100%;height:100%;object-fit:cover}
  .pp .info{min-width:0}
  .pp .nm{font-family:var(--display);font-weight:800;font-size:14px;line-height:1.15;word-break:break-word}
  .pp .meta{font-size:12px;color:var(--slate-500);word-break:break-word;line-height:1.4}
  /* appeal rules list */
  .rules{margin:10px 0 0;padding-left:20px} .rules li{font-size:12.5px;line-height:1.55;margin:5px 0;color:var(--slate-600)}
  .rules li b{color:var(--dark)}
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:18px;z-index:50}
  .modal{background:#fff;border:var(--bd);border-radius:var(--r-2xl);padding:20px;max-width:420px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--sh-lg)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo" style="margin-bottom:12px"><span class="glyph">P</span><span class="name">TURNAMEN<b>PADEL</b></span></div>
  <div id="host"><p class="empty">Memuat…</p></div>
</div>
<div id="modalHost"></div>
<script>
const API="/api";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function qp(){ const m=location.pathname.match(/\/roster\/([^\/?#]+)/); const sp=new URLSearchParams(location.search);
  return { eventId:(m?decodeURIComponent(m[1]):sp.get("e")||""), t:sp.get("t")||"", c:sp.get("c")||"" }; }
const R={ ...qp(), data:null, cat:"" };
async function api(path,opts){ const res=await fetch(API+"/"+path,{method:(opts&&opts.method)||"GET",headers:{"Content-Type":"application/json"},body:opts&&opts.body?JSON.stringify(opts.body):undefined});
  let d={};try{d=await res.json();}catch(e){} if(!res.ok){const err=new Error(d.error||("HTTP "+res.status));err.status=res.status;throw err;} return d; }
function fileToDataUrl(input){return new Promise(r=>{const f=input.files&&input.files[0];if(!f)return r("");const rd=new FileReader();rd.onload=()=>r(rd.result);rd.onerror=()=>r("");rd.readAsDataURL(f);});}

async function boot(){
  if(!R.eventId||!R.t){ document.getElementById("host").innerHTML='<div class="card"><p class="empty">Link roster tidak valid.</p></div>'; return; }
  try{ R.data=await api("reg/roster/"+encodeURIComponent(R.eventId)+"?t="+encodeURIComponent(R.t)); }
  catch(e){ document.getElementById("host").innerHTML='<div class="card"><p class="empty">'+esc(e.message)+'</p></div>'; return; }
  R.cat = R.c && (R.data.categories||[]).some(c=>c.tournamentId===R.c) ? R.c : ((R.data.categories[0]||{}).tournamentId||"");
  render();
}
// Baris pemain ringkas: foto kotak kecil + nama + Instagram + region.
function playerSquare(p){
  p=p||{};
  const sq='<div class="sq">'+(p.photoUrl?'<img src="'+esc(p.photoUrl)+'" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.textContent=\''+esc((p.name||'?').charAt(0).toUpperCase())+'\'">':esc((p.name||'?').charAt(0).toUpperCase()))+'</div>';
  const ig=p.ig?'<div class="meta">Instagram: @'+esc(String(p.ig).replace(/^@/,''))+'</div>':'';
  const region='<div class="meta">📍 '+esc(p.region||'-')+'</div>';
  return '<div class="pp">'+sq+'<div class="info"><div class="nm">'+esc(p.name||'—')+'</div>'+ig+region+'</div></div>';
}
const APPEAL_RULES=[
  'Ajukan appeal <b>hanya bila kamu menemukan pelanggaran</b> terhadap aturan turnamen yang telah ditetapkan. Bila tidak ada pelanggaran, appeal tidak perlu diajukan.',
  'Appeal hanya diproses bila disertai <b>bukti yang jelas</b> (screenshot/foto) dan <b>penjelasan yang rinci</b>.',
  'Panitia akan melakukan <b>cross-check</b> kepada pihak yang di-appeal untuk memberi kesempatan menyampaikan sanggahan.',
  'Keputusan panitia bersifat <b>final</b> dan tidak dapat diganggu gugat.',
  'Proses appeal berlangsung <b>tertutup &amp; rahasia</b> — identitas pelapor maupun pihak yang di-appeal dijaga kerahasiaannya.',
  'Appeal hanya dapat diajukan <b>selama periode appeal berlangsung</b>; setelah periode berakhir, appeal tidak lagi diterima.',
  'Junjung tinggi <b>sportivitas</b> dalam mengajukan appeal.',
];
function render(){
  const d=R.data, cat=(d.categories||[]).find(c=>c.tournamentId===R.cat)||{pairs:[]};
  const open=d.appealOpen;
  // Pemain hanya melihat kategorinya sendiri (dari link email). Selektor kategori
  // hanya tampil bila tak ada kategori spesifik di link (mis. pratinjau admin).
  const locked = !!(R.c && (d.categories||[]).some(c=>c.tournamentId===R.c));
  const catLabel = cat.label?`${esc(cat.label)} · ${esc(cat.level||"")}`.replace(/ · $/,''):"";
  const selector = locked ? "" :
    `<label class="f" style="margin-top:12px"><span>Kategori</span><select onchange="R.cat=this.value;render()">
      ${(d.categories||[]).map(c=>`<option value="${esc(c.tournamentId)}" ${R.cat===c.tournamentId?'selected':''}>${esc(c.label)} · ${esc(c.level)} (${(c.pairs||[]).length})</option>`).join("")}</select></label>`;
  document.getElementById("host").innerHTML=`
    <div class="hero"><div class="eyebrow">Kurasi peserta · roster</div><h1>${esc(d.name||"")}</h1>
      ${catLabel?`<div class="chip" style="margin-top:8px">Kategori kamu: <b>${catLabel}</b></div>`:""}
      <div style="margin:12px 0 0"><b style="font-family:var(--display);font-size:14px">Aturan Appeal</b>
        <ol class="rules">${APPEAL_RULES.map(r=>`<li>${r}</li>`).join("")}</ol></div></div>
    <div class="card" style="border-color:${open?'var(--amber-bd)':'var(--danger)'}">
      ${open?`<b class="mono" style="color:var(--warn)">⏳ Appeal dibuka${d.appealDeadline?' s/d '+esc(d.appealDeadline):''}</b>`
             :`<b class="mono" style="color:var(--danger)">🔒 Batas appeal berakhir — roster final</b>`}</div>
    ${selector}
    <div style="margin-top:12px">${(cat.pairs||[]).length? cat.pairs.map(pr=>`<div class="card paircard">
        <div class="ppair">${playerSquare(pr.p1)}${playerSquare(pr.p2)}</div>
        <div class="nav"><button class="btn ghost sm" style="margin-left:auto" ${open?'':'disabled'} onclick="openAppeal('${esc(pr.regId)}','${esc((pr.p1.name||'')+' + '+(pr.p2.name||''))}')">⚑ Appeal pasangan ini</button></div>
      </div>`).join("") : '<p class="empty">Belum ada peserta di kategori ini.</p>'}</div>`;
}
function closeModal(){ document.getElementById("modalHost").innerHTML=""; }
function openAppeal(regId,label){
  document.getElementById("modalHost").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal"><div class="eyebrow">Ajukan appeal</div><h2 style="font-size:19px;margin:2px 0 10px">${esc(label)}</h2>
      <div id="apBody">
        <label class="f"><span>Nama kamu <span class="req">*</span></span><input id="apName" placeholder="nama lengkap"></label>
        <label class="f"><span>Email <span class="req">*</span></span><input id="apEmail" placeholder="email@mail.com"></label>
        <label class="f"><span>Alasan appeal <span class="req">*</span></span><textarea id="apReason" placeholder="jelaskan kenapa tidak sesuai level…"></textarea></label>
        <label class="f"><span>Bukti (foto) <span class="req">*</span></span><input id="apProof" type="file" accept="image/*" onchange="apPick(this)"></label>
        <span class="chip ok" id="apOk" hidden>bukti terpilih ✔</span>
        <div class="nav"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="submitAppeal('${esc(regId)}','${esc(label)}')">Kirim appeal</button></div>
        <p class="note">No. HP kamu diambil otomatis dari data registrasi (via email).</p>
      </div></div></div>`;
}
let AP_PROOF="";
async function apPick(input){ AP_PROOF=await fileToDataUrl(input); const ok=document.getElementById("apOk"); if(ok) ok.hidden=!AP_PROOF; }
async function submitAppeal(regId,label){
  const name=(document.getElementById("apName").value||"").trim();
  const email=(document.getElementById("apEmail").value||"").trim();
  const reason=(document.getElementById("apReason").value||"").trim();
  if(!name||!email||!reason||!AP_PROOF){ alert("Nama, email, alasan, dan bukti (foto) wajib."); return; }
  const cb=document.getElementById("apBody"); cb.innerHTML='<p class="muted">Mengirim…</p>';
  try{
    await api("reg/appeal",{method:"POST",body:{eventId:R.eventId,category:R.cat,againstRegId:regId,againstLabel:label,appellantName:name,appellantEmail:email,reason,proof:AP_PROOF}});
    cb.innerHTML='<div class="chip ok">✔ Appeal terkirim</div><p class="note">Admin akan meninjau. Terima kasih.</p><button class="btn primary" style="width:100%;margin-top:8px" onclick="closeModal()">Selesai</button>';
    AP_PROOF="";
  }catch(e){ cb.innerHTML='<div class="chip block">Gagal: '+esc(e.message)+'</div><button class="btn" style="width:100%;margin-top:8px" onclick="closeModal()">Tutup</button>'; }
}
boot();
</script>
</body>
</html>
