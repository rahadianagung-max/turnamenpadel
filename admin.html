<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login — TurnamenPadel</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/tp-theme.css"/>
<style>
.wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
.wrap .dots{position:absolute;inset:0;opacity:.12;pointer-events:none}
.card{position:relative;width:100%;max-width:400px;padding:34px 30px}
.brandbig{display:flex;align-items:center;justify-content:center;gap:10px}
.brandbig .glyph{width:38px;height:38px;border-radius:var(--r-lg);background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:18px;border:var(--bd);box-shadow:var(--sh-sm)}
.brandbig .name{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:-.01em}.brandbig .name b{color:var(--orange)}
.eyebrow{text-align:center;margin-top:14px;justify-content:center}
.title{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:30px;letter-spacing:-.02em;text-align:center;margin:6px 0 22px}
.field{margin-bottom:14px}
.field label{display:block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--slate-600);margin-bottom:7px}
.field input{width:100%;background:#fff;border:var(--bd);border-radius:var(--r-lg);padding:12px 14px;font:inherit;font-size:14px;color:var(--dark);outline:none;box-shadow:var(--sh-sm)}
.field input:focus{box-shadow:var(--sh-sm),0 0 0 3px rgba(255,87,34,.35)}
.submit{width:100%;justify-content:center;margin-top:6px}
.msg{min-height:18px;font-size:12.5px;margin-top:12px;text-align:center}
.msg.err{color:#DC2626}
.msg.ok{color:#065F46}
.back{display:block;text-align:center;margin-top:18px;font-size:12px;color:var(--slate-500)}
.back:hover{color:var(--dark)}
.lead{text-align:center;font-size:12.5px;color:var(--slate-500);margin:-14px 0 20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="dots dotgrid"></div>
  <div class="card card--lg">
    <a href="/" class="brandbig"><span class="glyph">P</span><span class="name">TURNAMEN<b>PADEL</b></span></a>
    <div class="eyebrow" style="color:var(--orange)">Tournament Engine</div>
    <h1 class="title" id="loginTitle">Admin Login</h1>
    <p class="lead" id="loginLead">Setiap turnamen dicatat atas nama admin yang login.</p>
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="u">Username</label>
        <input id="u" name="username" type="text" autocomplete="username" required/>
      </div>
      <div class="field">
        <label for="p">Password</label>
        <input id="p" name="password" type="password" autocomplete="current-password" required/>
      </div>
      <div class="field" id="venueField" style="display:none;">
        <label for="v">Venue (opsional)</label>
        <input id="v" name="venue" type="text" autocomplete="off"/>
      </div>
      <button class="btn btn--primary btn--upper submit" id="submitBtn" type="submit"><span class="material-symbols-outlined">login</span> <span id="submitLabel">Sign In</span></button>
      <div class="msg" id="msg" aria-live="polite"></div>
    </form>
    <a href="/" class="back">← Back to home</a>
  </div>
</div>
<script>
(function(){
  // Real multi-admin login: authenticates against the Admins sheet via the API.
  // Each admin gets their own login; tournaments they create are recorded under
  // their username. Superadmins can add more admins from inside the engine.
  var BASE = location.protocol.startsWith('http') ? '/api' : 'https://www.turnamenpadel.com/api';
  var ENGINE = '/engine'; // default landing for a signed-in admin
  // A page can send admins here with ?next=/some/path and get them back after
  // login (e.g. /scorerdesk). Only same-origin relative paths are allowed
  // (must start with a single "/") to avoid open-redirects.
  function safeNext(){
    try{
      var n=new URLSearchParams(location.search).get('next');
      if(n && n.charAt(0)==='/' && n.charAt(1)!=='/') return n;
    }catch(e){}
    return '';
  }
  var DEST = safeNext() || ENGINE;
  var form=document.getElementById('loginForm'),
      msg=document.getElementById('msg'),
      btn=document.getElementById('submitBtn'),
      setupMode=false;

  async function api(path, opts){
    opts=opts||{};
    var res=await fetch(BASE+'/'+path, {
      method: opts.method||'GET',
      headers: {'Content-Type':'application/json'},
      body: opts.body?JSON.stringify(opts.body):undefined,
    });
    var data={}; try{ data=await res.json(); }catch(e){}
    if(!res.ok){ var err=new Error(data.error||('HTTP '+res.status)); err.status=res.status; throw err; }
    return data;
  }
  function saveSession(s){
    try{
      sessionStorage.setItem('tp_auth','1');
      sessionStorage.setItem('tp_session', JSON.stringify(s));
      localStorage.setItem('tp_session', JSON.stringify(s));
    }catch(e){}
  }
  function enterSetup(){
    setupMode=true;
    document.getElementById('loginTitle').textContent='Buat Superadmin';
    document.getElementById('loginLead').textContent='Belum ada admin. Buat akun superadmin pertama — akun ini bisa menambah admin lain.';
    document.getElementById('venueField').style.display='';
    document.getElementById('submitLabel').textContent='Buat & Masuk';
  }

  // If already signed in, skip straight to the engine.
  try{
    var existing=JSON.parse(sessionStorage.getItem('tp_session')||localStorage.getItem('tp_session')||'null');
    if(existing && existing.username){ location.replace(DEST); }
  }catch(e){}

  // Detect first-run (no admins yet) to offer superadmin setup.
  api('admins').then(function(d){
    if(!d.admins || d.admins.length===0) enterSetup();
  }).catch(function(){});

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var username=document.getElementById('u').value.trim();
    var password=document.getElementById('p').value;
    var venue=document.getElementById('v').value.trim();
    if(!username || !password){ msg.className='msg err'; msg.textContent='Isi username dan password.'; return; }
    btn.disabled=true; msg.className='msg'; msg.textContent='…';
    try{
      if(setupMode){
        await api('admins', { method:'POST', body:{ username:username, password:password, role:'superadmin', venue:venue } });
      }
      var s=await api('auth/login', { method:'POST', body:{ username:username, password:password } });
      saveSession(s);
      msg.className='msg ok'; msg.textContent='Selamat datang, '+s.username+'. Memuat…';
      location.href=DEST;
    }catch(err){
      btn.disabled=false;
      msg.className='msg err';
      msg.textContent = err.status===401 ? 'Username atau password salah.' : (err.message||'Gagal masuk.');
    }
  });
})();
</script>
</body>
</html>
