<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TurnamenPadel.com</title>
<!-- Full Simulation mode (inert unless ?sim=1): routes /api/* to an in-browser mock, never the real server. -->
<script>if(new URLSearchParams(location.search).get("sim")==="1"){document.write('<script src="/sim/backend.js"><\/script><script src="/sim/guard.js"><\/script>');}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
<style>
  :root{
    color-scheme:light;
    /* tp-theme (home) tokens on a broken-white base. --dark = text AND borders in
       light mode; in dark mode --dark becomes the light ink (borders get their own). */
    --orange:#FF5722; --orange-10:rgba(255,87,34,.10); --orange-18:rgba(255,87,34,.18);
    --blue:#2563EB; --blue-100:#DBEAFE; --mint:#10B981;
    --amber:#B45309; --amber-bg:#FEF3C7; --amber-bd:#FCD34D; --silver:#94A3B8;
    --dark:#0F172A; --canvas:#EFEADF; --card:#FBF8F1; --tile:#ECE6DA;
    --slate-100:#F1F5F9; --slate-200:#E2E8F0; --slate-300:#CBD5E1;
    --slate-400:#94A3B8; --slate-500:#64748B; --slate-600:#475569; --slate-700:#334155; --slate-800:#1E293B;
    --accent:#FF5722; --accent2:#FF7A45; --muted:#475569; --faint:#94A3B8; --text:#0F172A;
    --display:'Plus Jakarta Sans',system-ui,sans-serif;
    --sans:'Inter',system-ui,sans-serif;
    --mono:'Space Grotesk',ui-monospace,monospace;
    --sh-sm:2px 2px 0 0 var(--dark); --sh:4px 4px 0 0 var(--dark); --sh-lg:6px 6px 0 0 var(--dark);
    --bd:2px solid var(--dark); --bd-soft:1px solid var(--slate-200);
    --r-lg:.6rem; --r-xl:.75rem; --r-2xl:1rem; --r-3xl:1.5rem; --r-full:999px;
    --r:1rem; --r-sm:.6rem;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --dark:#ECE7DB; --canvas:#120F0A; --card:#1D1A13; --tile:#2A271E;
    --slate-100:#262219; --slate-200:#3A362B; --slate-300:#4A4537;
    --slate-400:#8A8370; --slate-500:#A49E8D; --slate-600:#C4BEAE; --slate-700:#D8D3C6; --slate-800:#EDE8DC;
    --accent:#FF6A3D; --accent2:#FF925F; --muted:#C4BEAE; --faint:#8A8370; --text:#ECE7DB; --silver:#C7CFDD;
    --bd:2px solid #3A362B; --bd-soft:1px solid #3A362B;
    --sh-sm:2px 2px 0 0 #000; --sh:4px 4px 0 0 #000; --sh-lg:6px 6px 0 0 #000;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0 auto; max-width:620px; min-height:100vh; background:var(--canvas); color:var(--dark);
    font-family:var(--sans); line-height:1.5; -webkit-font-smoothing:antialiased; padding:0 0 0;}
  a{color:inherit; text-decoration:none;}
  .material-symbols-outlined{font-family:'Material Symbols Outlined'; font-weight:normal; font-style:normal;
    font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24; vertical-align:middle; line-height:1;
    white-space:nowrap; letter-spacing:normal; text-transform:none; direction:ltr;}
  .wrap{padding:0 max(14px,env(safe-area-inset-left,0px)) 0 max(14px,env(safe-area-inset-right,0px));}

  /* header */
  header{position:sticky; top:0; z-index:50; background:color-mix(in srgb,var(--card) 95%,transparent);
    backdrop-filter:blur(10px); border-bottom:var(--bd); padding:12px max(14px,env(safe-area-inset-left,0px));}
  .brand{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .tp-logo{display:inline-flex; align-items:center; gap:10px; min-width:0;}
  .tp-logo .glyph{width:32px; height:32px; border-radius:var(--r-lg); background:var(--orange); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:800;
    font-size:15px; border:var(--bd); box-shadow:var(--sh-sm); flex:0 0 auto;}
  .tp-logo .lk{display:flex; flex-direction:column; line-height:1; min-width:0;}
  .tp-logo .pw{font-family:var(--mono); font-size:8px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; color:var(--slate-500); margin-bottom:3px;}
  .tp-logo .name{font-family:var(--display); font-weight:900; font-size:14px; letter-spacing:-.02em; color:var(--dark);}
  .tp-logo .name b{color:var(--orange);}
  .hactions{display:flex; align-items:center; gap:8px; flex:0 0 auto;}
  .live{display:inline-flex; flex-direction:column; align-items:flex-end; font-family:var(--mono); font-size:9px;
    font-weight:700; letter-spacing:.06em; color:var(--faint); text-align:right; line-height:1.3;}
  .live b{color:var(--accent);}
  .themebtn{width:34px; height:34px; border:var(--bd); border-radius:var(--r-lg); background:var(--card);
    color:var(--dark); font-size:16px; line-height:1; cursor:pointer; display:inline-flex; align-items:center;
    justify-content:center; padding:0; box-shadow:var(--sh-sm); transition:transform .15s,box-shadow .15s; flex:0 0 auto;}
  .themebtn:active{transform:translate(2px,2px); box-shadow:none;}
  .themebtn:focus-visible{outline:none; border-color:var(--accent);}

  /* event head */
  #evhead{padding-top:4px;}
  .evname{font-family:var(--display); font-weight:900; font-size:30px; letter-spacing:-.025em; line-height:1.03;
    text-transform:uppercase; margin-top:14px;}
  .evmeta{display:inline-flex; align-items:center; gap:6px; margin-top:12px; font-family:var(--mono); font-size:11px;
    font-weight:700; color:var(--slate-600); background:var(--card); border:var(--bd); border-radius:var(--r-full);
    padding:4px 11px; box-shadow:var(--sh-sm);}

  /* category switcher */
  .tabs{display:flex; gap:8px; align-items:center; overflow-x:auto; padding:14px 14px 2px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto; font-family:var(--display); font-weight:800; font-size:13px; color:var(--slate-600);
    background:var(--card); border:var(--bd); border-radius:var(--r-full); box-shadow:var(--sh-sm);
    padding:8px 14px; cursor:pointer; white-space:nowrap;}
  .tab.on{background:var(--accent); color:#fff;}
  .catlbl{flex:0 0 auto; align-self:center; font-family:var(--mono); font-size:10px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; color:var(--slate-500); margin-right:2px; white-space:nowrap;}
  .catsel{flex:0 0 auto; max-width:100%; font-family:var(--display); font-weight:800; font-size:13.5px; color:var(--dark);
    background:var(--card); border:var(--bd); border-radius:var(--r-xl); box-shadow:var(--sh-sm); padding:9px 13px;
    cursor:pointer; -webkit-appearance:none; appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--slate-500) 50%),linear-gradient(135deg,var(--slate-500) 50%,transparent 50%);
    background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px; background-size:5px 5px,5px 5px; background-repeat:no-repeat;}
  .catsel:focus{outline:none;}

  /* subtabs */
  .subtabs{display:flex; gap:6px; margin:16px 0 4px;}
  .subtab{flex:1; text-align:center; font-family:var(--display); font-weight:800; font-size:11.5px;
    color:var(--slate-600); background:var(--card); border:var(--bd); border-radius:var(--r-lg);
    box-shadow:var(--sh-sm); padding:10px 4px; cursor:pointer; white-space:nowrap; transition:transform .12s,box-shadow .12s;}
  .subtab.on{background:var(--accent); color:#fff;}
  .subtab:not(.on):active{transform:translate(2px,2px); box-shadow:none;}
  .tap-hint{font-family:var(--sans); font-size:12px; color:var(--slate-600); margin:12px 2px 2px; text-align:center; line-height:1.4;}
  .tap-hint b{color:var(--accent2); font-weight:700;}

  /* avatars — square tile, gender-icon fallback */
  .av{width:30px; height:30px; border-radius:var(--r-lg); border:var(--bd); box-shadow:var(--sh-sm);
    background:var(--tile); color:var(--slate-400); flex:0 0 auto; display:inline-flex; align-items:center;
    justify-content:center; overflow:hidden; font-family:var(--mono); font-size:10px; font-weight:700;}
  .av .material-symbols-outlined{font-size:20px;}
  .av img{width:100%; height:100%; object-fit:cover; display:block;}
  .pl{color:var(--dark); font-family:var(--sans);}
  .pchip{display:inline-flex; align-items:center; gap:7px; min-width:0;}

  /* schedule */
  .mrow{background:var(--card); border:var(--bd); border-radius:var(--r-2xl); box-shadow:var(--sh);
    padding:10px 14px; margin-bottom:10px;}
  .mrow:first-child{margin-top:16px;}
  .hourblk{margin-top:12px;}
  .hourblk:first-of-type{margin-top:16px;}
  .hourblk .hourbody .mrow:first-child{margin-top:10px;}
  .hourhdr{list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--tile); border:var(--bd); border-radius:var(--r-2xl); box-shadow:var(--sh-sm);
    padding:11px 14px; -webkit-user-select:none; user-select:none;}
  .hourhdr::-webkit-details-marker{display:none;}
  .hourhdr .hh{font-family:var(--mono); font-size:16px; font-weight:800; color:var(--dark); letter-spacing:.01em;}
  .hourhdr .hm{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--slate-600); margin-left:auto; margin-right:4px;}
  .hourhdr::after{content:"⌄"; font-size:16px; line-height:1; color:var(--slate-500); transition:transform .15s ease; transform:translateY(-2px);}
  .hourblk[open] > .hourhdr::after{transform:translateY(0) rotate(180deg);}
  .hourblk.has-live > .hourhdr{box-shadow:4px 4px 0 0 var(--accent); border-color:var(--accent);}
  .hourblk.has-live > .hourhdr .hm{color:var(--accent);}
  .mrow.live-now{box-shadow:4px 4px 0 0 var(--accent);}
  .mrow.done{background:var(--tile); box-shadow:var(--sh-sm);}
  .mrow.mine{box-shadow:4px 4px 0 0 var(--amber-bd);}
  .mrow .top{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;}
  .mrow .when{display:flex; align-items:center; gap:10px; min-width:0; flex-wrap:wrap;}
  .mrow .time{font-family:var(--mono); font-size:14px; font-weight:700; color:var(--dark);}
  .mrow .gl{font-family:var(--mono); font-size:14px; font-weight:700; color:var(--slate-600); letter-spacing:.01em;
    overflow:hidden; text-overflow:ellipsis;}
  .badge-now{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:9px; font-weight:800;
    letter-spacing:.08em; color:#fff; background:var(--accent); border:var(--bd); border-radius:var(--r-full);
    padding:3px 9px; box-shadow:var(--sh-sm); flex:0 0 auto;}
  .team{display:flex; align-items:center; gap:10px; padding:2px 0; font-size:15px;}
  .team .nm{display:flex; align-items:center; gap:7px; flex-wrap:wrap; min-width:0;}
  .team.w .nm{color:var(--accent); font-weight:800;}
  .team.w .pl{color:var(--accent);}
  .team .sc{margin-left:auto; font-family:var(--mono); font-size:22px; font-weight:700;}
  .team.w .sc{color:var(--accent);}
  .tname{flex-basis:100%; font-family:var(--display); font-weight:800; font-size:17px; letter-spacing:-.01em; line-height:1.15;}
  .team.w .tname{color:var(--accent);}
  .tplayers{flex-basis:100%; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13.5px;
    color:var(--slate-700); font-weight:600; margin-top:3px;}
  .tplayers .av{width:28px; height:28px;}
  .tplayers .av .material-symbols-outlined{font-size:18px;}
  .tplayers .pl{color:var(--slate-700);}
  .vs{font-family:var(--mono); font-size:13px; font-weight:800; color:var(--slate-500); text-transform:uppercase;
    letter-spacing:.14em; text-align:center; padding:1px 0; position:relative;}
  .vs::before,.vs::after{content:""; position:absolute; top:50%; width:calc(50% - 26px); height:2px; background:var(--slate-200);}
  .vs::before{left:0;} .vs::after{right:0;}

  /* schedule: player picker + my next match */
  .sched-hint{font-size:12.5px; color:var(--slate-600); line-height:1.45; margin:16px 2px 2px;}
  .schedctl{display:flex; align-items:center; gap:8px; margin:12px 0 2px;}
  .schedctl label{font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:var(--slate-500); flex:0 0 auto;}
  .schedctl select{flex:1 1 auto; min-width:0; font-family:var(--sans); font-size:13px; color:var(--dark);
    background:var(--card); border:var(--bd); border-radius:var(--r-xl); box-shadow:var(--sh-sm); padding:10px 13px;
    -webkit-appearance:none; appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--slate-500) 50%),linear-gradient(135deg,var(--slate-500) 50%,transparent 50%);
    background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px; background-size:5px 5px,5px 5px; background-repeat:no-repeat;}
  .nextcard{background:var(--orange-10); border:var(--bd); border-radius:var(--r-2xl); box-shadow:4px 4px 0 0 var(--accent);
    padding:12px 14px; margin:12px 0 4px;}
  .nextcard .lab{font-family:var(--mono); font-size:9.5px; font-weight:800; letter-spacing:.06em; color:var(--accent);
    text-transform:uppercase;}
  .nextcard .big{display:flex; align-items:baseline; gap:9px; margin-top:5px; flex-wrap:wrap;}
  .nextcard .big .t{font-family:var(--mono); font-size:24px; font-weight:700; color:var(--dark);}
  .nextcard .big .c{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--accent);}
  .nextcard .opp{font-size:13.5px; color:var(--slate-700); margin-top:6px;}
  .nextcard .opp b{color:var(--dark);}
  .schedempty{color:var(--slate-500); font-size:13px; padding:14px 2px;}

  /* standings */
  .tscroll{overflow-x:auto; scrollbar-width:none;}
  .tscroll::-webkit-scrollbar{display:none;}
  .tcardwrap{background:var(--card); border:var(--bd); border-radius:var(--r-2xl); box-shadow:var(--sh);
    padding:14px 14px 8px; margin:16px 0;}
  .stable{width:100%; border-collapse:collapse; font-size:13.5px;}
  .stable caption{text-align:left; font-family:var(--display); font-weight:900; font-size:17px; letter-spacing:-.01em;
    padding-bottom:4px; caption-side:top;}
  .stable caption span{display:block; font-family:var(--mono); font-size:10px; font-weight:600; color:var(--slate-500);
    margin-top:5px; line-height:1.4;}
  .stable th{font-family:var(--mono); font-size:9.5px; font-weight:700; color:var(--slate-500); text-transform:uppercase;
    letter-spacing:.04em; text-align:center; padding:10px 5px 8px; white-space:nowrap;}
  .stable th.l{text-align:left;}
  .stable th.decide-h{color:var(--accent);}
  .stable td{padding:9px 5px; border-bottom:var(--bd-soft); vertical-align:middle;}
  .stable tr:last-child td{border-bottom:none;}
  .stable .rk{font-family:var(--mono); font-weight:700; color:var(--accent2); width:22px; text-align:center;}
  .stable .nmcell{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .stable .num-c{font-family:var(--mono); text-align:center; width:30px; color:var(--slate-600); white-space:nowrap;}
  .stable .num-c.decide{color:var(--accent); font-weight:800; background:var(--orange-10);}
  .stable .pts-c{color:var(--accent); font-size:14px;}
  .stable tr.top td{background:var(--orange-10);} .stable tr.top .rk{color:var(--accent);}
  .stable tr.champ td{background:var(--orange-10);} .stable tr.champ .rk{color:var(--accent);}
  .stable tr.prosp td{background:rgba(255,122,26,.07);} .stable tr.prosp .rk{color:var(--accent2);}
  .tie{display:inline-flex; align-items:center; gap:3px; font-family:var(--mono); font-size:8px; font-weight:800;
    letter-spacing:.03em; border-radius:4px; padding:1px 5px; vertical-align:middle; white-space:nowrap;}
  .tie.win{background:var(--accent); color:#fff;}
  .tie.lose{background:var(--tile); color:var(--slate-500); border:1px solid var(--slate-300);}
  .tie.multi{background:var(--blue-100); color:var(--blue); border:1px solid rgba(37,99,235,.35);}
  .deciderow{font-family:var(--mono); font-size:10px; color:var(--slate-600); margin-top:10px; line-height:1.5;}
  .deciderow b{color:var(--accent); font-weight:800;}

  /* bracket */
  .tier{margin:18px 0 6px;}
  .tier > h3{display:flex; align-items:center; gap:9px; font-family:var(--display); font-weight:900; font-size:17px;
    letter-spacing:-.01em; margin:0 0 12px;}
  .tier > h3 .tg{font-family:var(--mono); font-size:9px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    color:#fff; background:var(--accent2); border:var(--bd); border-radius:var(--r-full); padding:3px 9px; box-shadow:var(--sh-sm);}
  .podium{display:flex; gap:9px; margin-bottom:16px;}
  .pod{flex:1; background:var(--card); border:var(--bd); border-radius:var(--r-xl); box-shadow:var(--sh-sm); padding:10px 10px;}
  .pod .rk{font-family:var(--mono); font-size:9px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--slate-500);}
  .pod .who{font-family:var(--display); font-weight:800; font-size:13px; margin-top:6px; line-height:1.2;}
  .pod.g{background:var(--orange-10);} .pod.g .rk{color:var(--accent);}
  .pod.s .rk{color:var(--silver);} .pod.b .rk{color:var(--amber);}
  .pround{margin-bottom:14px;}
  .pround h4{font-family:var(--mono); font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    color:var(--slate-500); margin:0 0 9px; display:flex; align-items:center; gap:7px;}
  .pround h4::after{content:""; flex:1; height:2px; background:var(--slate-200);}
  .pmatch{background:var(--card); border:var(--bd); border-radius:var(--r-xl); box-shadow:var(--sh-sm);
    padding:10px 12px; margin-bottom:9px;}
  .pmatch .pmmeta{font-family:var(--mono); font-size:10px; font-weight:700; color:var(--slate-500); margin-bottom:7px;}
  .pmatch.bye{opacity:.5;}
  .pline{display:flex; align-items:center; gap:7px; padding:3px 0; font-size:14px;}
  .pline.w{color:var(--accent); font-weight:800;}
  .pline .sc{margin-left:auto; font-family:var(--mono); font-size:16px; font-weight:700;}
  .pline .tbd{color:var(--slate-400); font-style:italic;}
  .pline .pnm{display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0;}
  .empty{color:var(--slate-500); font-size:13.5px; text-align:center; padding:34px 10px;}
  /* projected (simulated) bracket */
  .projnote{font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.02em; color:var(--accent);
    background:var(--orange-10); border:2px dashed var(--accent); border-radius:var(--r-xl); padding:10px 12px;
    margin:2px 0 14px; line-height:1.4;}
  .tier.proj > h3 .tg{background:var(--card); color:var(--accent);}
  .pmatch.proj{border-style:dashed;}
  .pmatch.proj .pline{color:var(--slate-500); font-style:italic;}
  /* provisional qualification panel */
  .qpanel{background:var(--card); border:var(--bd); border-radius:var(--r-2xl); box-shadow:var(--sh); padding:12px 13px; margin:2px 0 16px;}
  .qhead{font-family:var(--display); font-weight:900; font-size:16px; letter-spacing:-.01em;}
  .qcap{font-family:var(--mono); font-size:9.5px; color:var(--slate-500); margin:4px 0 10px; line-height:1.45;}
  .qgrid{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
  .qrow{display:flex; align-items:center; gap:7px; border:var(--bd); border-radius:var(--r-lg); box-shadow:var(--sh-sm);
    padding:7px 9px; min-width:0; background:var(--card);}
  .qrow .qpos{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--slate-500); flex:0 0 auto; width:14px;}
  .qrow .qnm{flex:1 1 auto; min-width:0; font-family:var(--display); font-size:12.5px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .qrow .qnm.tbc{color:var(--slate-400); font-style:italic; font-weight:400;}
  .qrow .qtag{flex:0 0 auto; font-family:var(--mono); font-size:8.5px; font-weight:800; color:var(--accent); letter-spacing:.03em;}
  .qrow.ok{background:var(--orange-10);}
  .qgblk{margin-top:10px;}
  .qglabel{font-family:var(--mono); font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:6px;}

<script>
const BASE = location.protocol.startsWith("http") ? "/api" : "https://www.turnamenpadel.com/api";
const PASSPORT = "https://trekkr.online/player/";
const qs = new URLSearchParams(location.search);
// Event can be given as ?event=<id> (old links) or as a friendly slug path
// /mobile/<slug> (resolved from the event name at load time — see boot()).
let EVENT_ID = qs.get("event");
// Team-only board (?teams=1 / ?teamsonly=1): show custom team names without the
// player-name line — same as the TV leaderboard. Falls back to the pair's names
// only when a team has no custom name set.
const TEAMS_ONLY = qs.get("teams")==="1" || qs.has("teamsonly");
const slugify = s => String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80) || "event";
function slugFromPath(){ const m = /^\/(?:mobile|tv)\/([^\/?#]+)/.exec(location.pathname); return m ? decodeURIComponent(m[1]) : ""; }
const norm = s => String(s||"").trim().toLowerCase().replace(/\s+/g," ");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state = { data:null, cat:0, view:"schedule", player:"", group:"", openHours:{} };

// ---- Day / Night mode (per-viewer, persisted) --------------------------------
const THEME_KEY = "tp_mobile_theme";
function systemDark(){ try{ return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches; }catch(e){ return false; } }
function applyTheme(mode){
  const dark = mode === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  const btn = document.getElementById("themeBtn");
  if(btn){ btn.textContent = dark ? "☀️" : "🌙"; btn.title = dark ? "Mode terang" : "Mode gelap"; }
}
function initTheme(){
  let saved=null; try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  // Always open in light (broken-white) by default, regardless of the phone's OS
  // theme; the viewer's own toggle choice (stored) still wins.
  applyTheme(saved || "light");
  const btn = document.getElementById("themeBtn");
  if(btn) btn.addEventListener("click", ()=>{
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next); try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  });
}
initTheme();

async function api(path){ const r = await fetch(BASE+path); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }

function initials(name){ const p=String(name||"").trim().split(/\s+/); return ((p[0]||"")[0]||"")+((p[1]||"")[0]||""); }
// Gender fallback icon (man/woman) when a player has no uploaded photo. Reads the
// gender field now exposed by the public board (defaults to male when unknown).
function genderIcon(name){ const p=state.data&&state.data.players&&state.data.players[norm(name)]; const g=(p&&p.gender?String(p.gender):"M").toUpperCase(); return g.startsWith("F")?"woman":"man"; }
function avatar(name){
  const pl = state.data && state.data.players[norm(name)];
  if(pl && pl.photo) return `<span class="av"><img src="${esc(pl.photo)}" alt=""/></span>`;
  return `<span class="av"><span class="material-symbols-outlined">${genderIcon(name)}</span></span>`;
}
function slug(n){ return String(n||"").toLowerCase().replace(/[^a-z0-9]+/g,""); }
function firstName(n){ const t=String(n||"").trim(); return t? t.split(/\s+/)[0] : ""; }
// Show a player's check-in nickname when they set one; otherwise their first name.
// Mobile/TV show the Display_Name column (set via check-in). The full Name is only
// used on the Trekkr passport + its URL. No more first-name derivation.
// Nama ringkas untuk papan: kata pertama saja; tapi bila kata pertama ≤ 3 huruf
// (mis. "Bo", "Edy") tampilkan juga kata kedua agar tidak ambigu.
function shortName(full){
  const parts=String(full||"").trim().split(/\s+/).filter(Boolean);
  if(parts.length<=1) return parts[0]||String(full||"");
  return parts[0].length<=3 ? (parts[0]+" "+parts[1]) : parts[0];
}
// Prioritas: panggilan/alias (Display_Name) bila ada; jika tidak, nama lengkap.
// Lalu diringkas (shortName): kata pertama saja, +kata kedua bila kata pertama
// ≤ 3 huruf. Display_Name sering = nama lengkap, jadi tetap perlu diringkas.
// Nama lengkap asli tetap dipakai untuk URL passport.
function dispName(n){ const p=state.data&&state.data.players&&state.data.players[norm(n)]; const d=p&&p.display?String(p.display).trim():""; return shortName(d||String(n||"")); }
// Convert a combined "A + B" team string to display nicknames.
function dispPair(team){ return String(team||"").split(/\s*\+\s*/).filter(Boolean).map(dispName).join(" + "); }
function plink(name){ if(!name) return ""; return `<a class="pl" href="${PASSPORT}${slug(name)}" target="_blank" rel="noopener noreferrer">${esc(dispName(name))}</a>`; }
function teamNames(cat, entrantId, withAv){
  const e = cat.entrants[entrantId];
  if(!e) return entrantId ? esc(entrantId) : '<span class="tbd">TBD</span>';
  const tn = (e.teamName||"").trim();
  // Team-only mode: show the team name alone (no player line). When a pair has no
  // custom name, fall back to its display names as the label — like the TV board.
  if(TEAMS_ONLY){
    const label = tn || [e.player1,e.player2].map(dispName).filter(Boolean).join(" + ");
    return `<span class="tname">${esc(label)}</span>`;
  }
  const a = `<span class="pchip">${withAv?avatar(e.player1):""}${plink(e.player1)}</span>`;
  const b = `<span class="pchip">${withAv?avatar(e.player2):""}${plink(e.player2)}</span>`;
  const players = `${a} <span style="color:var(--faint)">+</span> ${b}`;
  // Opsi D: when a pair has a custom team name, show it as the title with the
  // players on a smaller second line (still clickable). Empty => players only.
  if(tn) return `<span class="tname">${esc(tn)}</span><span class="tplayers">${players}</span>`;
  return players;
}

function roundLabel(round, numRounds){
  if(String(round)==="BRONZE") return "3rd Place";
  const r=parseInt(round), f=numRounds-r;
  return f===0?"Final":f===1?"Semifinal":f===2?"Quarterfinal":f===3?"Round of 16":"Round "+r;
}

// Full category names (avoid codes like MD/WD/MIXED on the board).
function catLabel(c){ const k=String(c||"").trim().toUpperCase(); return {MD:"Men's Doubles", WD:"Women's Doubles", MIXED:"Fixed Mixed"}[k] || c; }
function levelLabel(l){ const k=String(l||"").toLowerCase().trim().replace(/\s+/g,"_"); return {beginner:"Beginner", upper_beginner:"Upper Beginner", lower_bronze:"Lower Bronze", bronze:"Bronze", upper_bronze:"Upper Bronze", silver:"Silver", gold:"Gold", platinum:"Platinum"}[k] || ""; }
// Category tab label incl. level, so same-gender categories at different levels
// (e.g. two Women's Doubles) can be told apart.
function catTabLabel(c){ const cl=catLabel(c.category), lv=levelLabel(c.level); return lv ? cl+" · "+lv : cl; }
function renderTabs(){
  const cats = state.data.categories;
  // Only show the category switcher when there is more than one category.
  // Category switcher as a compact dropdown (labels can be long, e.g. with level).
  document.getElementById("cattabs").innerHTML = cats.length>1
    ? `<label class="catlbl" for="catSelect">Category</label>
       <select id="catSelect" class="catsel" aria-label="Category" onchange="setCat(this.value)">${cats.map((c,i)=>
        `<option value="${i}" ${i===state.cat?"selected":""}>${esc(catTabLabel(c))}</option>`).join("")}</select>`
    : "";
  const labels = { schedule:"Order of Play", standings:"Group / Standing", bracket:"Bracket" };
  document.getElementById("subtabs").innerHTML = `<div class="subtabs">
    ${["schedule","standings","bracket"].map(v=>`<div class="subtab ${v===state.view?'on':''}" onclick="setView('${v}')">${labels[v]}</div>`).join("")}
  </div>
  <p class="tap-hint">Tap a player's name to see their <b>track record</b> on Trekkr.</p>`;
}
function setCat(i){ state.cat=parseInt(i)||0; renderTabs(); renderBody(); }
function setView(v){ state.view=v; renderTabs(); renderBody(); }

function renderBody(){
  const cat = state.data.categories[state.cat];
  const el = document.getElementById("body");
  if(!cat){ el.innerHTML='<p class="empty">No category yet.</p>'; return; }
  if(state.view==="schedule") el.innerHTML = renderSchedule(cat);
  else if(state.view==="standings") el.innerHTML = renderStandings(cat);
  else el.innerHTML = renderBracket(cat);
}

// ---- Live projection helpers (WIB / Asia-Jakarta, UTC+7, no DST) ----
// Semua perbandingan "sekarang" pakai INSTANT ABSOLUT (epoch ms) agar tanggal ikut
// diperhitungkan — match di tanggal mendatang tidak boleh dianggap sedang main.
function wibEpoch(dateStr, min){ // tanggal "YYYY-MM-DD" + menit-dalam-hari WIB -> epoch ms
  if(!dateStr || min==null) return null;
  const hh=String(Math.floor(min/60)).padStart(2,"0"), mm=String(min%60).padStart(2,"0");
  const t = Date.parse(dateStr+"T"+hh+":"+mm+":00+07:00");
  return isNaN(t) ? null : t;
}
function epochToWibStr(ms){ const d=new Date(ms); const min=(d.getUTCHours()*60 + d.getUTCMinutes() + 7*60) % 1440; const h=Math.floor(min/60), m=min%60; return (h<10?"0":"")+h+":"+(m<10?"0":"")+m; }
function renderSchedule(cat){
  const anySchedule = (state.data.categories||[]).some(c=>c.schedule && c.schedule.length);
  if(!anySchedule) return '<p class="empty">Group stage schedule not available yet.</p>';
  const pred = predictTimes();
  let live = null; // {proj: matchId->startMin, playing:Set} — diisi setelah cmp didefinisikan
  // Trust the stored time when set (per-category batch times / manual edits — the
  // same value admin & sheet show); only fall back to the predicted slot time when
  // there is no stored time. A pinned match (explicit date) always uses its time.
  const ptime = (m)=>{ if(m.status!=="DONE" && live && live.proj[m.matchId]!=null) return esc(epochToWibStr(live.proj[m.matchId])); return esc(m.date ? fmtTime(m.time) : (fmtTime(m.time) || pred[m.matchId] || "")); };

  // Chronological order: earliest date first, then the displayed time (pinned or
  // predicted), then court. The SAME order drives both the list and the LIVE badge.
  const dkey = m => String(m.date || (state.data.event && state.data.event.date) || "");
  const tmin = m => { const s = m.date ? fmtTime(m.time) : (fmtTime(m.time) || pred[m.matchId]); if(!s) return (m.slot||0)*1; const p=String(s).split(":"); return (parseInt(p[0])||0)*60+(parseInt(p[1])||0); };
  const cmp = (a,b)=> dkey(a).localeCompare(dkey(b)) || (tmin(a)-tmin(b)) || ((a.court||0)-(b.court||0));

  // LIVE PROJECTION (babak grup, lintas kategori, per court). Setelah sebuah match
  // di-skor (DONE), waktu match berikutnya di court itu dihitung dari waktu selesai
  // aktual (updatedAt, WIB) + estimasi (matchMinutes) — "boleh maju". NOW PLAYING
  // menyala saat jam WIB ≥ waktu-proyeksi match belum-DONE paling awal di tiap court.
  live = (function(){
    const est = (state.data.event && parseInt(state.data.event.matchMinutes)) || 15;
    const evDate = (state.data.event && state.data.event.date) || "";
    const schedEpoch = m => wibEpoch(String(m.date || evDate || ""), tmin(m));
    const byCourt = {};
    (state.data.categories||[]).forEach(mc=>(mc.schedule||[]).forEach(m=>{ const c=String(m.court||""); (byCourt[c]=byCourt[c]||[]).push(m); }));
    const proj = {};
    Object.keys(byCourt).forEach(c=>{
      const arr = byCourt[c].slice().sort(cmp);
      let cursor = null; // instant absolut (epoch ms) saat court bebas berikutnya
      arr.forEach(m=>{
        if(m.status==="DONE"){ const fin = m.updatedAt ? Date.parse(m.updatedAt) : NaN; if(!isNaN(fin)) cursor = (cursor==null)?fin:Math.max(cursor,fin); }
        else { const s = (cursor!=null) ? cursor : schedEpoch(m); if(s!=null){ proj[m.matchId] = s; cursor = s + est*60000; } }
      });
    });
    const now = Date.now();
    const playing = new Set();
    Object.keys(byCourt).forEach(c=>{
      const first = byCourt[c].slice().sort(cmp).find(m=>m.status!=="DONE");
      if(first && proj[first.matchId]!=null && now >= proj[first.matchId]) playing.add(first.matchId);
    });
    return { proj, playing, est };
  })();

  // Player picker — lets a player see only their own matches (within this
  // category). Hidden on the team-only board so no player names are shown at all.
  const players = playersInCat(cat);
  const sel = (state.player && players.some(p=>norm(p)===norm(state.player))) ? state.player : "";
  const playerCtl = TEAMS_ONLY ? "" : `<div class="schedctl"><label>Player</label>
    <select onchange="setPlayer(this.value)">
      <option value="">All matches</option>
      ${players.map(p=>`<option value="${esc(p)}" ${norm(p)===norm(sel)?'selected':''}>${esc(p)}</option>`).join("")}
    </select></div>`;

  // Group picker — lets anyone follow one group's matches. Groups belong to this
  // category, so the list is sorted by group (A, B, C …) and this filter narrows
  // to a single group's order of play.
  const groups = groupsInCat(cat);
  const groupVal = (state.group && groups.indexOf(state.group)>=0) ? state.group : "";
  const groupCtl = groups.length ? `<div class="schedctl"><label>Group</label>
    <select onchange="setGroup(this.value)">
      <option value="">All groups</option>
      ${groups.map(g=>`<option value="${esc(String(g))}" ${String(g)===String(groupVal)?'selected':''}>Group ${esc(String(g))}</option>`).join("")}
    </select></div>` : "";
  const hint = TEAMS_ONLY ? "" : `<p class="sched-hint">Select your name to see only your matches, or pick a group to see its order of play.</p>`;
  const ctl = hint + playerCtl + groupCtl;

  // Render one schedule row for match m (belonging to category mc). Optionally tag
  // it with its category (used in the cross-category court view).
  const rowOf = (mc, m, playing, mineSel, tagCat)=>{
    const done = m.status==="DONE";
    const aw = done && String(m.winner)===String(m.entrantA);
    const bw = done && String(m.winner)===String(m.entrantB);
    const liveNow = playing.has(m.matchId) && !done;
    const mine = mineSel && matchHasPlayer(mc,m,mineSel);
    const tag = tagCat ? ` · ${esc(catTabLabel(mc))}` : "";
    return `<div class="mrow ${done?'done':''} ${liveNow?'live-now':''} ${mine?'mine':''}">
      <div class="top">
        <span class="when"><span class="time">${matchDateLabel(m)} · ${ptime(m)}</span><span class="gl">Court ${esc(m.court)} · Group ${esc(m.groupLabel)}${tag}</span></span>
        ${liveNow?'<span class="badge-now">NOW PLAYING</span>':''}</div>
      <div class="team ${aw?'w':''}"><span class="nm">${teamNames(mc,m.entrantA,true)}</span><span class="sc">${done?esc(String(m.scoreA)):"–"}</span></div>
      <div class="vs">vs</div>
      <div class="team ${bw?'w':''}"><span class="nm">${teamNames(mc,m.entrantB,true)}</span><span class="sc">${done?esc(String(m.scoreB)):"–"}</span></div>
    </div>`;
  };

  // DEFAULT MODE (this category), sorted BY GROUP. Rows are grouped under a
  // "Group A / Group B …" header; within a group they stay in chronological order.
  // The Group picker narrows to one group, the Player picker to one player.
  if(!cat.schedule.length) return ctl + `<div class="schedempty">No group-stage schedule for this category yet.</div>`;
  // NOW PLAYING berbasis jam realtime WIB + proyeksi waktu (lihat live di atas):
  // per court, match belum-DONE paling awal menyala saat jam ≥ waktu-proyeksinya.
  const playing = live.playing;

  // Chronological order (by time), across all groups. The Group picker narrows to
  // one group, the Player picker to one player; each row still shows its group.
  let list = cat.schedule.slice().sort(cmp);
  if(groupVal) list = list.filter(m=>String(m.groupLabel)===String(groupVal));
  let nextCard = "";
  if(sel){
    list = list.filter(m=>matchHasPlayer(cat,m,sel));
    if(!list.length) return ctl + `<div class="schedempty">No matches for ${esc(sel)} in this category.</div>`;
    const next = list.find(m=>m.status!=="DONE");
    if(next){
      const oppId = entrantHasPlayer(cat,next.entrantA,sel) ? next.entrantB : next.entrantA;
      const isLive = playing.has(next.matchId);
      nextCard = `<div class="nextcard"><div class="lab">${isLive?"You're up now":"Your next match"}</div>
        <div class="big"><span class="t">${isLive?"LIVE":ptime(next)}</span><span class="c">Court ${esc(next.court)} · Group ${esc(next.groupLabel)}</span></div>
        <div class="opp">vs <b>${teamNames(cat,oppId,false)}</b></div></div>`;
    }
  }
  if(!list.length) return ctl + nextCard + `<div class="schedempty">No matches for Group ${esc(String(groupVal))} yet.</div>`;

  // Group the time-sorted rows into collapsible per-hour blocks so the board stays
  // short. Default-open: the active hour (earliest not-DONE match) and any hour with a
  // live match; all others collapse. When a player/group filter narrows the list we
  // expand everything. The open/closed choice is remembered across the 30s refresh.
  const hourOf = (m)=>{ const t=ptime(m); const mm=/^(\d{1,2}):/.exec(t); return mm ? (mm[1].padStart(2,"0")+":00") : ""; };
  const expandAll = !!(sel || groupVal);
  const liveHours = new Set(); list.forEach(m=>{ if(playing.has(m.matchId) && m.status!=="DONE") liveHours.add(hourOf(m)); });
  const firstPending = list.find(m=>m.status!=="DONE");
  const activeHour = firstPending ? hourOf(firstPending) : "";
  const isOpen = (hk)=>{ if(expandAll) return true; const u=state.openHours[hk]; if(u===true) return true; if(u===false) return false; return hk===activeHour || liveHours.has(hk); };
  const order=[], byHour={};
  list.forEach(m=>{ const hk=hourOf(m); if(!(hk in byHour)){ byHour[hk]=[]; order.push(hk); } byHour[hk].push(m); });
  let rows="";
  order.forEach(hk=>{
    const items=byHour[hk];
    const liveN=items.filter(m=>playing.has(m.matchId)&&m.status!=="DONE").length;
    const allDone=items.length && items.every(m=>m.status==="DONE");
    const label = hk || "Jadwal menyusul";
    const meta = `${items.length} match${liveN?` · ${liveN} main`:""}${allDone?" · selesai":""}`;
    const inner = items.map(m=>rowOf(cat, m, playing, sel, false)).join("");
    rows += `<details class="hourblk${liveN?' has-live':''}" data-hk="${esc(hk)}" ${isOpen(hk)?"open":""} ontoggle="onHourToggle(this)">`
      + `<summary class="hourhdr"><span class="hh">${esc(label)}</span><span class="hm">${esc(meta)}</span></summary>`
      + `<div class="hourbody">${inner}</div></details>`;
  });
  return ctl + nextCard + rows;
}

function renderStandings(cat){
  if(!cat.groups.length) return '<p class="empty">Groups not drawn yet.</p>';
  const N = cat.advancersPerGroup||0;
  const split = String(cat.format||"").toUpperCase()==="SPLIT";
  const pts = String(cat.rankMode||"wins")==="points";
  const rankNote = pts
    ? "Ranked by: points (win 3 · draw 1 · loss 0) → head-to-head → point difference → points for → points against"
    : "Ranked by: most wins → head-to-head → point difference → points for → points against";
  const decLabel = { h2h:"head-to-head", pd:"point difference (PD)", pf:"points for (PF)", pa:"points against (PA)" };
  return cat.groups.map(g=>{
    const denom = Math.max(1,(g.standings.length||1)-1);
    // Which stat columns acted as a tie-breaker anywhere in this group (so we can
    // flag the column header too).
    const decCols = new Set();
    g.standings.forEach(s=>{ if(s.tieBreak==='pd'||s.tieBreak==='pf'||s.tieBreak==='pa') decCols.add(s.tieBreak); });
    const rows = g.standings.map(s=>{
      const cls = split ? (s.rank<=N?'champ':'prosp') : (N&&s.rank<=N?'top':'');
      const pa = (s.ga!=null) ? s.ga : (Number(s.gf||0)-Number(s.gd||0));
      const dr = (s.draws!=null)?s.draws:0;
      const p = (s.points!=null)?s.points:(Number(s.wins||0)*3+Number(dr));
      // Tie-breaker chip after the pair name: head-to-head winner/loser for a 2-way
      // tie, or an "N-WAY" flag for a 3+ way tie (the deciding stat column is bolded).
      let tieChip = "";
      if(s.tieSize===2 && s.h2h){ tieChip = `<span class="tie ${s.h2h==='win'?'win':'lose'}">H2H ${s.h2h==='win'?'✓':'✗'}</span>`; }
      else if(s.tieSize>=3){ tieChip = `<span class="tie multi">${s.tieSize}-WAY</span>`; }
      else if(s.tieSize===2){ tieChip = `<span class="tie multi">TIE</span>`; }
      const dc = (k)=> s.tieBreak===k ? ' decide' : '';
      return `<tr class="${cls}">
        <td class="rk">${s.rank}</td>
        <td><span class="nmcell">${teamNames(cat,s.entrantId,false)}${tieChip}</span></td>
        <td class="num-c">${s.played}/${denom}</td><td class="num-c">${s.wins}</td>${pts?`<td class="num-c">${dr}</td>`:''}<td class="num-c">${s.losses}</td>
        <td class="num-c${dc('pd')}">${s.gd>0?'+':''}${s.gd}</td><td class="num-c${dc('pf')}">${s.gf}</td><td class="num-c${dc('pa')}">${pa}</td>${pts?`<td class="num-c pts-c"><b>${p}</b></td>`:''}</tr>`;
    }).join("");
    // Plain-language note of how each tie in this group was settled.
    const S = g.standings; const notes = []; let i = 0;
    while(i<S.length){
      const s = S[i];
      if(s.tieSize && s.tieSize>1){
        const sz = s.tieSize, tb = s.tieBreak; let j = i;
        while(j<S.length && S[j].tieSize===sz && S[j].tieBreak===tb && (j-i)<sz) j++;
        const r1 = S[i].rank, r2 = S[j-1].rank;
        const rng = r1===r2 ? `Rank ${r1}` : `Rank ${r1}–${r2}`;
        if(tb==='h2h' && sz===2) notes.push(`${rng}: decided by <b>head-to-head</b>.`);
        else if(tb && decLabel[tb]) notes.push(`${rng}: ${sz}-way tie → decided by <b>${decLabel[tb]}</b>.`);
        i = j;
      } else i++;
    }
    const note = notes.join(" · ");
    const advText = split
      ? `Rank 1${N>1?`–${N}`:''} → Championship Bracket · Rank ${N+1}+ → Prospect Bracket`
      : (N?`Top ${N} advance`:'');
    const cap = `<span>${advText?advText+' · ':''}${rankNote}</span>`;
    const thPD = `<th class="${decCols.has('pd')?'decide-h':''}">PD</th>`;
    const thPF = `<th class="${decCols.has('pf')?'decide-h':''}">PF</th>`;
    const thPA = `<th class="${decCols.has('pa')?'decide-h':''}">PA</th>`;
    return `<div class="tcardwrap"><div class="tscroll"><table class="stable"><caption>Group ${esc(g.label)}${cap}</caption>
      <thead><tr><th>#</th><th class="l">Pair</th><th>Played</th><th>Win</th>${pts?'<th>Draw</th>':''}<th>Lose</th>${thPD}${thPF}${thPA}${pts?'<th>Pts</th>':''}</tr></thead>
      <tbody>${rows}</tbody></table></div>${note?`<div class="deciderow">${note}</div>`:''}</div>`;
  }).join("");
}

const TIER = { MAIN:"Main Bracket", CHAMPION:"Champion", PROSPECT:"Prospect" };
function derivePodium(b){
  const lr=(b.rounds||[])[(b.rounds||[]).length-1];
  const fm=lr&&lr.matches&&lr.matches[0];
  let champion="",runnerUp="",third="";
  if(fm&&fm.status==="DONE"&&fm.winner){
    if(String(fm.winner)===String(fm.entrantA)){ champion=fm.teamA; runnerUp=fm.teamB; }
    else { champion=fm.teamB; runnerUp=fm.teamA; }
  }
  const bm=b.bronze;
  if(bm&&bm.status==="DONE"&&bm.winner){ third = String(bm.winner)===String(bm.entrantA)?bm.teamA:bm.teamB; }
  return {champion,runnerUp,third};
}
// Provisional qualification panel: confirmed names (clinched a spot) vs TBC.
// Supports overall top-N mode and per-group mode.
function qpRows(slots){
  return slots.map(s=>{
    const showGrp = s.group && (s.confirmed || s.kind==="direct");
    const grp = showGrp ? `<span class="qgrp">Grp ${esc(s.group)}</span>` : "";
    return `<div class="qrow ${s.confirmed?'ok':'tbc'}"><span class="qpos">${s.pos}</span>`
      + (s.confirmed ? `<span class="qnm">${esc(dispPair(s.team))}</span>${grp}<span class="qtag">✓</span>`
                     : `<span class="qnm tbc">TBC</span>${grp}`)
      + `</div>`;
  }).join("");
}
const ordinal = n => { const a=["th","st","nd","rd"], v=n%100; return n+(a[(v-20)%10]||a[v]||a[0]); };
// Rules box for the seed system (top-N overall with best-3rd wildcards). Shown on the
// bracket page so players understand how the 16 are chosen.
function bracketRulesBox(cat){
  const N = cat.topOverall||0; if(N<2) return "";
  const adv = cat.advancersPerGroup||2, ng = (cat.groups||[]).length; if(!ng) return "";
  const direct = Math.min(N, adv*ng), wild = Math.max(0, N-direct);
  if(wild<=0) return "";
  return `<div class="brulebox"><div class="bruleh">Qualification · Top ${N}</div>`
    + `<div class="brulebody">Top ${adv} of each group advance directly (<b>${direct}</b> teams). The last <b>${wild}</b> spot${wild>1?'s':''} go to the best ${wild} <b>${ordinal(adv+1)}-placed</b> team${wild>1?'s':''} across all groups, ranked by record (wins → point diff → points for → points against).</div></div>`;
}
function qualifyPanelHtml(cat){
  const q = cat.qualifyPanel;
  if(!q) return "";
  if(q.mode==="group"){
    if(!q.groups || !q.groups.length) return "";
    const blocks = q.groups.map(g=>`<div class="qgblk"><div class="qglabel">Group ${esc(g.label)}</div><div class="qgrid">${qpRows(g.slots)}</div></div>`).join("");
    return `<div class="qpanel"><div class="qhead">Provisional Playoff Qualification</div>`
      + `<div class="qcap">Top ${q.perGroupN} per group &middot; ✓ = already qualified &middot; TBC = still being contested</div>${blocks}</div>`;
  }
  if(!q.slots || !q.slots.length) return "";
  const head = `<div class="qhead">Provisional Qualification &middot; Top ${q.size}</div>`
    + `<div class="qcap">${q.confirmed}/${q.size} already qualified &middot; TBC = still being contested</div>`;
  // Legacy flat payload (no direct/wildcard split): render a single grid.
  if(q.directCount==null) return `<div class="qpanel">${head}<div class="qgrid">${qpRows(q.slots)}</div></div>`;
  const directSlots = q.slots.filter(s=>s.kind!=="wildcard");
  const wildSlots = q.slots.filter(s=>s.kind==="wildcard");
  const sec=(t,sl)=> sl.length ? `<div class="qsec"><div class="qseclabel">${t}</div><div class="qgrid">${qpRows(sl)}</div></div>` : "";
  return `<div class="qpanel">${head}`
    + sec(`Direct &middot; top ${q.adv} of each group`, directSlots)
    + (q.wildCount>0 ? sec(`Wildcard &middot; best ${q.wildCount} ${ordinal(q.adv+1)} place`, wildSlots) : "")
    + `</div>`;
}
function renderBracket(cat){
  const rules = bracketRulesBox(cat);
  const panel = qualifyPanelHtml(cat);
  if(!cat.playoff.length){
    // Before the playoff starts: rules + provisional qualification, then the PROJECTED
    // bracket (mis. "Winner Grup A × Runner-up Grup B" / seed labels). Proyeksi memakai
    // pasangan bracket yang sebenarnya dari backend (bukan tebakan), jadi tidak ambigu.
    const proj = (cat.playoffProjection && cat.playoffProjection.length) ? renderBracketProjection(cat.playoffProjection) : "";
    const pre = rules + panel + proj;
    return pre.trim() ? pre : '<p class="empty">Playoff bracket not available yet.</p>';
  }
  return rules + panel + cat.playoff.map(b=>{
    const pd = derivePodium(b);
    const pod = (pd.champion||pd.runnerUp||pd.third) ? `<div class="podium">
      <div class="pod g"><div class="rk">🏆 Champion</div><div class="who">${esc(dispPair(pd.champion))||"—"}</div></div>
      <div class="pod s"><div class="rk">Runner-up</div><div class="who">${esc(dispPair(pd.runnerUp))||"—"}</div></div>
      <div class="pod b"><div class="rk">3rd Place</div><div class="who">${esc(dispPair(pd.third))||"—"}</div></div></div>` : "";
    const rounds = b.rounds.map(r=>`<div class="pround"><h4>${roundLabel(r.round,b.numRounds)}</h4>${r.matches.map(m=>pmatch(cat,m)).join("")}</div>`).join("");
    const bronze = b.bronze ? `<div class="pround"><h4>${roundLabel("BRONZE",b.numRounds)}</h4>${pmatch(cat,b.bronze)}</div>`:"";
    return `<div class="tier"><h3><span class="tg">${TIER[b.tier]||b.tier}</span> ${b.nQual} teams</h3>${pod}${rounds}${bronze}</div>`;
  }).join("");
}
// Projected bracket: placeholder seeds (e.g. "Winner Group A" vs "Runner-up Group C")
// shown before the group stage finishes. No scores, no tap targets.
function renderBracketProjection(proj){
  const note = `<div class="projnote">Projected playoff bracket &middot; player names appear once the group stage finishes</div>`;
  const body = proj.map(b=>{
    const rounds = b.rounds.map(r=>`<div class="pround"><h4>${roundLabel(r.round,b.numRounds)}</h4>${r.matches.map(pmatchProj).join("")}</div>`).join("");
    const bronze = b.bronze ? `<div class="pround"><h4>${roundLabel("BRONZE",b.numRounds)}</h4>${pmatchProj(b.bronze)}</div>`:"";
    return `<div class="tier proj"><h3><span class="tg">${TIER[b.tier]||b.tier}</span> ${b.nQual} teams</h3>${rounds}${bronze}</div>`;
  }).join("");
  return note+body;
}
function pmatchProj(m){
  const bye = m.status==="BYE";
  const nameA = m.teamA ? esc(m.teamA) : '<span class="tbd">TBD</span>';
  const nameB = m.teamB ? esc(m.teamB) : (bye ? '' : '<span class="tbd">TBD</span>');
  return `<div class="pmatch proj ${bye?'bye':''}">
    <div class="pline"><span class="pnm">${nameA}</span><span class="sc">${bye?'BYE':''}</span></div>
    <div class="pline"><span class="pnm">${nameB}</span><span class="sc"></span></div></div>`;
}
function pmatch(cat,m){
  const bye = m.status==="BYE", done = m.status==="DONE";
  const aw = done && String(m.winner)===String(m.entrantA);
  const bw = done && String(m.winner)===String(m.entrantB);
  const nameA = m.entrantA ? teamNames(cat,m.entrantA,true) : '<span class="tbd">TBD</span>';
  const nameB = m.entrantB ? teamNames(cat,m.entrantB,true) : '<span class="tbd">TBD</span>';
  const scA = done?esc(String(m.scoreA)):""; const scB = done?esc(String(m.scoreB)):"";
  const parts=[];
  if(!bye){
    if(m.date) parts.push(matchDateLabel(m));
    if(m.time) parts.push(esc(fmtTime(m.time)));
    if(m.court) parts.push("Court "+esc(String(m.court)));
  }
  const meta = parts.length ? `<div class="pmmeta">${parts.join(" · ")}</div>` : "";
  return `<div class="pmatch ${bye?'bye':''}">${meta}
    <div class="pline ${aw?'w':''}"><span class="pnm">${nameA}</span><span class="sc">${bye?'BYE':scA}</span></div>
    <div class="pline ${bw?'w':''}"><span class="pnm">${nameB}</span><span class="sc">${scB}</span></div></div>`;
}

function fmtTime(t){ const s=String(t==null?"":t).trim(); if(!s) return ""; const ap=/(am|pm)/i.exec(s); const x=s.replace(/\s*(am|pm)/i,"").trim(); const pp=x.split(/[:.]/); let h=parseInt(pp[0],10), m=parseInt(pp[1],10); if(isNaN(h)) return s; if(isNaN(m)) m=0; if(ap){const pm=/pm/i.test(ap[0]); if(pm&&h<12)h+=12; if(!pm&&h===12)h=0;} h=((h%24)+24)%24; m=((m%60)+60)%60; return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }

// Static schedule times (same as the TV board): each group match = event start time +
// slot * admin match duration. Match 0 = start (e.g. 11:00), match 1 = +15min, and so on.
// No server-time or actual-pace adjustment.
// Day + date label for a match, e.g. "Sab, 12 Jul". Falls back to the event date.
const HARI=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], BULAN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function matchDateLabel(m){
  const ds = (m&&m.date) || (state.data&&state.data.event&&state.data.event.date) || "";
  if(!ds) return "";
  const d=new Date(String(ds)+"T00:00:00");
  if(isNaN(d.getTime())) return esc(ds);
  return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]}`;
}
function timeToMin(t){ const s=fmtTime(t); if(!s) return null; const p=s.split(":"); return (parseInt(p[0])||0)*60+(parseInt(p[1])||0); }
function minToTime(x){ x=((Math.round(x)%1440)+1440)%1440; return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0"); }
// Build a natural-time -> wall-clock shifter for up to 4 optional breaks.
function makeBreakShift(ev){
  const raw = (Array.isArray(ev.breaks) && ev.breaks.length) ? ev.breaks
            : ((ev.breakStart||ev.breakEnd) ? [{start:ev.breakStart,end:ev.breakEnd}] : []);
  const valid = raw.map(b=>({s:timeToMin(b.start),e:timeToMin(b.end)})).filter(b=>b.s!=null&&b.e!=null&&b.e>b.s).sort((a,b)=>a.s-b.s);
  const nb=[]; let acc=0;
  for(const b of valid){ nb.push({nat:b.s-acc, dur:b.e-b.s}); acc+=b.e-b.s; }
  return (tN)=>{ let add=0; for(const x of nb) if(tN>=x.nat) add+=x.dur; return tN+add; };
}
function predictTimes(){
  const ev=state.data.event||{};
  const mm=parseInt(ev.matchMinutes)||15;
  const startMin=timeToMin(ev.startTime);
  if(startMin==null) return {};   // no start time -> fall back to stored m.time
  const shift=makeBreakShift(ev);
  const pred={};
  (state.data.categories||[]).forEach(c=>(c.schedule||[]).forEach(m=>{ pred[m.matchId]=minToTime(shift(startMin+(m.slot||0)*mm)); }));
  return pred;
}

// Player filter helpers
function entrantHasPlayer(cat,eid,p){ const e=cat.entrants[eid]; return !!(e && (norm(e.player1)===norm(p)||norm(e.player2)===norm(p))); }
function matchHasPlayer(cat,m,p){ return entrantHasPlayer(cat,m.entrantA,p)||entrantHasPlayer(cat,m.entrantB,p); }
function playersInCat(cat){ const seen=new Map(); Object.values(cat.entrants||{}).forEach(e=>{ [e&&e.player1,e&&e.player2].forEach(p=>{ if(p&&!seen.has(norm(p))) seen.set(norm(p),p); }); }); return [...seen.values()].sort((a,b)=>a.localeCompare(b)); }
function setPlayer(name){ state.player=name||""; if(state.player) state.group=""; try{ if(state.player) localStorage.setItem("trekkr_player_"+EVENT_ID,state.player); else localStorage.removeItem("trekkr_player_"+EVENT_ID); }catch(e){} renderBody(); }
// Distinct group labels in a category (from its drawn groups, falling back to the
// labels seen in its schedule), naturally sorted (A, B, C …).
function groupsInCat(cat){
  const seen=new Map();
  ((cat&&cat.groups)||[]).forEach(g=>{ const l=g&&g.label; if(l!=null && String(l).trim()!=="" && !seen.has(String(l))) seen.set(String(l),String(l)); });
  ((cat&&cat.schedule)||[]).forEach(m=>{ const l=m.groupLabel; if(l!=null && String(l).trim()!=="" && !seen.has(String(l))) seen.set(String(l),String(l)); });
  return [...seen.values()].sort((a,b)=>String(a).localeCompare(String(b), undefined, {numeric:true}));
}
// Group and player are mutually exclusive filters: choosing a group clears the
// per-player filter so the group's full order of play is shown.
function setGroup(v){ state.group=v||""; if(state.group) state.player=""; renderBody(); }
// Remember which hour blocks the viewer opened/closed so the 30s auto-refresh
// (which re-renders the list) doesn't reset their folds.
function onHourToggle(el){ try{ state.openHours[el.getAttribute("data-hk")||""] = el.open; }catch(e){} }

// Sponsor banner: one static image at the bottom of every tab, full width edge-to-edge,
// from the "Sponsors" tab column B (separate from the TV reel). Set up once, no rotation.
let _spReady=false;
function setupSponsorBanner(){
  if(_spReady) return;
  const url = (state.data && state.data.mobileBanner) ? String(state.data.mobileBanner) : "";
  if(!url) return;
  _spReady=true;
  const box=document.getElementById("sponsorBanner"), img=document.getElementById("spbImg");
  img.onerror=()=>{ box.classList.remove("show"); };
  img.src=url;
  box.classList.add("show");
}

async function load(){
  try{
    // live=1 → short-cache response so the board tracks the engine within seconds
    // after a (re)generated schedule, instead of a ~1-min CDN-cached lag.
    const d = await api("/tournament/event/"+encodeURIComponent(EVENT_ID)+"/public?live=1");
    state.data = d;
    document.getElementById("evhead").innerHTML =
      `<div class="evname">${esc(d.event.name||"Tournament")}</div>
       <div class="evmeta">${esc([d.event.venue,d.event.date].filter(Boolean).join(" · "))}</div>`;
    document.getElementById("live").innerHTML = `<b>● LIVE</b><br>updated ${new Date().toLocaleTimeString("en-GB")}`;
    if(state.cat >= d.categories.length) state.cat = 0;
    renderTabs(); renderBody(); setupSponsorBanner();
  }catch(e){ document.getElementById("body").innerHTML = '<p class="empty">Failed to load data.</p>'; }
}

async function pickEvent(){
  try{
    const { events } = await api("/tournament/events");
    const list = (events||[]).slice().reverse();
    document.getElementById("body").innerHTML = list.length ? `<div class="picker">${list.map(e=>
      `<a href="/mobile/${encodeURIComponent(slugify(e.name))}"><div class="pn">${esc(e.name)}</div><div class="pm">${esc([e.venue,e.date].filter(Boolean).join(" · "))}</div></a>`).join("")}</div>`
      : '<p class="empty">No events yet.</p>';
  }catch(e){ document.getElementById("body").innerHTML='<p class="empty">Failed to load events.</p>'; }
}

// Resolve a friendly /mobile/<slug> path to an event id via the event list.
async function resolveEventId(){
  if(EVENT_ID) return EVENT_ID;
  const slug = slugFromPath();
  if(!slug) return null;
  try{
    const { events } = await api("/tournament/events");
    // Match the FROZEN slug first (an event can be renamed without moving its URL),
    // then fall back to the name-derived slug for older links.
    const matches = (events||[]).filter(e=>(e.slug||slugify(e.name))===slug);
    if(matches.length) return matches[matches.length-1].eventId; // newest on name collision
  }catch(e){}
  return null;
}
(async function boot(){
  EVENT_ID = await resolveEventId();
  if(EVENT_ID){
    try{ state.player = localStorage.getItem("trekkr_player_"+EVENT_ID) || ""; }catch(e){}
    load(); setInterval(load, 30000);
  } else {
    document.getElementById("evhead").innerHTML='<div class="evname">Select Event</div>'; pickEvent();
  }
})();
</script>
