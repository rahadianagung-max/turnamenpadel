<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Konfirmasi Klaim · TurnamenPadel</title>
<style>
  :root{--bg:#0A0A0B;--panel:#141416;--line:#2A2A2E;--text:#F5F5F7;--muted:#A1A1AA;--accent:#FF6A00;--ok:#3ad19b;--danger:#ff6f60;
    --display:'Saira Condensed','Arial Narrow',sans-serif;--body:'Plus Jakarta Sans',system-ui,sans-serif;color-scheme:dark;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);
    min-height:100vh;display:grid;place-items:center;padding:20px;
    background-image:radial-gradient(700px 380px at 80% -10%,rgba(255,106,0,.16),transparent 60%);}
  .card{max-width:420px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center;box-shadow:0 20px 60px -24px #000}
  .logo{font-family:var(--display);font-weight:800;font-size:22px;margin-bottom:14px}.logo .dot{color:var(--accent)}
  .big{font-size:46px} h1{font-family:var(--display);font-size:24px;margin:8px 0}
  p{color:var(--muted);font-size:14px;line-height:1.6} b{color:var(--text)}
  a.btn{display:inline-block;margin-top:14px;background:var(--accent);color:#0A0A0B;font-weight:800;text-decoration:none;padding:11px 18px;border-radius:10px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">turnamen<span class="dot">.</span>padel</div>
  <div id="body"><div class="big">⏳</div><h1>Memproses…</h1><p>Mengonfirmasi klaim profilmu.</p></div>
</div>
<script>
(async function(){
  const token = new URLSearchParams(location.search).get("token") || "";
  const el = document.getElementById("body");
  const show = (icon,title,msg)=>{ el.innerHTML='<div class="big">'+icon+'</div><h1>'+title+'</h1><p>'+msg+'</p><a class="btn" href="/">Ke beranda</a>'; };
  if(!token){ show("⚠️","Link tidak valid","Token tidak ditemukan."); return; }
  try{
    const res = await fetch("/api/reg/claim/confirm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token})});
    const d = await res.json().catch(()=>({}));
    if(res.ok && d.success){ show("✅","Klaim berhasil!","Profil <b>"+(d.playerName||"")+"</b> kini terverifikasi sebagai milikmu."+(d.already?" (sudah dikonfirmasi sebelumnya)":"")); }
    else if(res.status===410){ show("⌛","Link kedaluwarsa",(d.error||"Ajukan klaim lagi.")); }
    else { show("⚠️","Gagal",(d.error||"Tidak bisa mengonfirmasi klaim.")); }
  }catch(e){ show("⚠️","Gagal",String(e.message||e)); }
})();
</script>
</body>
</html>
