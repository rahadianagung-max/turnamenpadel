<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Konfirmasi Klaim · TurnamenPadel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/tp-theme.css"/>
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:20px}
  .wrap{max-width:440px;width:100%}
  .card{text-align:center;padding:32px}
  .logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:18px}
  .logo .glyph{width:36px;height:36px;border-radius:var(--r-lg);background:var(--orange);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:16px;border:var(--bd)}
  .logo .name{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:-.01em}
  .logo .name b{color:var(--orange)}
  .big{font-size:48px;line-height:1;margin-bottom:4px}
  h1{font-family:var(--display);font-weight:900;font-size:24px;margin:8px 0}
  p{color:var(--slate-600);font-size:14px;line-height:1.6;margin:0} b{color:var(--dark)}
  .btn{margin-top:18px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="logo"><span class="glyph">P</span><span class="name">TURNAMEN<b>PADEL</b></span></div>
  <div id="body"><div class="big">⏳</div><h1>Memproses…</h1><p>Mengonfirmasi klaim profilmu.</p></div>
</div></div>
<script>
(async function(){
  const token = new URLSearchParams(location.search).get("token") || "";
  const el = document.getElementById("body");
  const show = (icon,title,msg)=>{ el.innerHTML='<div class="big">'+icon+'</div><h1>'+title+'</h1><p>'+msg+'</p><a class="btn btn--primary btn--upper" href="/">Ke beranda</a>'; };
  if(!token){ show("⚠️","Link tidak valid","Token tidak ditemukan."); return; }
  try{
    const res = await fetch("/api/reg/claim/confirm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token})});
    const d = await res.json().catch(()=>({}));
    if(res.ok && d.success){ show("✅","Klaim berhasil!","Profil <b>"+(d.playerName||"")+"</b> kini terverifikasi sebagai milikmu."+(d.already?" (sudah dikonfirmasi sebelumnya)":"")); }
    else if(res.status===410){ show("⌛","Link kedaluwarsa",(d.error||"Ajukan klaim lagi.")); }
    else { show("⚠️","Gagal",(d.error||"Tidak bisa mengonfirmasi klaim.")); }
  }catch(e){ show("⚠️","Gagal",String(e.message||e)); }
})();
</script>
</body>
</html>
